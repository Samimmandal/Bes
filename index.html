<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <title>Bes An Noor · Music‑style</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com">
  </script>
  <!-- React + ReactDOM UMD -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js">
  </script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js">
  </script>
  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js">
  </script>
  <!-- Firebase Compat -->
  <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js">
  </script>
  <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-auth-compat.js">
  </script>
  <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore-compat.js">
  </script>

  <style>
    * {
      box-sizing: border-box;
    }
    body {
      background: #0b0b0e;
      font-family: -apple-system, 'Inter', system-ui, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
    }
    #root {
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      min-height: 100vh;
      position: relative;
      background: #0b0b0e;
    }
    .pb-safe {
      padding-bottom: env(safe-area-inset-bottom, 0.75rem);
    }
    .animate-in {
      animation: fadeSlide 0.25s ease-out;
    }
    @keyframes fadeSlide {
      0% {
        opacity: 0;
        transform: translateY(8px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }
    /* custom scroll */
    .overflow-y-auto::-webkit-scrollbar {
      width: 3px;
    }
    .overflow-y-auto::-webkit-scrollbar-thumb {
      background: #3a3a3f;
      border-radius: 12px;
    }
    /* icon helpers */
    .icon-svg {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .icon-svg svg {
      width: 1.25em;
      height: 1.25em;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .icon-svg-lg svg {
      width: 1.5em;
      height: 1.5em;
    }
    /* Apple Music style card */
    .am-card {
      background: #1c1c1e;
      border-radius: 16px;
      transition: transform 0.15s ease;
    }
    .am-card:active {
      transform: scale(0.97);
    }
    .am-tab {
      background: rgba(20, 20, 23, 0.85);
      backdrop-filter: saturate(180%) blur(20px);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }
    .am-header {
      background: rgba(11, 11, 14, 0.92);
      backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }
    /* gradient accent */
    .am-gradient {
      background: linear-gradient(145deg, #ff2d55, #ff3b30);
    }
  </style>
</head>
<body>

  <div id="root"></div>

  <script type="text/babel">
    // ─── REACT + ICONS ────────────────────────────────────────
    const { useState, useEffect, useCallback } = React;

    // SVG icons (same as before but we keep them)
    const IconHome = ({ size, className }) => <span className={`icon-svg ${className || ''}`}><svg viewBox="0 0 24 24" width={size || 20} height={size || 20}><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg></span>;
    const IconClipboard = ({ size, className }) => <span className={`icon-svg ${className || ''}`}><svg viewBox="0 0 24 24" width={size || 20} height={size || 20}><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" /><path d="M9 13l2 2 4-4" /></svg></span>;
    const IconCalendar = ({ size, className }) => <span className={`icon-svg ${className || ''}`}><svg viewBox="0 0 24 24" width={size || 20} height={size || 20}><rect x="3" y="4" width="18" height="18" rx="2" ry="2" /><line x1="16" y1="2" x2="16" y2="6" /><line x1="8" y1="2" x2="8" y2="6" /><line x1="3" y1="10" x2="21" y2="10" /></svg></span>;
    const IconUser = ({ size, className }) => <span className={`icon-svg ${className || ''}`}><svg viewBox="0 0 24 24" width={size || 20} height={size || 20}><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" /><circle cx="12" cy="7" r="4" /></svg></span>;
    const IconStethoscope = ({ size, className }) => <span className={`icon-svg ${className || ''}`}><svg viewBox="0 0 24 24" width={size || 20} height={size || 20}><path d="M4.5 9.5a5 5 0 0110 0v3.5a5 5 0 01-10 0V9.5z" /><path d="M9.5 14.5v3a4 4 0 004 4h2a4 4 0 004-4v-3" /><circle cx="19.5" cy="9.5" r="1.5" /></svg></span>;
    const IconWrench = ({ size, className }) => <span className={`icon-svg ${className || ''}`}><svg viewBox="0 0 24 24" width={size || 20} height={size || 20}><path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z" /></svg></span>;
    const IconLogOut = ({ size, className }) => <span className={`icon-svg ${className || ''}`}><svg viewBox="0 0 24 24" width={size || 20} height={size || 20}><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4" /><polyline points="16 17 21 12 16 7" /><line x1="21" y1="12" x2="9" y2="12" /></svg></span>;
    const IconPlusCircle = ({ size, className }) => <span className={`icon-svg ${className || ''}`}><svg viewBox="0 0 24 24" width={size || 20} height={size || 20}><circle cx="12" cy="12" r="10" /><line x1="12" y1="8" x2="12" y2="16" /><line x1="8" y1="12" x2="16" y2="12" /></svg></span>;
    const IconCheckCircle = ({ size, className }) => <span className={`icon-svg ${className || ''}`}><svg viewBox="0 0 24 24" width={size || 20} height={size || 20}><path d="M22 11.08V12a10 10 0 11-5.93-9.14" /><polyline points="22 4 12 14.01 9 11.01" /></svg></span>;
    const IconAlertCircle = ({ size, className }) => <span className={`icon-svg ${className || ''}`}><svg viewBox="0 0 24 24" width={size || 20} height={size || 20}><circle cx="12" cy="12" r="10" /><line x1="12" y1="8" x2="12" y2="12" /><line x1="12" y1="16" x2="12.01" y2="16" /></svg></span>;
    const IconFileText = ({ size, className }) => <span className={`icon-svg ${className || ''}`}><svg viewBox="0 0 24 24" width={size || 20} height={size || 20}><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z" /><polyline points="14 2 14 8 20 8" /><line x1="16" y1="13" x2="8" y2="13" /><line x1="16" y1="17" x2="8" y2="17" /><polyline points="10 9 9 9 8 9" /></svg></span>;
    const IconBell = ({ size, className }) => <span className={`icon-svg ${className || ''}`}><svg viewBox="0 0 24 24" width={size || 20} height={size || 20}><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9" /><path d="M13.73 21a2 2 0 01-3.46 0" /></svg></span>;

    // ─── FIREBASE SETUP (stub) ───────────────────────────────
    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyDemoKeyPlaceholder",
      authDomain: "your-app.firebaseapp.com",
      projectId: "your-project-id",
      storageBucket: "your-app.appspot.com",
      messagingSenderId: "123456789",
      appId: "1:123456789:web:abcdef"
    };
    const APP_ID = 'bes-an-noor-app';
    let firebaseApp, auth, db;
    try {
      firebaseApp = firebase.initializeApp(FIREBASE_CONFIG);
      auth = firebase.auth();
      db = firebase.firestore();
    } catch (e) {
      console.warn("Firebase init skipped (demo).");
      auth = { currentUser: null, onAuthStateChanged: () => {} };
      db = { collection: () => ({ doc: () => ({ collection: () => ({ onSnapshot: () => {} }) }) }) };
    }

    // ─── MOCK CREDENTIALS ────────────────────────────────────
    const MOCK_CREDENTIALS = {
      'admin': { role: 'ADMIN', name: 'Head of Dept', pass: '123' },
      't1': { role: 'TEACHER', name: 'Mr. Rahman (Maths)', pass: '123' },
      't2': { role: 'TEACHER', name: 'Mr. Khan (Physics)', pass: '123' },
      'doc': { role: 'DOCTOR', name: 'Dr. Ali', pass: '123' },
      'maint': { role: 'MAINTENANCE', name: 'Campus Facilities', pass: '123' },
      'stu1': { role: 'STUDENT', name: 'Ahmad Abdullah', class: 'Class 10-A', reg: 'BAN-2023-1042', pass: '123' },
    };

    // ─── CUSTOM HOOK ──────────────────────────────────────────
    function usePublicCollection(collectionName) {
      const [data, setData] = useState([]);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        if (!auth || !auth.currentUser) {
          setLoading(false);
          return;
        }
        try {
          const colRef = db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection(collectionName);
          const unsubscribe = colRef.onSnapshot(
            (snapshot) => {
              const items = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
              items.sort((a, b) => {
                const ta = a.createdAt?.toMillis?.() || 0;
                const tb = b.createdAt?.toMillis?.() || 0;
                return tb - ta;
              });
              setData(items);
              setLoading(false);
            },
            (error) => {
              console.error(`Error fetching ${collectionName}:`, error);
              setLoading(false);
            }
          );
          return () => unsubscribe();
        } catch (e) {
          console.warn("Firestore not available, using mock data for", collectionName);
          setLoading(false);
          return () => {};
        }
      }, [collectionName]);

      const addDocument = useCallback(async (docData) => {
        try {
          const colRef = db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection(collectionName);
          await colRef.add({ ...docData, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
        } catch (e) {
          console.error("Error adding document:", e);
        }
      }, [collectionName]);

      const updateDocument = useCallback(async (docId, updateData) => {
        try {
          const docRef = db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection(collectionName).doc(docId);
          await docRef.update(updateData);
        } catch (e) {
          console.error("Error updating document:", e);
        }
      }, [collectionName]);

      return { data, loading, addDocument, updateDocument };
    }

    // ─── MAIN APP ──────────────────────────────────────────────
    function App() {
      const [firebaseUser, setFirebaseUser] = useState(null);
      const [appProfile, setAppProfile] = useState(null);
      const [activeTab, setActiveTab] = useState('home');

      useEffect(() => {
        if (!auth || !auth.onAuthStateChanged) return;
        const unsub = auth.onAuthStateChanged((user) => {
          setFirebaseUser(user);
        });
        if (auth.signInAnonymously) {
          auth.signInAnonymously().catch(() => {});
        }
        return () => unsub && unsub();
      }, []);

      const handleLogin = (username, password) => {
        const user = MOCK_CREDENTIALS[username];
        if (user && user.pass === password) {
          setAppProfile({ ...user, id: username });
        } else {
          alert("Invalid credentials. Use demo accounts (e.g. admin / 123)");
        }
      };

      const handleLogout = () => {
        setAppProfile(null);
        setActiveTab('home');
      };

      if (!firebaseUser && firebaseUser !== null) {
        return <div className="flex h-screen items-center justify-center text-white font-semibold">Connecting...</div>;
      }

      if (!appProfile) {
        return <LoginScreen onLogin={handleLogin} />;
      }

      return (
        <div className="flex flex-col h-screen bg-[#0b0b0e] text-white font-sans max-w-md mx-auto relative overflow-hidden">
          {/* Header - Apple Music style */}
          <header className="am-header px-5 py-4 flex justify-between items-center z-10">
            <div>
              <h1 className="text-2xl font-bold tracking-tight">Bes An Noor</h1>
              <p className="text-xs text-[#8e8e93]">Model School · Boys' Unit</p>
            </div>
            <div className="flex items-center gap-3">
              <div className="w-9 h-9 rounded-full bg-[#2c2c2e] flex items-center justify-center overflow-hidden border border-[#3a3a3c]">
                <IconUser size={18} className="text-[#8e8e93]" />
              </div>
              <button onClick={handleLogout} className="p-1.5 rounded-full bg-[#2c2c2e] hover:bg-[#3a3a3c] transition">
                <IconLogOut size={18} className="text-[#8e8e93]" />
              </button>
            </div>
          </header>

          <main className="flex-1 overflow-y-auto px-4 pb-28 pt-2">
            {activeTab === 'home' && <HomeTab profile={appProfile} />}
            {activeTab === 'notices' && <NoticesTab profile={appProfile} />}
            {activeTab === 'schedule' && <ScheduleTab profile={appProfile} />}
            {activeTab === 'issues' && <IssuesTab profile={appProfile} />}
          </main>

          {/* Bottom Tab Bar - Apple Music style */}
          <nav className="am-tab absolute bottom-0 w-full flex justify-around items-center px-2 py-2 pb-safe z-20">
            <TabButton icon={<IconHome />} label="Home" active={activeTab === 'home'} onClick={() => setActiveTab('home')} />
            <TabButton icon={<IconClipboard />} label="Notices" active={activeTab === 'notices'} onClick={() => setActiveTab('notices')} />
            <TabButton icon={<IconCalendar />} label="Proxy" active={activeTab === 'schedule'} onClick={() => setActiveTab('schedule')} />
            {['TEACHER', 'DOCTOR', 'MAINTENANCE'].includes(appProfile.role) && (
              <TabButton icon={<IconAlertCircle />} label="Issues" active={activeTab === 'issues'} onClick={() => setActiveTab('issues')} />
            )}
          </nav>
        </div>
      );
    }

    // ─── LOGIN SCREEN (Apple Music style) ──────────────────
    function LoginScreen({ onLogin }) {
      const [id, setId] = useState('');
      const [pass, setPass] = useState('');

      return (
        <div className="flex flex-col h-screen bg-[#0b0b0e] max-w-md mx-auto p-6 justify-center text-white">
          <div className="text-center mb-12">
            <div className="w-24 h-24 mx-auto rounded-3xl bg-gradient-to-br from-red-500 to-pink-500 flex items-center justify-center shadow-2xl mb-6">
              <IconUser size={48} className="text-white" />
            </div>
            <h1 className="text-4xl font-bold tracking-tight">Bes An Noor</h1>
            <p className="text-[#8e8e93] mt-2 text-sm">Boys' Unit · School Portal</p>
          </div>

          <div className="bg-[#1c1c1e] rounded-2xl p-6 shadow-xl">
            <h2 className="text-lg font-semibold mb-4 text-[#f5f5f7]">Sign In</h2>
            <input
              type="text"
              placeholder="Login ID (admin, t1, stu1)"
              className="w-full p-3 mb-4 bg-[#2c2c2e] border border-[#3a3a3c] rounded-xl text-white placeholder-[#8e8e93] focus:outline-none focus:ring-2 focus:ring-red-500"
              value={id}
              onChange={(e) => setId(e.target.value)}
            />
            <input
              type="password"
              placeholder="Password (123)"
              className="w-full p-3 mb-6 bg-[#2c2c2e] border border-[#3a3a3c] rounded-xl text-white placeholder-[#8e8e93] focus:outline-none focus:ring-2 focus:ring-red-500"
              value={pass}
              onChange={(e) => setPass(e.target.value)}
            />
            <button
              onClick={() => onLogin(id, pass)}
              className="w-full bg-gradient-to-r from-red-500 to-pink-500 text-white font-bold p-3 rounded-xl hover:opacity-90 transition shadow-lg"
            >
              Continue
            </button>
          </div>

          <div className="mt-8 text-sm text-[#8e8e93] bg-[#1c1c1e] p-4 rounded-xl border border-[#2c2c2e]">
            <p className="font-semibold text-[#f5f5f7] mb-2">Demo Accounts (pass: 123)</p>
            <ul className="grid grid-cols-2 gap-1 text-xs">
              <li><b>admin</b> (Head)</li>
              <li><b>t1</b> (Teacher)</li>
              <li><b>doc</b> (Doctor)</li>
              <li><b>maint</b> (Facility)</li>
              <li><b>stu1</b> (Student)</li>
            </ul>
          </div>
        </div>
      );
    }

    // ─── TAB BUTTON ──────────────────────────────────────────
    function TabButton({ icon, label, active, onClick }) {
      return (
        <button
          onClick={onClick}
          className={`flex flex-col items-center justify-center w-16 gap-0.5 transition-colors ${active ? 'text-red-500' : 'text-[#8e8e93] hover:text-white'}`}
        >
          <div className={`${active ? 'text-red-500' : ''}`}>
            {icon}
          </div>
          <span className={`text-[10px] font-medium ${active ? 'opacity-100' : 'opacity-80'}`}>{label}</span>
        </button>
      );
    }

    // ─── HOME TAB ─────────────────────────────────────────────
    function HomeTab({ profile }) {
      if (profile.role === 'STUDENT') {
        return (
          <div className="space-y-6">
            {/* Large hero card */}
            <div className="relative rounded-2xl overflow-hidden bg-gradient-to-r from-red-600 to-pink-600 p-6 shadow-2xl">
              <div className="absolute right-0 top-0 w-32 h-32 rounded-full bg-white/10 blur-2xl -translate-y-1/2 translate-x-1/2"></div>
              <div className="relative z-10 flex items-center gap-4">
                <div className="w-16 h-16 rounded-full bg-white/20 flex items-center justify-center border-2 border-white/30">
                  <IconUser size={32} className="text-white" />
                </div>
                <div>
                  <h2 className="text-2xl font-bold">{profile.name}</h2>
                  <p className="text-sm text-white/80">{profile.class}</p>
                  <p className="text-xs text-white/60 mt-1 font-mono">{profile.reg}</p>
                </div>
              </div>
            </div>

            <h3 className="font-semibold text-[#f5f5f7] ml-1 text-lg">Quick Actions</h3>
            <div className="grid grid-cols-2 gap-4">
              <ActionCard icon={<IconClipboard className="text-orange-400" />} title="Notices" subtitle="Important updates" />
              <ActionCard icon={<IconCalendar className="text-blue-400" />} title="Routine" subtitle="Today's schedule" />
            </div>
          </div>
        );
      }

      return (
        <div className="space-y-6">
          <div className="am-card p-5 flex items-center gap-4 shadow-md">
            <div className="w-14 h-14 rounded-full bg-gradient-to-br from-red-500 to-pink-500 flex items-center justify-center shadow-lg">
              <IconUser size={24} className="text-white" />
            </div>
            <div>
              <h2 className="font-bold text-lg text-[#f5f5f7]">Welcome back,</h2>
              <p className="text-[#8e8e93] text-sm">{profile.name}</p>
            </div>
          </div>

          <TeacherAttendance profile={profile} />

          <h3 className="font-semibold text-[#f5f5f7] ml-1 text-lg mt-6">Overview</h3>
          <div className="grid grid-cols-2 gap-4">
            {profile.role === 'ADMIN' && (
              <>
                <ActionCard icon={<IconCalendar className="text-blue-400" />} title="Proxy" subtitle="Assign teachers" />
                <ActionCard icon={<IconBell className="text-orange-400" />} title="Notice" subtitle="Post announcement" />
              </>
            )}
            {profile.role === 'TEACHER' && (
              <>
                <ActionCard icon={<IconStethoscope className="text-red-400" />} title="Medical" subtitle="Report issue" />
                <ActionCard icon={<IconWrench className="text-gray-400" />} title="Facility" subtitle="Report repair" />
              </>
            )}
            {profile.role === 'DOCTOR' && (
              <ActionCard icon={<IconStethoscope className="text-red-400" />} title="Medical Queue" subtitle="Pending cases" />
            )}
            {profile.role === 'MAINTENANCE' && (
              <ActionCard icon={<IconWrench className="text-gray-400" />} title="Work Orders" subtitle="Repairs needed" />
            )}
          </div>
        </div>
      );
    }

    // ─── TEACHER ATTENDANCE ──────────────────────────────────
    function TeacherAttendance({ profile }) {
      const { data: attendance, addDocument } = usePublicCollection('attendance');
      const today = new Date().toISOString().split('T')[0];
      const myAttendanceToday = attendance.find(a => a.date === today && a.teacherId === profile.id);

      const markAttendance = () => {
        if (!myAttendanceToday) {
          addDocument({
            date: today,
            teacherId: profile.id,
            name: profile.name,
            status: 'PRESENT'
          });
        }
      };

      if (!['TEACHER', 'ADMIN'].includes(profile.role)) return null;

      return (
        <div className="am-card p-5 shadow-md">
          <div className="flex justify-between items-center">
            <div>
              <h3 className="font-bold text-[#f5f5f7]">Daily Attendance</h3>
              <p className="text-sm text-[#8e8e93]">{new Date().toDateString()}</p>
            </div>
            {myAttendanceToday ? (
              <div className="flex items-center gap-1 text-green-400 bg-green-500/10 px-3 py-1.5 rounded-full font-medium text-sm border border-green-500/20">
                <IconCheckCircle size={16} /> Present
              </div>
            ) : (
              <button
                onClick={markAttendance}
                className="bg-gradient-to-r from-red-500 to-pink-500 text-white px-5 py-2 rounded-full text-sm font-semibold shadow-md transition hover:opacity-90"
              >
                Mark Present
              </button>
            )}
          </div>
        </div>
      );
    }

    // ─── NOTICES TAB ──────────────────────────────────────────
    function NoticesTab({ profile }) {
      const { data: notices, addDocument } = usePublicCollection('notices');
      const [showForm, setShowForm] = useState(false);
      const [newNotice, setNewNotice] = useState({ title: '', type: 'text', content: '' });

      const handlePost = () => {
        if (newNotice.title && newNotice.content) {
          addDocument({ ...newNotice, author: profile.name });
          setShowForm(false);
          setNewNotice({ title: '', type: 'text', content: '' });
        }
      };

      return (
        <div className="space-y-5">
          <div className="flex justify-between items-center mb-2">
            <h2 className="text-2xl font-bold text-[#f5f5f7]">Notices</h2>
            {profile.role === 'ADMIN' && (
              <button onClick={() => setShowForm(!showForm)} className="text-red-500 bg-red-500/10 p-2 rounded-full">
                {showForm ? <IconLogOut size={20} className="rotate-45" /> : <IconPlusCircle size={24} />}
              </button>
            )}
          </div>

          {showForm && (
            <div className="am-card p-4 border border-[#2c2c2e] mb-4 animate-in">
              <input
                type="text"
                placeholder="Notice Title"
                className="w-full p-2 mb-3 bg-[#2c2c2e] border-b border-[#3a3a3c] focus:outline-none focus:border-red-500 text-white placeholder-[#8e8e93] font-medium"
                value={newNotice.title}
                onChange={e => setNewNotice({ ...newNotice, title: e.target.value })}
              />
              <select
                className="w-full p-2 mb-3 bg-[#2c2c2e] rounded-lg text-sm border border-[#3a3a3c] text-white"
                value={newNotice.type}
                onChange={e => setNewNotice({ ...newNotice, type: e.target.value })}
              >
                <option value="text">Text</option>
                <option value="image">Image (URL)</option>
                <option value="pdf">PDF (Link)</option>
              </select>
              <textarea
                placeholder={newNotice.type === 'text' ? "Write notice content..." : "Paste URL here..."}
                className="w-full p-3 bg-[#2c2c2e] rounded-xl mb-3 text-sm min-h-[80px] border border-[#3a3a3c] text-white placeholder-[#8e8e93]"
                value={newNotice.content}
                onChange={e => setNewNotice({ ...newNotice, content: e.target.value })}
              />
              <button onClick={handlePost} className="w-full bg-gradient-to-r from-red-500 to-pink-500 text-white font-bold py-2 rounded-xl">Publish</button>
            </div>
          )}

          {notices.length === 0 && <p className="text-center text-[#8e8e93] mt-10">No notices yet.</p>}

          <div className="space-y-4">
            {notices.map(notice => (
              <div key={notice.id} className="am-card p-5 border-l-4 border-l-red-500 shadow-md">
                <h3 className="font-bold text-[#f5f5f7] mb-1">{notice.title}</h3>
                <p className="text-xs text-[#8e8e93] mb-3">Posted by {notice.author}</p>
                {notice.type === 'text' && <p className="text-sm text-[#e5e5ea] whitespace-pre-wrap">{notice.content}</p>}
                {notice.type === 'image' && (
                  <div className="mt-2 rounded-xl overflow-hidden bg-[#1c1c1e] flex items-center justify-center">
                    <img src={notice.content} alt={notice.title} className="max-w-full h-auto object-contain max-h-48" onError={(e) => { e.target.onerror = null; e.target.src = 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22400%22 height=%22200%22%3E%3Crect fill=%22%232c2c2e%22 width=%22400%22 height=%22200%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dy=%22.3em%22 fill=%22%238e8e93%22 font-family=%22sans-serif%22 font-size=%2220%22%3EImage%20unavailable%3C/text%3E%3C/svg%3E' }} />
                  </div>
                )}
                {notice.type === 'pdf' && (
                  <a href={notice.content} target="_blank" rel="noreferrer" className="flex items-center gap-2 text-red-400 bg-red-500/10 p-3 rounded-xl mt-2 text-sm font-medium hover:bg-red-500/20 transition">
                    <IconFileText size={18} /> View PDF Document
                  </a>
                )}
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ─── SCHEDULE TAB ─────────────────────────────────────────
    function ScheduleTab({ profile }) {
      const { data: proxies, addDocument } = usePublicCollection('proxies');
      const [showForm, setShowForm] = useState(false);
      const [newProxy, setNewProxy] = useState({ date: '', absentTeacher: '', proxyTeacher: '', classRoom: '', subject: '' });

      const handleAssign = () => {
        if (newProxy.date && newProxy.proxyTeacher) {
          addDocument(newProxy);
          setShowForm(false);
          setNewProxy({ date: '', absentTeacher: '', proxyTeacher: '', classRoom: '', subject: '' });
        }
      };

      return (
        <div className="space-y-5">
          <div className="flex justify-between items-center mb-2">
            <div>
              <h2 className="text-2xl font-bold text-[#f5f5f7]">Proxy Schedule</h2>
              <p className="text-sm text-[#8e8e93]">Substitution roster</p>
            </div>
            {profile.role === 'ADMIN' && (
              <button onClick={() => setShowForm(!showForm)} className="bg-red-500/10 text-red-500 px-4 py-2 rounded-full text-sm font-semibold flex items-center gap-1">
                <IconPlusCircle size={16} /> Add
              </button>
            )}
          </div>

          {showForm && profile.role === 'ADMIN' && (
            <div className="am-card p-4 border border-[#2c2c2e] mb-4 grid gap-3 text-sm animate-in">
              <input type="date" className="p-2 bg-[#2c2c2e] border border-[#3a3a3c] rounded-lg text-white" value={newProxy.date} onChange={e => setNewProxy({ ...newProxy, date: e.target.value })} />
              <input type="text" placeholder="Absent Teacher" className="p-2 bg-[#2c2c2e] border border-[#3a3a3c] rounded-lg text-white placeholder-[#8e8e93]" value={newProxy.absentTeacher} onChange={e => setNewProxy({ ...newProxy, absentTeacher: e.target.value })} />
              <input type="text" placeholder="Proxy Teacher" className="p-2 bg-[#2c2c2e] border border-[#3a3a3c] rounded-lg text-white placeholder-[#8e8e93]" value={newProxy.proxyTeacher} onChange={e => setNewProxy({ ...newProxy, proxyTeacher: e.target.value })} />
              <div className="grid grid-cols-2 gap-2">
                <input type="text" placeholder="Class/Sec" className="p-2 bg-[#2c2c2e] border border-[#3a3a3c] rounded-lg text-white placeholder-[#8e8e93]" value={newProxy.classRoom} onChange={e => setNewProxy({ ...newProxy, classRoom: e.target.value })} />
                <input type="text" placeholder="Subject" className="p-2 bg-[#2c2c2e] border border-[#3a3a3c] rounded-lg text-white placeholder-[#8e8e93]" value={newProxy.subject} onChange={e => setNewProxy({ ...newProxy, subject: e.target.value })} />
              </div>
              <button onClick={handleAssign} className="bg-gradient-to-r from-red-500 to-pink-500 text-white font-bold py-2 rounded-lg mt-2">Assign</button>
            </div>
          )}

          <div className="space-y-3">
            {proxies.length === 0 ? (
              <p className="text-center text-[#8e8e93] py-8">No proxy classes scheduled.</p>
            ) : (
              proxies.map(proxy => (
                <div key={proxy.id} className="am-card p-4 shadow-md relative overflow-hidden border-l-4 border-l-red-500">
                  <div className="flex justify-between items-start">
                    <span className="bg-red-500/20 text-red-400 text-xs font-bold px-2 py-1 rounded-full">Date: {proxy.date}</span>
                    <span className="font-bold text-[#f5f5f7] bg-[#2c2c2e] px-2 py-1 rounded-full text-xs">{proxy.classRoom}</span>
                  </div>
                  <div className="flex items-center gap-3 mt-3">
                    <div className="flex-1">
                      <p className="text-xs text-[#8e8e93]">Substitute</p>
                      <p className="font-semibold text-[#f5f5f7]">{proxy.proxyTeacher}</p>
                    </div>
                    <div className="text-[#3a3a3c]">|</div>
                    <div className="flex-1">
                      <p className="text-xs text-[#8e8e93]">Replacing</p>
                      <p className="text-sm text-[#8e8e93] line-through decoration-red-400">{proxy.absentTeacher}</p>
                    </div>
                  </div>
                  <div className="text-sm text-[#e5e5ea] font-medium pt-2 border-t border-[#2c2c2e] mt-2">
                    Subject: {proxy.subject}
                  </div>
                </div>
              ))
            )}
          </div>
        </div>
      );
    }

    // ─── ISSUES TAB ────────────────────────────────────────────
    function IssuesTab({ profile }) {
      const { data: medicalIssues, addDocument: addMed, updateDocument: updateMed } = usePublicCollection('medical');
      const { data: maintIssues, addDocument: addMaint, updateDocument: updateMaint } = usePublicCollection('maintenance');

      const [tab, setTab] = useState(profile.role === 'MAINTENANCE' ? 'maint' : 'med');
      const [showForm, setShowForm] = useState(false);
      const [newIssue, setNewIssue] = useState({ target: '', room: '', description: '' });

      const isTeacher = profile.role === 'TEACHER';

      const handleReport = () => {
        if (newIssue.description) {
          if (tab === 'med') {
            addMed({ studentName: newIssue.target, room: newIssue.room, description: newIssue.description, reportedBy: profile.name, status: 'PENDING' });
          } else {
            addMaint({ location: newIssue.room, type: newIssue.target, description: newIssue.description, reportedBy: profile.name, status: 'PENDING' });
          }
          setShowForm(false);
          setNewIssue({ target: '', room: '', description: '' });
        }
      };

      const activeData = tab === 'med' ? medicalIssues : maintIssues;

      return (
        <div className="space-y-5">
          <div className="flex bg-[#1c1c1e] p-1 rounded-xl mb-2">
            {(profile.role !== 'MAINTENANCE') && (
              <button
                className={`flex-1 py-2 text-sm font-medium rounded-lg transition-colors ${tab === 'med' ? 'bg-[#2c2c2e] text-white' : 'text-[#8e8e93]'}`}
                onClick={() => setTab('med')}
              >
                Medical
              </button>
            )}
            {(profile.role !== 'DOCTOR') && (
              <button
                className={`flex-1 py-2 text-sm font-medium rounded-lg transition-colors ${tab === 'maint' ? 'bg-[#2c2c2e] text-white' : 'text-[#8e8e93]'}`}
                onClick={() => setTab('maint')}
              >
                Facility
              </button>
            )}
          </div>

          {isTeacher && (
            <button onClick={() => setShowForm(!showForm)} className="w-full bg-red-500/10 border border-red-500/20 text-red-400 font-medium py-3 rounded-xl flex items-center justify-center gap-2">
              <IconPlusCircle size={18} /> Report New {tab === 'med' ? 'Medical' : 'Facility'} Issue
            </button>
          )}

          {showForm && isTeacher && (
            <div className="am-card p-4 border border-[#2c2c2e] mb-4 space-y-3 animate-in">
              <input
                type="text"
                placeholder={tab === 'med' ? "Student Name / Roll" : "Issue Type (e.g. Electrical)"}
                className="w-full p-2 bg-[#2c2c2e] border border-[#3a3a3c] rounded-lg text-white placeholder-[#8e8e93] text-sm"
                value={newIssue.target}
                onChange={e => setNewIssue({ ...newIssue, target: e.target.value })}
              />
              <input
                type="text"
                placeholder={tab === 'med' ? "Class/Room" : "Location/Room"}
                className="w-full p-2 bg-[#2c2c2e] border border-[#3a3a3c] rounded-lg text-white placeholder-[#8e8e93] text-sm"
                value={newIssue.room}
                onChange={e => setNewIssue({ ...newIssue, room: e.target.value })}
              />
              <textarea
                placeholder="Describe the issue..."
                className="w-full p-2 bg-[#2c2c2e] border border-[#3a3a3c] rounded-lg text-white placeholder-[#8e8e93] text-sm min-h-[80px]"
                value={newIssue.description}
                onChange={e => setNewIssue({ ...newIssue, description: e.target.value })}
              />
              <button onClick={handleReport} className="w-full bg-gradient-to-r from-red-500 to-pink-500 text-white font-bold py-2 rounded-lg">Submit</button>
            </div>
          )}

          <div className="space-y-3">
            {activeData.length === 0 && <p className="text-center text-[#8e8e93] py-8">No open issues.</p>}
            {activeData.map(item => (
              <div key={item.id} className={`am-card p-4 shadow-md border-l-4 ${item.status === 'RESOLVED' ? 'border-l-green-500 opacity-60' : 'border-l-red-500'}`}>
                <div className="flex justify-between items-start mb-2">
                  <h4 className="font-bold text-[#f5f5f7]">{tab === 'med' ? item.studentName : item.type}</h4>
                  <span className={`text-[10px] px-2 py-1 rounded-full font-bold ${item.status === 'RESOLVED' ? 'bg-green-500/20 text-green-400' : 'bg-orange-500/20 text-orange-400'}`}>
                    {item.status}
                  </span>
                </div>
                <p className="text-xs text-[#8e8e93] mb-2">Location: <span className="font-semibold text-[#e5e5ea]">{item.room || item.location}</span></p>
                <p className="text-sm text-[#e5e5ea] bg-[#1c1c1e] p-2 rounded-lg border border-[#2c2c2e] mb-2">{item.description}</p>
                <p className="text-[10px] text-[#8e8e93] text-right">Reported by: {item.reportedBy}</p>

                {item.status !== 'RESOLVED' && (
                  (tab === 'med' && profile.role === 'DOCTOR') ||
                  (tab === 'maint' && profile.role === 'MAINTENANCE')
                ) && (
                  <button
                    onClick={() => tab === 'med' ? updateMed(item.id, { status: 'RESOLVED' }) : updateMaint(item.id, { status: 'RESOLVED' })}
                    className="mt-3 w-full bg-[#2c2c2e] text-white py-2 rounded-lg text-sm font-medium flex justify-center items-center gap-2 hover:bg-[#3a3a3c] transition"
                  >
                    <IconCheckCircle size={16} /> Mark Resolved
                  </button>
                )}
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ─── ACTION CARD ──────────────────────────────────────────
    function ActionCard({ icon, title, subtitle }) {
      return (
        <div className="am-card p-4 shadow-md flex flex-col items-start gap-2 pw-card cursor-pointer">
          <div className="bg-[#2c2c2e] p-2 rounded-xl">
            {icon}
          </div>
          <div>
            <h4 className="font-bold text-[#f5f5f7] text-sm">{title}</h4>
            <p className="text-[10px] text-[#8e8e93] mt-0.5">{subtitle}</p>
          </div>
        </div>
      );
    }

    // ─── RENDER ────────────────────────────────────────────────
    const root = document.getElementById('root');
    ReactDOM.createRoot(root).render(React.createElement(App));
  </script>

</body>
</html>
