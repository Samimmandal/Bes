    function useCollection(table) {
      const [data, setData] = useState([]);
      const load = useCallback(async () => {
        const { data: rows } = await supabase.from(table).select('*').order('created_at', { ascending: false });
        setData(rows || []);
      }, [table]);

      useEffect(() => {
        load();
        const channel = supabase.channel(table)
          .on('postgres_changes', { event: '*', schema: 'public', table }, () => load())
          .subscribe();
        return () => supabase.removeChannel(channel);
      }, [table, load]);

      const add = async (row) => {
        const { error } = await supabase.from(table).insert([row]);
        if (error) alert(error.message);
        else load();
      };

      const update = async (id, changes) => {
        const { error } = await supabase.from(table).update(changes).eq('id', id);
        if (error) alert(error.message);
        else load();
      };

      const remove = async (id) => {
        const { error } = await supabase.from(table).delete().eq('id', id);
        if (error) alert(error.message);
        else load();
      };

      return { data, add, update, remove };
    }

    async function uploadFile(file) {
      if (!file) return null;
      const ext = file.name ? file.name.split('.').pop() : 'webm';
      const fileName = Date.now() + '_' + Math.random().toString(36).slice(2, 8) + '.' + ext;
      const { error } = await supabase.storage.from('school-files').upload(fileName, file);
      if (error) {
        alert('Upload failed: ' + error.message);
        return null;
      }
      const { data } = supabase.storage.from('school-files').getPublicUrl(fileName);
      return data.publicUrl;
    }

    function linkify(text) {
      if (!text) return text;
      return text.split(/(@\w+|https?:\/\/[^\s]+)/g).map((part, i) => {
        if (part.startsWith('@')) {
          return <span key={i} className="mention">{part}</span>;
        }
        if (part.startsWith('http')) {
          return <a key={i} href={part} target="_blank" rel="noopener noreferrer" className="underline text-blue-400">{part}</a>;
        }
        return part;
      });
    }

    // ==================== SET PIN SCREEN ====================
    function SetPinScreen({ onSave, onSkip }) {
      const [pin, setPin] = useState('');
      const [confirm, setConfirm] = useState('');
      const [step, setStep] = useState(1);

      const press = (num) => {
        if (step === 1) {
          if (pin.length >= 4) return;
          const next = pin + num;
          setPin(next);
          if (next.length === 4) {
            setTimeout(() => setStep(2), 200);
          }
        } else {
          if (confirm.length >= 4) return;
          const next = confirm + num;
          setConfirm(next);
          if (next.length === 4) {
            if (next === pin) {
              onSave(next);
            } else {
              alert('PIN does not match');
              setPin('');
              setConfirm('');
              setStep(1);
            }
          }
        }
      };

      const current = step === 1 ? pin : confirm;

      return (
        <div className="min-h-screen flex items-center justify-center p-6">
          <div className="w-full max-w-xs text-center">
            <h2 className="text-xl font-bold mb-2">
              {step === 1 ? 'Create PIN' : 'Confirm PIN'}

    function ChatTab({ user }) {
      const { data, add, remove } = useCollection('chat_messages');
      const { data: allUsers } = useCollection('users');
      const [message, setMessage] = useState('');
      const [file, setFile] = useState(null);
      const [isBroadcast, setIsBroadcast] = useState(false);
      const [recording, setRecording] = useState(false);
      const [showMentions, setShowMentions] = useState(false);
      const [mentionFilter, setMentionFilter] = useState('');
      const bottomRef = useRef();
      const fileRef = useRef();
      const recorderRef = useRef(null);
      const chunksRef = useRef([]);

      useEffect(() => {
        bottomRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [data]);

      const startRecording = async () => {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          const recorder = new MediaRecorder(stream);
          chunksRef.current = [];
          recorder.ondataavailable = (e) => chunksRef.current.push(e.data);
          recorder.onstop = async () => {
            const blob = new Blob(chunksRef.current, { type: 'audio/webm' });
            const audioFile = new File([blob], 'voice.webm', { type: 'audio/webm' });
            const url = await uploadFile(audioFile);
            if (url) {
              add({
                sender_name: user.name,
                sender_role: user.role,
                message: '',
                file_url: url,
                is_voice: true,
                is_broadcast: isBroadcast
              });
            }
            stream.getTracks().forEach((t) => t.stop());
          };
          recorder.start();
          recorderRef.current = recorder;
          setRecording(true);
        } catch (err) {
          alert('Microphone permission is required');
        }
      };

      const stopRecording = () => {
        if (recorderRef.current) {
          recorderRef.current.stop();
          setRecording(false);
          recorderRef.current = null;
        }
      };

      const send = async () => {
        if (!message.trim() && !file) return;
        let file_url = null;
        if (file) {
          file_url = await uploadFile(file);
          if (!file_url) return;
        }
        add({
          sender_name: user.name,
          sender_role: user.role,
          message: message.trim(),
          file_url,
          is_broadcast: isBroadcast
        });
        setMessage('');
        setFile(null);
        setIsBroadcast(false);
      };

      const handleInput = (val) => {
        setMessage(val);
        const lastWord = val.split(' ').pop();
        if (lastWord.startsWith('@')) {
          setMentionFilter(lastWord.slice(1).toLowerCase());
          setShowMentions(true);
        } else {
          setShowMentions(false);
        }
      };

      const insertMention = (name) => {
        const words = message.split(' ');
        words[words.length - 1] = '@' + name;
        setMessage(words.join(' ') + ' ');
        setShowMentions(false);
      };

      return (
        <div className="chat-wrapper">
          <div className="chat-messages space-y-3">
            {data.slice().reverse().map((m) => (
              <div
                key={m.id}
                className={`flex ${m.sender_name === user.name ? 'justify-end' : 'justify-start'}`}
              >
                <div
                  className={`max-w-[85%] rounded-2xl px-4 py-2 ${
                    m.is_broadcast
                      ? 'bg-gradient-to-r from-red-500 to-pink-500 text-white'
                      : m.sender_name === user.name
                      ? 'bg-red-500/20'
                      : 'input-bg'
                  }`}
                >
                  {m.is_broadcast && (
                    <div className="flex items-center gap-1 text-xs font-bold mb-1 opacity-90">
                      <IconMegaphone /> OFFICIAL BROADCAST
                    </div>
                  )}
                  <div className="text-xs opacity-80 mb-1">
                    {m.sender_name} · {m.sender_role}
                  </div>
                  {m.message && <p className="text-sm">{linkify(m.message)}</p>}
                  {m.is_voice && m.file_url && (
                    <audio
                      controls
                      src={m.file_url}
                      className="mt-2 w-full max-w-xs"
                      style={{ height: 36 }}
                    />
                  )}
                  {m.file_url &&
                    !m.is_voice &&
                    /\.(jpg|jpeg|png|gif|webp)$/i.test(m.file_url) && (
                      <img
                        src={m.file_url}
                        alt="attachment"
                        className="mt-2 rounded-xl max-h-60 object-cover cursor-pointer"
                        onClick={() => window.open(m.file_url)}
                      />
                    )}
                  {m.file_url && /\.pdf$/i.test(m.file_url) && (
                    <a
                      href={m.file_url}
                      target="_blank"
                      rel="noopener noreferrer"
                      className="mt-2 flex items-center gap-2 text-sm"
                    >
                      <IconFile /> PDF Document
                    </a>
                  )}
                  {user.role === 'ADMIN' && (
                    <button
                      onClick={() => {
                        if (confirm('Delete this message?')) remove(m.id);
                      }}
                      className="text-xs opacity-60 mt-1 block"
                    >
                      Delete
                    </button>
                  )}
                </div>
              </div>
            ))}
            <div ref={bottomRef}></div>
          </div>

          {showMentions && (
            <div className="mx-3 mb-2 card p-2 max-h-28 overflow-y-auto">
              {allUsers
                .filter((u) =>
                  u.full_name.toLowerCase().includes(mentionFilter)
                )
                .slice(0, 5)
                .map((u) => (
                  <button
                    key={u.id}
                    onClick={() => insertMention(u.full_name.split(' ')[0])}
                    className="block w-full text-left px-3 py-2 text-sm rounded hover:bg-red-500/10"
                  >
                    @{u.full_name}
                  </button>
                ))}
            </div>
          )}

          <div className="chat-input-bar">
            {user.role === 'ADMIN' && (
              <label className="flex items-center gap-2 text-sm mb-2">
                <input
                  type="checkbox"
                  checked={isBroadcast}
                  onChange={(e) => setIsBroadcast(e.target.checked)}
                />
                <span className="flex items-center gap-1">
                  <IconMegaphone /> Official Broadcast
                </span>
              </label>
            )}
            {file && (
              <div className="text-xs text-gray-400 mb-1 flex items-center gap-2">
                <IconPaperclip /> {file.name}
                <button onClick={() => setFile(null)} className="text-red-400">
                  ✕
                </button>
              </div>
            )}
            <div className="flex gap-2 items-center">
              <button
                onClick={() => fileRef.current.click()}
                className="w-10 h-10 rounded-full flex items-center justify-center input-bg"
              >
                <IconPaperclip />
              </button>
              <input
                ref={fileRef}
                type="file"
                accept=".pdf,.jpg,.jpeg,.png"
                className="hidden"
                onChange={(e) => setFile(e.target.files[0])}
              />
              <input
                value={message}
                onChange={(e) => handleInput(e.target.value)}
                onKeyDown={(e) => e.key === 'Enter' && send()}
                placeholder="Message... (@name)"
                className="flex-1 p-3 rounded-full input-bg text-sm"
              />
              <button
                onClick={recording ? stopRecording : startRecording}
                className={`w-10 h-10 rounded-full flex items-center justify-center ${
                  recording ? 'bg-red-500 text-white' : 'input-bg'
                }`}
              >
                <IconMic />
              </button>
              <button
                onClick={send}
                className="bg-gradient-to-r from-red-500 to-pink-500 text-white px-5 py-2.5 rounded-full font-semibold text-sm"
              >
                Send
              </button>
            </div>
            {recording && (
              <p className="text-xs text-red-400 mt-1 animate-pulse">
                Recording... tap mic to stop
              </p>
            )}
          </div>
        </div>
      );
    }

    // ==================== RESULTS ====================
    function ResultsTab({ user }) {
      const { data, add, remove } = useCollection('exam_results');
      const [show, setShow] = useState(false);
      const [title, setTitle] = useState('');
      const [desc, setDesc] = useState('');
      const [file, setFile] = useState(null);
      const fileRef = useRef();

      const save = async () => {
        if (!title) {
          alert('Title is required');
          return;
        }
        let file_url = null;
        if (file) {
          file_url = await uploadFile(file);
          if (!file_url) return;
        }
        add({
          title,
          description: desc,
          file_url,
          uploaded_by: user.name
        });
        setShow(false);
        setTitle('');
        setDesc('');
        setFile(null);
      };

      return (
        <div className="space-y-5 px-4">
          <div className="flex justify-between items-center">
            <h2 className="text-xl font-bold">Exam Results</h2>
            {user.role === 'ADMIN' && (
              <button
                onClick={() => setShow(!show)}
                className="bg-red-500/15 text-red-400 px-4 py-2 rounded-full text-sm font-semibold flex items-center gap-2"
              >
                <IconPlus /> Upload
              </button>
            )}
          </div>

          {show && user.role === 'ADMIN' && (
            <div className="card p-5 space-y-3">
              <input
                value={title}
                onChange={(e) => setTitle(e.target.value)}
                placeholder="Title"
                className="w-full p-3 rounded-xl input-bg"
              />
              <textarea
                value={desc}
                onChange={(e) => setDesc(e.target.value)}
                placeholder="Description"
                className="w-full p-3 rounded-xl input-bg"
                rows={3}
              />
              <button
                onClick={() => fileRef.current.click()}
                className="flex items-center gap-2 px-4 py-2 rounded-xl input-bg text-sm"
              >
                <IconPaperclip /> {file ? file.name : 'Attach file'}
              </button>
              <input
                ref={fileRef}
                type="file"
                accept=".pdf,.jpg,.jpeg,.png"
                className="hidden"
                onChange={(e) => setFile(e.target.files[0])}
              />
              <button
                onClick={save}
                className="w-full bg-gradient-to-r from-red-500 to-pink-500 text-white py-3 rounded-xl font-bold"
              >
                Upload
              </button>
            </div>
          )}

          {data.map((r) => (
            <div key={r.id} className="card p-5 border-l-4 border-blue-500">
              <h3 className="font-bold text-lg">{r.title}</h3>
              <p className="text-xs text-gray-400">By {r.uploaded_by}</p>
              {r.description && (
                <p className="text-sm mt-2">{linkify(r.description)}</p>
              )}
              {r.file_url && (
                <a
                  href={r.file_url}
                  target="_blank"
                  rel="noopener noreferrer"
                  className="text-blue-400 text-sm mt-2 flex items-center gap-1"
                >
                  <IconFile /> View File
                </a>
              )}
              {user.role === 'ADMIN' && (
                <button
                  onClick={() => {
                    if (confirm('Delete this result?')) remove(r.id);
                  }}
                  className="text-red-400 text-xs mt-2"
                >
                  Delete
                </button>
              )}
            </div>
          ))}
        </div>
      );
    }

    // ==================== PROFILE ====================
    function Profile({ user, setTab, onFullLogout, theme, setTheme }) {
      return (
        <div className="space-y-5 px-4">
          <h2 className="text-xl font-bold">My Profile</h2>
          <div className="card p-6 space-y-4">
            <div>
              <p className="text-xs text-gray-400">Name</p>
              <p className="font-medium text-lg">{user.name}</p>
            </div>
            <div>
              <p className="text-xs text-gray-400">Role</p>
              <p className="font-medium">{user.role}</p>
            </div>
            <div>
              <p className="text-xs text-gray-400">Login ID</p>
              <p className="font-medium text-red-400">{user.id}</p>
            </div>
            <button
              onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')}
              className="w-full py-3 rounded-xl input-bg text-sm flex items-center justify-center gap-2"
            >
              {theme === 'dark' ? (
                <><IconSun /> Switch to Light Mode</>
              ) : (
                <><IconMoon /> Switch to Dark Mode</>
              )}
            </button>
            {user.role === 'ADMIN' && (
              <button
                onClick={() => setTab('users')}
                className="w-full py-3 rounded-xl bg-red-500/15 text-red-400 text-sm flex items-center justify-center gap-2"
              >
                <IconUsers /> Manage Users
              </button>
            )}
            <button
              onClick={onFullLogout}
              className="w-full py-3 rounded-xl bg-red-500/10 text-red-400 text-sm"
            >
              Logout Completely (Clear PIN)
            </button>
          </div>
        </div>
      );
    }

    // ==================== USERS ====================
    function Users() {
      const { data, add, remove } = useCollection('users');
      const [show, setShow] = useState(false);
      const [form, setForm] = useState({
        username: '',
        password: '',
        full_name: '',
        role: 'TEACHER'
      });

      return (
        <div className="space-y-5 px-4">
          <div className="flex justify-between items-center">
            <h2 className="text-xl font-bold">Manage Users</h2>
            <button
              onClick={() => setShow(!show)}
              className="bg-red-500/15 text-red-400 px-4 py-2 rounded-full text-sm font-semibold flex items-center gap-2"
            >
              <IconPlus /> Create
            </button>
          </div>

          {show && (
            <div className="card p-5 space-y-3">
              <input
                placeholder="Full Name"
                className="w-full p-3 rounded-xl input-bg"
                value={form.full_name}
                onChange={(e) => setForm({ ...form, full_name: e.target.value })}
              />
              <input
                placeholder="Login ID"
                className="w-full p-3 rounded-xl input-bg"
                value={form.username}
                onChange={(e) => setForm({ ...form, username: e.target.value })}
              />
              <input
                placeholder="Password"
                className="w-full p-3 rounded-xl input-bg"
                value={form.password}
                onChange={(e) => setForm({ ...form, password: e.target.value })}
              />
              <select
                className="w-full p-3 rounded-xl input-bg"
                value={form.role}
                onChange={(e) => setForm({ ...form, role: e.target.value })}
              >
                <option value="TEACHER">Teacher</option>
                <option value="DOCTOR">Doctor</option>
                <option value="MAINTENANCE">Maintenance</option>
                <option value="ADMIN">Admin</option>
              </select>
              <button
                onClick={() => {
                  if (form.username && form.password && form.full_name) {
                    add(form);
                    setShow(false);
                    setForm({
                      username: '',
                      password: '',
                      full_name: '',
                      role: 'TEACHER'
                    });
                    alert('User created successfully!');
                  } else {
                    alert('Please fill all fields');
                  }
                }}
                className="w-full bg-gradient-to-r from-red-500 to-pink-500 text-white py-3 rounded-xl font-bold"
              >
                Create
              </button>
            </div>
          )}

          <div className="space-y-3">
            {data.map((u) => (
              <div
                key={u.id}
                className="card p-4 flex justify-between items-center"
              >
                <div>
                  <p className="font-medium">{u.full_name}</p>
                  <p className="text-xs text-gray-400">{u.role}</p>
                </div>
                <button
                  onClick={() => {
                    if (confirm('Delete ' + u.full_name + '?')) {
                      remove(u.id);
                    }
                  }}
                  className="text-red-400 text-sm"
                >
                  Delete
                </button>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // Render the app
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
  </html>
