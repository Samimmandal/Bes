    function useCollection(table) {
      const [data, setData] = useState([]);
      const load = useCallback(async () => {
        const { data: rows } = await supabase.from(table).select('*').order('created_at', { ascending: false });
        setData(rows || []);
      }, [table]);

      useEffect(() => {
        load();
        const channel = supabase.channel(table)
          .on('postgres_changes', { event: '*', schema: 'public', table }, () => load())
          .subscribe();
        return () => supabase.removeChannel(channel);
      }, [table, load]);

      const add = async (row) => {
        const { error } = await supabase.from(table).insert([row]);
        if (error) alert(error.message);
        else load();
      };
      const update = async (id, changes) => {
        const { error } = await supabase.from(table).update(changes).eq('id', id);
        if (error) alert(error.message);
        else load();
      };
      const remove = async (id) => {
        const { error } = await supabase.from(table).delete().eq('id', id);
        if (error) alert(error.message);
        else load();
      };
      return { data, add, update, remove };
    }

    function linkifyAndMention(text) {
      if (!text) return text;
      const parts = text.split(/(@\w+)/g);
      return parts.map((part, i) => {
        if (part.startsWith('@')) {
          return <span key={i} className="mention">{part}</span>;
        }
        const urlRegex = /(https?:\/\/[^\s]+)/g;
        return part.split(urlRegex).map((p, j) =>
          urlRegex.test(p) ? <a key={j} href={p} target="_blank" rel="noopener noreferrer">{p}</a> : p
        );
      });
    }

    async function uploadFile(file) {
      if (!file) return null;
      const ext = file.name ? file.name.split('.').pop() : 'webm';
      const fileName = Date.now() + '_' + Math.random().toString(36).substring(2, 8) + '.' + ext;
      const { error } = await supabase.storage.from('school-files').upload(fileName, file);
      if (error) {
        alert('Upload failed: ' + error.message);
        return null;
      }
      const { data } = supabase.storage.from('school-files').getPublicUrl(fileName);
      return data.publicUrl;
    }

    function useCollection(table) {
      const [data, setData] = useState([]);
      const load = useCallback(async () => {
        const { data: rows } = await supabase.from(table).select('*').order('created_at', { ascending: false });
        setData(rows || []);
      }, [table]);

      useEffect(() => {
        load();
        const channel = supabase.channel(table)
          .on('postgres_changes', { event: '*', schema: 'public', table }, () => load())
          .subscribe();
        return () => supabase.removeChannel(channel);
      }, [table, load]);

      const add = async (row) => {
        const { error } = await supabase.from(table).insert([row]);
        if (error) alert(error.message);
        else load();
      };
      const update = async (id, changes) => {
        const { error } = await supabase.from(table).update(changes).eq('id', id);
        if (error) alert(error.message);
        else load();
      };
      const remove = async (id) => {
        const { error } = await supabase.from(table).delete().eq('id', id);
        if (error) alert(error.message);
        else load();
      };
      return { data, add, update, remove };
    }

    function linkifyAndMention(text) {
      if (!text) return text;
      const parts = text.split(/(@\w+)/g);
      return parts.map((part, i) => {
        if (part.startsWith('@')) {
          return <span key={i} className="mention">{part}</span>;
        }
        const urlRegex = /(https?:\/\/[^\s]+)/g;
        return part.split(urlRegex).map((p, j) =>
          urlRegex.test(p) ? <a key={j} href={p} target="_blank" rel="noopener noreferrer">{p}</a> : p
        );
      });
    }

    async function uploadFile(file) {
      if (!file) return null;
      const ext = file.name ? file.name.split('.').pop() : 'webm';
      const fileName = Date.now() + '_' + Math.random().toString(36).substring(2, 8) + '.' + ext;
      const { error } = await supabase.storage.from('school-files').upload(fileName, file);
      if (error) {
        alert('Upload failed: ' + error.message);
        return null;
      }
      const { data } = supabase.storage.from('school-files').getPublicUrl(fileName);
      return data.publicUrl;
    }

    function SetPinScreen({ onSave, onSkip }) {
      const [pin, setPin] = useState('');
      const [confirm, setConfirm] = useState('');
      const [step, setStep] = useState(1);

      const press = (num) => {
        if (step === 1) {
          if (pin.length >= 4) return;
          const next = pin + num;
          setPin(next);
          if (next.length === 4) setTimeout(() => setStep(2), 250);
        } else {
          if (confirm.length >= 4) return;
          const next = confirm + num;
          setConfirm(next);
          if (next.length === 4) {
            if (next === pin) onSave(next);
            else {
              alert('PIN does not match');
              setPin('');
              setConfirm('');
              setStep(1);
            }
          }
        }
      };

      const current = step === 1 ? pin : confirm;

      return (
        <div className="min-h-screen flex items-center justify-center p-6">

    function Notices({ user }) {
      const { data, add, update, remove } = useCollection('notices');

        if (!title || !content) return alert('Title and content required');
        let file_url = null;
        if (file) {
          file_url = await uploadFile(file);
          if (!file_url) return;
        }
        if (editId) {
          update(editId, { title, content, ...(file_url && { file_url }) });
        } else {
          add({ title, content, type: 'text', author: user.name, file_url });

        setShow(false);
        setEditId(null);
        setTitle('');
        setContent('');

    // ==================== CHAT ====================
    function ChatTab({ user }) {
      const { data, add, update, remove } = useCollection('chat_messages');
      const { data: allUsers } = useCollection('users');
      const [message, setMessage] = useState('');
      const [file, setFile] = useState(null);
      const [editId, setEditId] = useState(null);
      const [isBroadcast, setIsBroadcast] = useState(false);
      const [recording, setRecording] = useState(false);
      const [showMentions, setShowMentions] = useState(false);
      const [mentionFilter, setMentionFilter] = useState('');
      const bottomRef = useRef();
      const mediaRecorderRef = useRef(null);
      const chunksRef = useRef([]);

      useEffect(() => {
        bottomRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [data]);

      const startRecording = async () => {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          const recorder = new MediaRecorder(stream);
          chunksRef.current = [];
          recorder.ondataavailable = (e) => chunksRef.current.push(e.data);
          recorder.onstop = async () => {
            const blob = new Blob(chunksRef.current, { type: 'audio/webm' });
            const audioFile = new File([blob], 'voice.webm', { type: 'audio/webm' });
            const url = await uploadFile(audioFile);
            if (url) {
              add({
                sender_name: user.name,
                sender_role: user.role,
                message: '',
                file_url: url,
                is_voice: true,
                is_broadcast: isBroadcast
              });
            }
            stream.getTracks().forEach(t => t.stop());
          };
          recorder.start();
          mediaRecorderRef.current = recorder;
          setRecording(true);
        } catch (err) {
          alert('Microphone permission is required');
        }
      };

      const stopRecording = () => {
        if (mediaRecorderRef.current) {
          mediaRecorderRef.current.stop();
          setRecording(false);
          mediaRecorderRef.current = null;
        }
      };

      const send = async () => {
        if (!message.trim() && !file && !editId) return;
        let file_url = null;
        if (file) {
          file_url = await uploadFile(file);
          if (!file_url) return;
        }
        if (editId) {
          update(editId, { message: message.trim(), ...(file_url && { file_url }) });
          setEditId(null);
        } else {
          add({
            sender_name: user.name,
            sender_role: user.role,
            message: message.trim(),
            file_url,
            is_broadcast: isBroadcast
          });
        }
        setMessage('');
        setFile(null);
        setIsBroadcast(false);
      };

      const handleInput = (val) => {
        setMessage(val);
        const last = val.split(' ').pop();
        if (last.startsWith('@')) {
          setMentionFilter(last.slice(1).toLowerCase());
          setShowMentions(true);
        } else {
          setShowMentions(false);
        }
      };

      const insertMention = (name) => {
        const words = message.split(' ');
        words[words.length - 1] = '@' + name;
        setMessage(words.join(' ') + ' ');
        setShowMentions(false);
      };

      const isImage = (url) => url && /\.(jpeg|jpg|png|gif|webp)$/i.test(url);
      const isPdf = (url) => url && /\.pdf$/i.test(url);
      const isVoice = (m) => m.is_voice || (m.file_url && m.file_url.includes('webm'));

      return (
        <div className="space-y-4 max-w-3xl">
          <h2 className="text-2xl font-bold">Staff Chat</h2>

          <div className="card p-4 chat-box space-y-3">
            {data.slice().reverse().map(m => {
              const canEdit = user.role === 'ADMIN' || m.sender_name === user.name;
              return (
                <div key={m.id} className={`flex ${m.sender_name === user.name ? 'justify-end' : 'justify-start'}`}>
                  <div className={`max-w-[80%] rounded-2xl px-4 py-2 ${m.is_broadcast ? 'bg-gradient-to-r from-red-500 to-pink-500 text-white' : (m.sender_name === user.name ? 'bg-red-500/20' : 'input-bg')}`}>
                    {m.is_broadcast && <div className="text-xs font-bold mb-1">📢 OFFICIAL BROADCAST</div>}
                    <div className="flex justify-between gap-3 mb-1">
                      <span className={`text-xs font-medium ${m.is_broadcast ? 'text-white' : 'text-red-400'}`}>
                        {m.sender_name} · {m.sender_role}
                      </span>
                      <div className="flex gap-2">
                        {canEdit && <button onClick={() => { setEditId(m.id); setMessage(m.message || ''); }} className="text-xs opacity-70">Edit</button>}
                        {user.role === 'ADMIN' && <button onClick={() => confirm('Delete?') && remove(m.id)} className="text-xs opacity-70">Delete</button>}
                      </div>
                    </div>
                    {m.message && <p className="text-sm">{linkifyAndMention(m.message)}</p>}
                    {isVoice(m) && m.file_url && (
                      <audio controls src={m.file_url} className="mt-2 w-full max-w-xs" style={{ height: 36 }} />
                    )}
                    {m.file_url && isImage(m.file_url) && (
                      <img src={m.file_url} className="mt-2 rounded-xl max-h-60 object-cover cursor-pointer" onClick={() => window.open(m.file_url)} />
                    )}
                    {m.file_url && isPdf(m.file_url) && (
                      <a href={m.file_url} target="_blank" className="mt-2 flex items-center gap-2 p-3 rounded-xl" style={{ background: 'rgba(0,0,0,0.2)' }}>
                        <span>📄</span>
                        <div>
                          <p className="text-sm font-medium">PDF Document</p>
                          <p className="text-xs opacity-70">Tap to open</p>
                        </div>
                      </a>
                    )}
                  </div>
                </div>
              );
            })}
            <div ref={bottomRef}></div>
          </div>

          {showMentions && (
            <div className="card p-2 max-h-40 overflow-y-auto">
              {allUsers
                .filter(u => u.full_name.toLowerCase().includes(mentionFilter))
                .slice(0, 6)
                .map(u => (
                  <button
                    key={u.id}
                    onClick={() => insertMention(u.full_name.split(' ')[0])}
                    className="w-full text-left px-3 py-2 rounded-lg text-sm hover:bg-red-500/10"
                  >
                    @{u.full_name}
                  </button>
                ))}
            </div>
          )}

          <div className="card p-3 space-y-2">
            {editId && <p className="text-xs text-yellow-400">Editing message...</p>}
            {user.role === 'ADMIN' && (
              <label className="flex items-center gap-2 text-sm">
                <input type="checkbox" checked={isBroadcast} onChange={e => setIsBroadcast(e.target.checked)} />
                <span>📢 Send as Official Broadcast</span>
              </label>
            )}
            <div className="flex gap-2 items-center">
              <input
                value={message}
                onChange={e => handleInput(e.target.value)}
                onKeyDown={e => e.key === 'Enter' && send()}
                placeholder="Type a message... (@ to mention)"
                className="flex-1 p-3 rounded-xl input-bg"
              />
              <button
                onClick={recording ? stopRecording : startRecording}
                className={`p-3 rounded-xl ${recording ? 'bg-red-500 text-white' : 'bg-gray-600 text-white'}`}
              >
                <IconMic />
              </button>
              <button onClick={send} className="bg-gradient-to-r from-red-500 to-pink-500 text-white px-5 rounded-xl font-semibold">
                {editId ? 'Update' : 'Send'}
              </button>
            </div>
            <input type="file" accept=".pdf,.jpg,.jpeg,.png" onChange={e => setFile(e.target.files[0])} className="text-sm" />
            {recording && <p className="text-xs text-red-400 animate-pulse">Recording... Tap mic again to stop</p>}
          </div>
        </div>
      );
    }

    function Profile({ user, setUser, setTab, onFullLogout, theme, setTheme }) {
      const [showEdit, setShowEdit] = useState(false);
      const [newId, setNewId] = useState(user.id);
      const [newPass, setNewPass] = useState('');
      const [confirmPass, setConfirmPass] = useState('');

      const save = async () => {
        if (!newId.trim()) return alert('Login ID required');
        const updates = {};
        if (newId.trim() !== user.id) updates.username = newId.trim();
        if (newPass) {
          if (newPass.length < 4) return alert('Min 4 characters');
          if (newPass !== confirmPass) return alert('Passwords do not match');
          updates.password = newPass.trim();
        }
        if (Object.keys(updates).length === 0) {
          setShowEdit(false);
          return;
        }
        const { error } = await supabase.from('users').update(updates).eq('username', user.id);
        if (error) alert(error.message);
        else {
          alert('Updated!');
          setUser({ ...user, id: updates.username || user.id });
          setShowEdit(false);
          setNewPass('');
          setConfirmPass('');
        }
      };

      return (
        <div className="space-y-5 max-w-lg">
          <h2 className="text-2xl font-bold">My Profile</h2>
          <div className="card p-6 space-y-5">
            <div>
              <p className="text-xs text-gray-400">Full Name</p>
              <p className="font-medium text-lg">{user.name}</p>
            </div>
            <div>
              <p className="text-xs text-gray-400">Role</p>
              <p className="font-medium">{user.role}</p>
            </div>
            <div>
              <p className="text-xs text-gray-400">Login ID</p>
              <p className="font-medium text-red-400 text-lg">{user.id}</p>
            </div>

            <div className="pt-4 border-t border-gray-700 space-y-3">
              <button onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')} className="w-full py-3 rounded-xl text-sm flex items-center justify-center gap-2 input-bg">
                {theme === 'dark' ? <><IconSun /> Switch to Light Mode</> : <><IconMoon /> Switch to Dark Mode</>}
              </button>

              {!showEdit ? (
                <button onClick={() => setShowEdit(true)} className="w-full py-3 rounded-xl text-sm input-bg">Change Login ID / Password</button>
              ) : (
                <div className="space-y-3">
                  <input value={newId} onChange={e => setNewId(e.target.value)} className="w-full p-3 rounded-xl input-bg" />
                  <input type="password" value={newPass} onChange={e => setNewPass(e.target.value)} placeholder="New Password (optional)" className="w-full p-3 rounded-xl input-bg" />
                  {newPass && <input type="password" value={confirmPass} onChange={e => setConfirmPass(e.target.value)} placeholder="Confirm" className="w-full p-3 rounded-xl input-bg" />}
                  <div className="flex gap-3">
                    <button onClick={save} className="flex-1 bg-gradient-to-r from-red-500 to-pink-500 text-white py-3 rounded-xl font-semibold">Save</button>
                    <button onClick={() => setShowEdit(false)} className="px-5 rounded-xl input-bg">Cancel</button>
                  </div>
                </div>
              )}

              {user.role === 'ADMIN' && (
                <button onClick={() => setTab('users')} className="w-full bg-red-500/15 text-red-400 py-3 rounded-xl text-sm flex items-center justify-center gap-2">
                  <IconUsers /> Manage Users
                </button>
              )}

              <button onClick={onFullLogout} className="w-full bg-red-500/10 text-red-400 py-3 rounded-xl text-sm">
                Logout Completely (Clear PIN)
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ==================== USERS ====================
    function Users() {
      const { data, add, remove } = useCollection('users');
      const [show, setShow] = useState(false);
      const [form, setForm] = useState({ username: '', password: '', full_name: '', role: 'TEACHER' });

      return (
        <div className="space-y-5 max-w-3xl">
          <div className="flex justify-between items-center">
            <h2 className="text-2xl font-bold">Manage Users</h2>
            <button onClick={() => setShow(!show)} className="bg-red-500/15 text-red-400 px-4 py-2 rounded-full text-sm font-semibold flex items-center gap-2">
              <IconPlus /> Create
            </button>
          </div>

          {show && (
            <div className="card p-5 space-y-3">
              <input placeholder="Full Name" className="w-full p-3 rounded-xl input-bg" value={form.full_name} onChange={e => setForm({ ...form, full_name: e.target.value })} />
              <input placeholder="Login ID" className="w-full p-3 rounded-xl input-bg" value={form.username} onChange={e => setForm({ ...form, username: e.target.value })} />
              <input placeholder="Temporary Password" className="w-full p-3 rounded-xl input-bg" value={form.password} onChange={e => setForm({ ...form, password: e.target.value })} />
              <select className="w-full p-3 rounded-xl input-bg" value={form.role} onChange={e => setForm({ ...form, role: e.target.value })}>
                <option value="TEACHER">Teacher</option>
                <option value="DOCTOR">Doctor</option>
                <option value="MAINTENANCE">Maintenance</option>
                <option value="ADMIN">Admin</option>
              </select>
              <button
                onClick={() => {
                  if (form.username && form.password && form.full_name) {
                    add(form);
                    setShow(false);
                    setForm({ username: '', password: '', full_name: '', role: 'TEACHER' });
                    alert('Created!');
                  } else {
                    alert('Fill all fields');
                  }
                }}
                className="w-full bg-gradient-to-r from-red-500 to-pink-500 text-white py-3 rounded-xl font-bold"
              >
                Create Login ID
              </button>
            </div>
          )}

          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
            {data.map(u => (
              <div key={u.id} className="card p-4 flex justify-between items-center">
                <div>
                  <p className="font-medium">{u.full_name}</p>
                  <p className="text-xs text-gray-400">{u.role}</p>
                </div>
                <button onClick={() => confirm(`Delete ${u.full_name}?`) && remove(u.id)} className="text-red-400 p-2">
                  <IconTrash />
                </button>
              </div>
            ))}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
