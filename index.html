<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bes An Noor Model School</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b0b0e">
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { background: #0b0b0e; color: #fff; margin: 0; font-family: system-ui, sans-serif; }
    body.light { background: #f2f2f7; color: #1c1c1e; }
    .card { background: #1c1c1e; border-radius: 16px; }
    body.light .card { background: #fff; }
    .input-bg { background: #2c2c2e; }
    body.light .input-bg { background: #e5e5ea; color: #1c1c1e; }
    .header { background: rgba(11,11,14,0.95); border-bottom: 1px solid #2c2c2e; }
    body.light .header { background: rgba(242,242,247,0.95); border-bottom: 1px solid #e5e5ea; }
    .bottom-nav { background: rgba(20,20,23,0.95); border-top: 1px solid #2c2c2e; }
    body.light .bottom-nav { background: rgba(242,242,247,0.95); border-top: 1px solid #e5e5ea; }
    .pin-dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #555; display: inline-block; }
    .pin-dot.filled { background: #ef4444; border-color: #ef4444; }
    .mention { color: #3b82f6; font-weight: 600; }
    .chat-box { max-height: 50vh; overflow-y: auto; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useCallback, useRef } = React;

    const SUPABASE_URL = 'https://peiybuhnozgqatdyrdhf.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBlaXlidWhub3pncWF0ZHlyZGhmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5NzIyNDEsImV4cCI6MjEwMjU0ODI0MX0.a_1otAvBMRa20HSA01jcvtCbxwUpXNbmCzVmA9Qm-DE';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function useCollection(table) {
      const [data, setData] = useState([]);
      const load = useCallback(async () => {
        const { data: rows } = await supabase.from(table).select('*').order('created_at', { ascending: false });
        setData(rows || []);
      }, [table]);
      useEffect(() => {
        load();
        const ch = supabase.channel(table).on('postgres_changes', { event: '*', schema: 'public', table }, load).subscribe();
        return () => supabase.removeChannel(ch);
      }, [table, load]);
      const add = async (row) => {
        const { error } = await supabase.from(table).insert([row]);
        if (error) alert(error.message); else load();
      };
      const update = async (id, changes) => {
        const { error } = await supabase.from(table).update(changes).eq('id', id);
        if (error) alert(error.message); else load();
      };
      const remove = async (id) => {
        const { error } = await supabase.from(table).delete().eq('id', id);
        if (error) alert(error.message); else load();
      };
      return { data, add, update, remove };
    }

    async function uploadFile(file) {
      if (!file) return null;
      const ext = file.name ? file.name.split('.').pop() : 'webm';
      const name = Date.now() + '_' + Math.random().toString(36).slice(2, 8) + '.' + ext;
      const { error } = await supabase.storage.from('school-files').upload(name, file);
      if (error) { alert('Upload failed: ' + error.message); return null; }
      const { data } = supabase.storage.from('school-files').getPublicUrl(name);
      return data.publicUrl;
    }

    function linkify(text) {
      if (!text) return text;
      return text.split(/(@\w+|https?:\/\/[^\s]+)/g).map((part, i) => {
        if (part.startsWith('@')) return <span key={i} className="mention">{part}</span>;
        if (part.startsWith('http')) return <a key={i} href={part} target="_blank">{part}</a>;
        return part;
      });
    }

    // ========== APP ==========
    function App() {
      const [user, setUser] = useState(null);
      const [tab, setTab] = useState('home');
      const [mode, setMode] = useState('loading');
      const [theme, setTheme] = useState(localStorage.getItem('bes_theme') || 'dark');

      useEffect(() => {
        document.body.className = theme === 'light' ? 'light' : '';
        localStorage.setItem('bes_theme', theme);
      }, [theme]);

      useEffect(() => {
        try {
          const saved = localStorage.getItem('bes_pin_user');
          if (saved) {
            const p = JSON.parse(saved);
            if (p && p.pin) { setMode('pin'); return; }
          }
        } catch (e) {}
        setMode('login');
      }, []);

      const login = async (username, password) => {
        const { data, error } = await supabase.from('users').select('*').eq('username', username.trim()).eq('password', password.trim()).maybeSingle();
        if (error) return alert(error.message);
        if (!data) return alert('Invalid Login ID or Password');
        const u = { id: data.username, name: data.full_name, role: data.role };
        setUser(u);
        const saved = localStorage.getItem('bes_pin_user');
        if (saved) {
          try {
            const p = JSON.parse(saved);
            if (p.username === data.username && p.pin) { setMode('app'); return; }
          } catch (e) {}
        }
        setMode('setpin');
      };

      const pinSuccess = (u) => { setUser(u); setMode('app'); };
      const setPin = (pin) => {
        localStorage.setItem('bes_pin_user', JSON.stringify({ username: user.id, name: user.name, role: user.role, pin }));
        setMode('app');
      };
      const logout = () => { setUser(null); setTab('home'); setMode('pin'); };
      const fullLogout = () => { localStorage.removeItem('bes_pin_user'); setUser(null); setTab('home'); setMode('login'); };

      if (mode === 'loading') return <div className="min-h-screen flex items-center justify-center text-gray-400">Loading...</div>;
      if (mode === 'pin') return <PinScreen onSuccess={pinSuccess} onUsePassword={() => setMode('login')} onFullLogout={fullLogout} theme={theme} setTheme={setTheme} />;
      if (mode === 'login') return <LoginScreen onLogin={login} theme={theme} setTheme={setTheme} />;
      if (mode === 'setpin') return <SetPinScreen onSave={setPin} onSkip={() => setMode('app')} />;

      return (
        <div className="min-h-screen flex flex-col md:flex-row">
          <aside className="hidden md:flex flex-col w-64 border-r p-4 sticky top-0 h-screen" style={{ background: theme === 'light' ? '#fff' : '#141416', borderColor: theme === 'light' ? '#e5e5ea' : '#2c2c2e' }}>
            <div className="mb-6">
              <h1 className="text-lg font-bold">Bes An Noorআমি বুঝতে পারছি তুমি খুব বিরক্ত। আমি এখন **একদম পরিষ্কার এবং ছোট করে** কোড দিচ্ছি, যাতে কালো পেজ না আসে।

এই কোডে আছে:
- Quick PIN Login
- Dark / Light Mode
- Broadcast
- Voice Note
- Mention (@name)
- সব পুরনো ফিচার (Attendance, Notices, Proxy, Chat, Report, Results, Profile, Users)

**এখন যা করবে:**

1. GitHub-এ গিয়ে `index.html` খোলো
2. **সব পুরনো কোড সিলেক্ট করে ডিলিট করো**
3. নিচের কোড **পুরোটা** কপি করে পেস্ট করো
4. Commit changes করো
5. Incognito মোডে ওয়েবসাইট খোলো

    function PinScreen({ onSuccess, onUsePassword, onFullLogout, theme, setTheme }) {

        setError('');

              <p className="text-gray-400 mt-1">(Boys' Unit)</p>
            </div>

    // ========== CHAT ==========
    function ChatTab({ user }) {
      const { data, add, update, remove } = useCollection('chat_messages');
      const { data: allUsers } = useCollection('users');
      const [message, setMessage] = useState('');
      const [file, setFile] = useState(null);
      const [isBroadcast, setIsBroadcast] = useState(false);
      const [recording, setRecording] = useState(false);
      const [showMentions, setShowMentions] = useState(false);
      const [mentionFilter, setMentionFilter] = useState('');
      const bottomRef = useRef();
      const recorderRef = useRef(null);
      const chunksRef = useRef([]);

      useEffect(() => { bottomRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [data]);

      const startRec = async () => {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          const rec = new MediaRecorder(stream);
          chunksRef.current = [];
          rec.ondataavailable = e => chunksRef.current.push(e.data);
          rec.onstop = async () => {
            const blob = new Blob(chunksRef.current, { type: 'audio/webm' });
            const f = new File([blob], 'voice.webm', { type: 'audio/webm' });
            const url = await uploadFile(f);
            if (url) add({ sender_name: user.name, sender_role: user.role, message: '', file_url: url, is_voice: true, is_broadcast: isBroadcast });
            stream.getTracks().forEach(t => t.stop());
          };
          rec.start();
          recorderRef.current = rec;
          setRecording(true);
        } catch (e) { alert('Mic permission needed'); }
      };

      const stopRec = () => {
        if (recorderRef.current) {
          recorderRef.current.stop();
          setRecording(false);
          recorderRef.current = null;
        }
      };

      const send = async () => {
        if (!message.trim() && !file) return;
        let file_url = file ? await uploadFile(file) : null;
        if (file && !file_url) return;
        add({ sender_name: user.name, sender_role: user.role, message: message.trim(), file_url, is_broadcast: isBroadcast });
        setMessage(''); setFile(null); setIsBroadcast(false);
      };

      const handleInput = (val) => {
        setMessage(val);
        const last = val.split(' ').pop();
        if (last.startsWith('@')) {
          setMentionFilter(last.slice(1).toLowerCase());
          setShowMentions(true);
        } else setShowMentions(false);
      };

      const insertMention = (name) => {
        const words = message.split(' ');
        words[words.length - 1] = '@' + name;
        setMessage(words.join(' ') + ' ');
        setShowMentions(false);
      };

      return (
        <div className="space-y-4 max-w-3xl">
          <h2 className="text-2xl font-bold">Staff Chat</h2>
          <div className="card p-4 chat-box space-y-3">
            {data.slice().reverse().map(m => (
              <div key={m.id} className={`flex ${m.sender_name === user.name ? 'justify-end' : 'justify-start'}`}>
                <div className={`max-w-[80%] rounded-2xl px-4 py-2 ${m.is_broadcast ? 'bg-gradient-to-r from-red-500 to-pink-500 text-white' : (m.sender_name === user.name ? 'bg-red-500/20' : 'input-bg')}`}>
                  {m.is_broadcast && <div className="text-xs font-bold mb-1">📢 OFFICIAL</div>}
                  <div className="text-xs mb-1 opacity-80">{m.sender_name} · {m.sender_role}</div>
                  {m.message && <p className="text-sm">{linkify(m.message)}</p>}
                  {m.is_voice && m.file_url && <audio controls src={m.file_url} className="mt-2 w-full" style={{height:32}} />}
                  {m.file_url && !m.is_voice && m.file_url.match(/\.(jpg|jpeg|png|gif)$/i) && (
                    <img src={m.file_url} className="mt-2 rounded-xl max-h-48 cursor-pointer" onClick={() => window.open(m.file_url)} />
                  )}
                  {m.file_url && m.file_url.match(/\.pdf$/i) && (
                    <a href={m.file_url} target="_blank" className="text-sm mt-2 block underline">📄 PDF</a>
                  )}
                  {user.role === 'ADMIN' && <button onClick={() => confirm('Delete?') && remove(m.id)} className="text-xs opacity-60 mt-1">Delete</button>}
                </div>
              </div>
            ))}
            <div ref={bottomRef}></div>
          </div>

          {showMentions && (
            <div className="card p-2 max-h-32 overflow-y-auto">
              {allUsers.filter(u => u.full_name.toLowerCase().includes(mentionFilter)).slice(0,5).map(u => (
                <button key={u.id} onClick={() => insertMention(u.full_name.split(' ')[0])} className="block w-full text-left px-3 py-2 text-sm rounded hover:bg-red-500/10">
                  @{u.full_name}
                </button>
              ))}
            </div>
          )}

          <div className="card p-3 space-y-2">
            {user.role === 'ADMIN' && (
              <label className="flex items-center gap-2 text-sm">
                <input type="checkbox" checked={isBroadcast} onChange={e => setIsBroadcast(e.target.checked)} />
                📢 Official Broadcast
              </label>
            )}
            <div className="flex gap-2">
              <input value={message} onChange={e => handleInput(e.target.value)} onKeyDown={e => e.key === 'Enter' && send()} placeholder="Message... (@ to mention)" className="flex-1 p-3 rounded-xl input-bg" />
              <button onClick={recording ? stopRec : startRec} className={`px-3 rounded-xl ${recording ? 'bg-red-500 text-white' : 'input-bg'}`}>🎤</button>
              <button onClick={send} className="bg-gradient-to-r from-red-500 to-pink-500 text-white px-5 rounded-xl font-semibold">Send</button>
            </div>
            <input type="file" accept=".pdf,.jpg,.png" onChange={e => setFile(e.target.files[0])} className="text-sm" />
            {recording && <p className="text-xs text-red-400">Recording... tap mic to stop</p>}
          </div>
        </div>
      );
    }

      );
    }

    // ========== USERS ==========
    function Users() {
      const { data, add, remove } = useCollection('users');
      const [show, setShow] = useState(false);
      const [form, setForm] = useState({ username: '', password: '', full_name: '', role: 'TEACHER' });

      return (
        <div className="space-y-5 max-w-3xl">
          <div className="flex justify-between items-center">
            <h2 className="text-2xl font-bold">Manage Users</h2>
            <button onClick={() => setShow(!show)} className="bg-red-500/15 text-red-400 px-4 py-2 rounded-full text-sm">+ Create</button>
          </div>
          {show && (
            <div className="card p-5 space-y-3">
              <input placeholder="Full Name" className="w-full p-3 rounded-xl input-bg" value={form.full_name} onChange={e => setForm({...form, full_name: e.target.value})} />
              <input placeholder="Login ID" className="w-full p-3 rounded-xl input-bg" value={form.username} onChange={e => setForm({...form, username: e.target.value})} />
              <input placeholder="Password" className="w-full p-3 rounded-xl input-bg" value={form.password} onChange={e => setForm({...form, password: e.target.value})} />
              <select className="w-full p-3 rounded-xl input-bg" value={form.role} onChange={e => setForm({...form, role: e.target.value})}>
                <option value="TEACHER">Teacher</option>
                <option value="DOCTOR">Doctor</option>
                <option value="MAINTENANCE">Maintenance</option>
                <option value="ADMIN">Admin</option>
              </select>
              <button onClick={() => {
                if (form.username && form.password && form.full_name) {
                  add(form);
                  setShow(false);
                  setForm({ username: '', password: '', full_name: '', role: 'TEACHER' });
                  alert('Created!');
                } else alert('Fill all');
              }} className="w-full bg-gradient-to-r from-red-500 to-pink-500 text-white py-3 rounded-xl font-bold">Create</button>
            </div>
          )}
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
            {data.map(u => (
              <div key={u.id} className="card p-4 flex justify-between items-center">
                <div>
                  <p className="font-medium">{u.full_name}</p>
                  <p className="text-xs text-gray-400">{u.role}</p>
                </div>
                <button onClick={() => confirm('Delete?') && remove(u.id)} className="text-red-400 text-sm">Delete</button>
              </div>
            ))}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
