  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { background: #0b0b0e; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; color: #fff; }
    .card { background: #1c1c1e; border-radius: 16px; }
    .header { background: rgba(11,11,14,0.95); border-bottom: 1px solid #2c2c2e; }
    .bottom-nav { background: rgba(20,20,23,0.95); border-top: 1px solid #2c2c2e; }
    .icon { display: inline-flex; align-items: center; justify-content: center; }
    .icon svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .chat-box { max-height: 55vh; overflow-y: auto; }
    a { color: #60a5fa; text-decoration: underline; }
    .pin-dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #3a3a3c; display: inline-block; }
    .pin-dot.filled { background: #ef4444; border-color: #ef4444; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback, useRef } = React;

    const SUPABASE_URL = 'https://peiybuhnozgqatdyrdhf.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBlaXlidWhub3pncWF0ZHlyZGhmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5NzIyNDEsImV4cCI6MjEwMjU0ODI0MX0.a_1otAvBMRa20HSA01jcvtCbxwUpXNbmCzVmA9Qm-DE';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Icons
    const IconHome = () => <span className="icon"><svg viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg></span>;
    const IconClipboard = () => <span className="icon"><svg viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg></span>;
    const IconCalendar = () => <span className="icon"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></span>;
    const IconUser = () => <span className="icon"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>;
    const IconUsers = () => <span className="icon"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg></span>;
    const IconLogOut = () => <span className="icon"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></span>;
    const IconPlus = () => <span className="icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg></span>;
    const IconCheck = () => <span className="icon"><svg viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></span>;
    const IconAlert = () => <span className="icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg></span>;
    const IconEdit = () => <span className="icon"><svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></span>;
    const IconTrash = () => <span className="icon"><svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg></span>;
    const IconChat = () => <span className="icon"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg></span>;
    const IconFile = () => <span className="icon"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></span>;

    function useCollection(table) {
      const [data, setData] = useState([]);
      const load = useCallback(async () => {
        const { data: rows } = await supabase.from(table).select('*').order('created_at', { ascending: false });
        setData(rows || []);
      }, [table]);

      useEffect(() => {
        load();
        const channel = supabase.channel(table)
          .on('postgres_changes', { event: '*', schema: 'public', table }, () => load())
          .subscribe();
        return () => { supabase.removeChannel(channel); };
      }, [table, load]);

      const add = async (row) => {
        const { error } = await supabase.from(table).insert([row]);
        if (error) alert(error.message);
        else load();
      };
      const update = async (id, changes) => {
        const { error } = await supabase.from(table).update(changes).eq('id', id);
        if (error) alert(error.message);
        else load();
      };
      const remove = async (id) => {
        const { error } = await supabase.from(table).delete().eq('id', id);
        if (error) alert(error.message);
        else load();
      };
      return { data, add, update, remove };
    }

    function linkify(text) {
      if (!text) return text;
      const urlRegex = /(https?:\/\/[^\s]+)/g;
      return text.split(urlRegex).map((part, i) =>
        urlRegex.test(part) ? <a key={i} href={part} target="_blank" rel="noopener noreferrer">{part}</a> : part
      );
    }

    async function uploadFile(file) {
      if (!file) return null;
      const ext = file.name.split('.').pop();
      const fileName = Date.now() + '_' + Math.random().toString(36).substring(2, 8) + '.' + ext;
      const { error } = await supabase.storage.from('school-files').upload(fileName, file);
      if (error) {
        alert('Upload failed: ' + error.message);
        return null;
      }
      const { data } = supabase.storage.from('school-files').getPublicUrl(fileName);
      return data.publicUrl;
    }

    // ==================== APP ====================
    function App() {
      const [user, setUser] = useState(null);
      const [tab, setTab] = useState('home');
      const [mode, setMode] = useState('loading'); // loading | pin | login | setpin | app

      useEffect(() => {
        const saved = localStorage.getItem('bes_pin_user');
        if (saved) {
          try {
            const parsed = JSON.parse(saved);
            if (parsed && parsed.pin) {
              setMode('pin');
              return;
            }
          } catch (e) {}
        }
        setMode('login');
      }, []);

      const handlePasswordLogin = async (username, password) => {
        const { data, error } = await supabase
          .from('users')
          .select('*')
          .eq('username', username.trim())
          .eq('password', password.trim())
          .maybeSingle();

        if (error) return alert('Error: ' + error.message);
        if (!data) return alert('Invalid Login ID or Password');

        const userData = { id: data.username, name: data.full_name, role: data.role };
        setUser(userData);

        // Check if PIN already exists for this user
        const saved = localStorage.getItem('bes_pin_user');
        if (saved) {
          try {
            const parsed = JSON.parse(saved);
            if (parsed.username === data.username && parsed.pin) {
              setMode('app');
              return;
            }
          } catch (e) {}
        }
        // Ask to set PIN
        setMode('setpin');
      };

      const handlePinSuccess = (userData) => {
        setUser(userData);
        setMode('app');
      };

      const handleSetPin = (pin) => {
        const data = {
          username: user.id,
          name: user.name,
          role: user.role,
          pin: pin
        };
        localStorage.setItem('bes_pin_user', JSON.stringify(data));
        setMode('app');
      };

      const logout = () => {
        setUser(null);
        setTab('home');
        setMode('pin'); // go back to PIN screen
      };

      const fullLogout = () => {
        localStorage.removeItem('bes_pin_user');
        setUser(null);
        setTab('home');
        setMode('login');
      };

      if (mode === 'loading') {
        return <div className="min-h-screen flex items-center justify-center text-gray-400">Loading...</div>;
      }

      if (mode === 'pin') {
        return <PinScreen onSuccess={handlePinSuccess} onUsePassword={() => setMode('login')} onFullLogout={fullLogout} />;
      }

      if (mode === 'login') {
        return <LoginScreen onLogin={handlePasswordLogin} />;
      }

      if (mode === 'setpin') {
        return <SetPinScreen onSave={handleSetPin} onSkip={() => setMode('app')} />;
      }

      // Main App
      return (
        <div className="min-h-screen bg-[#0b0b0e] flex flex-col md:flex-row">
          {/* Desktop Sidebar */}
          <aside className="hidden md:flex md:flex-col md:w-64 bg-[#141416] border-r border-[#2c2c2e] p-4 sticky top-0 h-screen">
            <div className="mb-8">
              <h1 className="text-lg font-bold">Bes An Noor Model School</h1>
              <p className="text-xs text-gray-400">(Boys' Unit)</p>
            </div>
            <nav className="flex-1 space-y-1">
              <SideBtn active={tab==='home'} onClick={() => setTab('home')} icon={<IconHome />} label="Home" />
              <SideBtn active={tab==='notices'} onClick={() => setTab('notices')} icon={<IconClipboard />} label="Notices" />
              <SideBtn active={tab==='schedule'} onClick={() => setTab('schedule')} icon={<IconCalendar />} label="Proxy / Replace" />
              <SideBtn active={tab==='report'} onClick={() => setTab('report')} icon={<IconAlert />} label="Report Issue" />
              <SideBtn active={tab==='chat'} onClick={() => setTab('chat')} icon={<IconChat />} label="Chat" />
              <SideBtn active={tab==='results'} onClick={() => setTab('results')} icon={<IconFile />} label="Exam Results" />
              <SideBtn active={tab==='profile'} onClick={() => setTab('profile')} icon={<IconUser />} label="Profile" />
              {user.role === 'ADMIN' && <SideBtn active={tab==='users'} onClick={() => setTab('users')} icon={<IconUsers />} label="Manage Users" />}
            </nav>
            <button onClick={logout} className="mt-4 flex items-center gap-2 text-gray-400 hover:text-white text-sm">
              <IconLogOut /> Logout
            </button>
          </aside>

          <div className="flex-1 flex flex-col min-h-screen">
            {/* Mobile Header */}
            <header className="header px-4 py-4 flex justify-between items-center sticky top-0 z-20 md:hidden">
              <div>
                <h1 className="text-base font-bold">Bes An Noor Model School</h1>
                <p className="text-xs text-gray-400">(Boys' Unit) · {user.name}</p>
              </div>
              <button onClick={logout} className="w-10 h-10 rounded-full bg-[#2c2c2e] flex items-center justify-center">
                <IconLogOut />
              </button>
            </header>

            {/* Desktop Header */}
            <header className="hidden md:flex header px-6 py-4 justify-between items-center sticky top-0 z-20">
              <h2 className="text-lg font-semibold capitalize">{tab === 'schedule' ? 'Proxy / Replace' : tab}</h2>
              <div className="text-sm text-gray-400">{user.name} · {user.role}</div>
            </header>

            <main className="flex-1 overflow-y-auto px-4 md:px-8 pb-24 md:pb-8 pt-4">
              {tab === 'home' && <Home user={user} setTab={setTab} />}
              {tab === 'notices' && <Notices user={user} />}
              {tab === 'schedule' && <ScheduleTab user={user} />}
              {tab === 'report' && <ReportTab user={user} />}
              {tab === 'chat' && <ChatTab user={user} />}
              {tab === 'results' && <ResultsTab user={user} />}
              {tab === 'profile' && <Profile user={user} setUser={setUser} setTab={setTab} onFullLogout={fullLogout} />}
              {tab === 'users' && user.role === 'ADMIN' && <Users />}
            </main>

            {/* Mobile Bottom Nav */}
            <nav className="bottom-nav fixed bottom-0 left-0 right-0 flex justify-around py-2 z-20 md:hidden">
              <NavBtn active={tab==='home'} onClick={() => setTab('home')} icon={<IconHome />} label="Home" />
              <NavBtn active={tab==='notices'} onClick={() => setTab('notices')} icon={<IconClipboard />} label="Notices" />
              <NavBtn active={tab==='schedule'} onClick={() => setTab('schedule')} icon={<IconCalendar />} label="Proxy" />
              <NavBtn active={tab==='chat'} onClick={() => setTab('chat')} icon={<IconChat />} label="Chat" />
              <NavBtn active={tab==='profile'} onClick={() => setTab('profile')} icon={<IconUser />} label="Profile" />
            </nav>
          </div>
        </div>
      );
    }

    function SideBtn({ active, onClick, icon, label }) {
      return (
        <button onClick={onClick} className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm ${active ? 'bg-red-500/15 text-red-400' : 'text-gray-400 hover:bg-[#1c1c1e]'}`}>
          {icon} {label}
        </button>
      );
    }

    function NavBtn({ active, onClick, icon, label }) {
      return (
        <button onClick={onClick} className={`flex flex-col items-center gap-0.5 text-[10px] ${active ? 'text-red-500' : 'text-gray-400'}`}>
          {icon}<span>{label}</span>
        </button>
      );
    }

    // ==================== PIN SCREEN ====================
    function PinScreen({ onSuccess, onUsePassword, onFullLogout }) {
      const [pin, setPin] = useState('');
      const [error, setError] = useState('');

      const saved = JSON.parse(localStorage.getItem('bes_pin_user') || '{}');

      const press = (num) => {
        if (pin.length >= 4) return;
        const next = pin + num;
        setPin(next);
        setError('');
        if (next.length === 4) {
          if (next === saved.pin) {
            onSuccess({ id: saved.username, name: saved.name, role: saved.role });
          } else {
            setError('Wrong PIN');
            setTimeout(() => setPin(''), 500);
          }
        }
      };

      return (
        <div className="min-h-screen flex items-center justify-center p-6">
          <div className="w-full max-w-xs text-center">
            <img src="logo.png" className="w-20 h-20 mx-auto mb-4 object-contain" onError={e => e.target.style.display='none'} />
            <h2 className="text-xl font-bold mb-1">Welcome back</h2>
            <p className="text-gray-400 mb-8">{saved.name || 'User'}</p>

            <div className="flex justify-center gap-3 mb-6">
              {[0,1,2,3].map(i => <div key={i} className={`pin-dot ${pin.length > i ? 'filled' : ''}`}></div>)}
            </div>
            {error && <p className="text-red-400 text-sm mb-4">{error}</p>}

            <div className="grid grid-cols-3 gap-3 mb-8">
              {[1,2,3,4,5,6,7,8,9].map(n => (
                <button key={n} onClick={() => press(String(n))} className="h-14 rounded-full bg-[#2c2c2e] text-xl font-medium active:scale-95">{n}</button>
              ))}
              <div></div>
              <button onClick={() => press('0')} className="h-14 rounded-full bg-[#2c2c2e] text-xl font-medium active:scale-95">0</button>
              <button onClick={() => setPin(pin.slice(0,-1))} className="h-14 rounded-full bg-[#2c2c2e] text-lg active:scale-95">⌫</button>
            </div>

            <button onClick={onUsePassword} className="text-sm text-gray-400 underline block w-full mb-3">Use Password instead</button>
            <button onClick={onFullLogout} className="text-sm text-red-400">Logout Completely</button>
          </div>
        </div>
      );
    }

    // ==================== SET PIN ====================
    function SetPinScreen({ onSave, onSkip }) {
      const [pin, setPin] = useState('');
      const [confirm, setConfirm] = useState('');
      const [step, setStep] = useState(1);

      const press = (num) => {
        if (step === 1) {
          if (pin.length >= 4) return;
          const next = pin + num;
          setPin(next);
          if (next.length === 4) setTimeout(() => setStep(2), 250);
        } else {
          if (confirm.length >= 4) return;
          const next = confirm + num;
          setConfirm(next);
          if (next.length === 4) {
            if (next === pin) onSave(next);
            else {
              alert('PIN does not match');
              setPin(''); setConfirm(''); setStep(1);
            }
          }
        }
      };

      const current = step === 1 ? pin : confirm;

      return (
        <div className="min-h-screen flex items-center justify-center p-6">
          <div className="w-full max-w-xs text-center">
            <h2 className="text-xl font-bold mb-2">{step === 1 ? 'Create PIN' : 'Confirm PIN'}</h2>
            <p className="text-gray-400 mb-8">{step === 1 ? 'Set a 4-digit PIN for quick login' : 'Enter the same PIN again'}</p>

            <div className="flex justify-center gap-3 mb-8">
              {[0,1,2,3].map(i => <div key={i} className={`pin-dot ${current.length > i ? 'filled' : ''}`}></div>)}
            </div>

            <div className="grid grid-cols-3 gap-3 mb-8">
              {[1,2,3,4,5,6,7,8,9].map(n => (
                <button key={n} onClick={() => press(String(n))} className="h-14 rounded-full bg-[#2c2c2e] text-xl font-medium active:scale-95">{n}</button>
              ))}
              <div></div>
              <button onClick={() => press('0')} className="h-14 rounded-full bg-[#2c2c2e] text-xl font-medium active:scale-95">0</button>
              <button onClick={() => step === 1 ? setPin(pin.slice(0,-1)) : setConfirm(confirm.slice(0,-1))} className="h-14 rounded-full bg-[#2c2c2e] text-lg active:scale-95">⌫</button>
            </div>

            <button onClick={onSkip} className="text-sm text-gray-400 underline">Skip for now</button>
          </div>
        </div>
      );
    }

    // ==================== LOGIN ====================
    function LoginScreen({ onLogin }) {
      const [id, setId] = useState('');
      const [pass, setPass] = useState('');
      const [loading, setLoading] = useState(false);

      const submit = async () => {
        if (!id.trim() || !pass.trim()) return alert('Enter Login ID and Password');
        setLoading(true);
        await onLogin(id, pass);
        setLoading(false);
      };

      return (
        <div className="min-h-screen flex items-center justify-center p-4">
          <div className="w-full max-w-sm">
            <div className="text-center mb-8">
              <img src="logo.png" className="w-28 h-28 mx-auto mb-4 object-contain" onError={e => e.target.style.display='none'} />
              <h1 className="text-2xl font-bold">Bes An Noor Model School</h1>
              <p className="text-gray-400 mt-1">(Boys' Unit)</p>
            </div>
            <div className="card p-6 space-y-4">
              <input value={id} onChange={e => setId(e.target.value)} placeholder="Login ID" className="w-full p-3 bg-[#2c2c2e] rounded-xl text-white border border-[#3a3a3c]" />
              <input type="password" value={pass} onChange={e => setPass(e.target.value)} placeholder="Password" className="w-full p-3 bg-[#2c2c2e] rounded-xl text-white border border-[#3a3a3c]" />
              <button onClick={submit} disabled={loading} className="w-full bg-gradient-to-r from-red-500 to-pink-500 text-white font-bold py-3 rounded-xl">
                {loading ? 'Please wait...' : 'Continue'}
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ==================== HOME ====================
    function Home({ user, setTab }) {
      const { data: attendance, add, update } = useCollection('attendance');
      const today = new Date().toISOString().split('T')[0];
      const mine = attendance.find(a => a.date === today && a.teacher_id === user.id);
      const todayList = attendance.filter(a => a.date === today);
      const [showForm, setShowForm] = useState(false);
      const [form, setForm] = useState({ reason: '', from_date: today, to_date: '', leave_time: 'Morning', return_date: '', return_time: '' });

      const markPresent = () => {
        if (mine) update(mine.id, { status: 'PRESENT', reason: null, from_date: null, to_date: null, leave_time: null, return_date: null, return_time: null });
        else add({ date: today, teacher_id: user.id, name: user.name, status: 'PRESENT' });
        setShowForm(false);
      };

      const submitAbsent = () => {
        if (!form.reason || !form.to_date || !form.return_date) return alert('Fill all required fields');
        const payload = { date: today, teacher_id: user.id, name: user.name, status: 'ABSENT', ...form };
        if (mine) update(mine.id, payload);
        else add(payload);
        setShowForm(false);
      };

      return (
        <div className="space-y-6 max-w-4xl">
          <div className="card p-5 flex items-center gap-4">
            <div className="w-14 h-14 rounded-full bg-gradient-to-br from-red-500 to-pink-500 flex items-center justify-center"><IconUser /></div>
            <div>
              <h2 className="font-bold text-xl">Welcome, {user.name}</h2>
              <p className="text-sm text-gray-400">{user.role}</p>
            </div>
          </div>

          <div className="card p-5">
            <h3 className="font-bold text-lg mb-1">Daily Attendance</h3>
            <p className="text-sm text-gray-400 mb-4">{new Date().toDateString()}</p>

            {mine && (
              <div className="mb-4">
                <span className={`inline-block px-4 py-2 rounded-full text-sm font-medium ${mine.status === 'PRESENT' ? 'text-green-400 bg-green-500/10' : 'text-orange-400 bg-orange-500/10'}`}>
                  Current: {mine.status}
                </span>
                {mine.status === 'ABSENT' && (
                  <div className="mt-3 text-sm bg-[#252528] p-4 rounded-xl space-y-1">
                    <p>Reason: {mine.reason}</p>
                    <p>From: {mine.from_date} → {mine.to_date}</p>
                    <p>Leaving: {mine.leave_time}</p>
                    <p>Return: {mine.return_date} {mine.return_time}</p>
                  </div>
                )}
              </div>
            )}

            {!showForm ? (
              <div className="flex gap-3">
                <button onClick={markPresent} className="flex-1 bg-gradient-to-r from-red-500 to-pink-500 py-3 rounded-full text-sm font-semibold">Present</button>
                <button onClick={() => setShowForm(true)} className="flex-1 bg-[#2c2c2e] text-orange-400 border border-orange-500/40 py-3 rounded-full text-sm font-semibold">Absent</button>
              </div>
            ) : (
              <div className="space-y-3">
                <textarea placeholder="Reason *" className="w-full p-3 bg-[#2c2c2e] rounded-xl min-h-[80px]" value={form.reason} onChange={e => setForm({...form, reason: e.target.value})} />
                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="text-xs text-gray-400">From Date</label>
                    <input type="date" className="w-full p-3 bg-[#2c2c2e] rounded-xl" value={form.from_date} onChange={e => setForm({...form, from_date: e.target.value})} />
                  </div>
                  <div>
                    <label className="text-xs text-gray-400">To Date *</label>
                    <input type="date" className="w-full p-3 bg-[#2c2c2e] rounded-xl" value={form.to_date} onChange={e => setForm({...form, to_date: e.target.value})} />
                  </div>
                </div>
                <div>
                  <label className="text-xs text-gray-400">Leaving Time</label>
                  <select className="w-full p-3 bg-[#2c2c2e] rounded-xl" value={form.leave_time} onChange={e => setForm({...form, leave_time: e.target.value})}>
                    <option>Morning</option><option>Afternoon</option><option>Evening</option>
                  </select>
                </div>
                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="text-xs text-gray-400">Return Date *</label>
                    <input type="date" className="w-full p-3 bg-[#2c2c2e] rounded-xl" value={form.return_date} onChange={e => setForm({...form, return_date: e.target.value})} />
                  </div>
                  <div>
                    <label className="text-xs text-gray-400">Return Time</label>
                    <input type="time" className="w-full p-3 bg-[#2c2c2e] rounded-xl" value={form.return_time} onChange={e => setForm({...form, return_time: e.target.value})} />
                  </div>
                </div>
                <div className="flex gap-3">
                  <button onClick={submitAbsent} className="flex-1 bg-gradient-to-r from-red-500 to-pink-500 py-3 rounded-xl font-semibold">Submit</button>
                  <button onClick={() => setShowForm(false)} className="px-5 bg-[#2c2c2e] rounded-xl">Cancel</button>
                </div>
              </div>
            )}
          </div>

          {user.role === 'ADMIN' && (
            <div className="card p-5">
              <h3 className="font-semibold mb-4">Today's Attendance</h3>
              {todayList.length === 0 ? <p className="text-sm text-gray-400">No attendance yet</p> : (
                <div className="space-y-3">
                  {todayList.map(a => (
                    <div key={a.id} className="bg-[#252528] rounded-xl p-4">
                      <div className="flex justify-between">
                        <span className="font-medium">{a.name}</span>
                        <span className={a.status === 'PRESENT' ? 'text-green-400' : 'text-orange-400'}>{a.status}</span>
                      </div>
                      {a.status === 'ABSENT' && (
                        <div className="mt-2 text-xs text-gray-400 border-t border-gray-700 pt-2">
                          <p>Reason: {a.reason}</p>
                          <p>{a.from_date} → {a.to_date} | Leaving: {a.leave_time}</p>
                        </div>
                      )}
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

          <div>
            <h3 className="font-semibold mb-3 text-gray-300">Quick Actions</h3>
            <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
              <ActionCard icon={<IconClipboard />} title="Notices" onClick={() => setTab('notices')} />
              <ActionCard icon={<IconCalendar />} title="Proxy / Replace" onClick={() => setTab('schedule')} />
              <ActionCard icon={<IconAlert />} title="Report Issue" onClick={() => setTab('report')} />
              <ActionCard icon={<IconChat />} title="Chat" onClick={() => setTab('chat')} />
              <ActionCard icon={<IconFile />} title="Exam Results" onClick={() => setTab('results')} />
              <ActionCard icon={<IconUser />} title="Profile" onClick={() => setTab('profile')} />
            </div>
          </div>
        </div>
      );
    }

    function ActionCard({ icon, title, onClick }) {
      return (
        <button onClick={onClick} className="card p-4 text-left hover:bg-[#252528]">
          <div className="text-red-400 mb-2">{icon}</div>
          <div className="font-semibold text-sm">{title}</div>
        </button>
      );
    }

    // ==================== NOTICES ====================
    function Notices({ user }) {
      const { data, add, update, remove } = useCollection('notices');
      const { data: comments, add: addComment, remove: removeComment } = useCollection('comments');
      const [show, setShow] = useState(false);
      const [editId, setEditId] = useState(null);
      const [title, setTitle] = useState('');
      const [content, setContent] = useState('');
      const [file, setFile] = useState(null);
      const [cText, setCText] = useState({});

      const save = async () => {
        if (!title || !content) return alert('Title and content required');
        let file_url = null;
        if (file) {
          file_url = await uploadFile(file);
          if (!file_url) return;
        }
        if (editId) {
          const ch = { title, content };
          if (file_url) ch.file_url = file_url;
          update(editId, ch);
        } else {
          add({ title, content, type: 'text', author: user.name, file_url });
        }
        setShow(false); setEditId(null); setTitle(''); setContent(''); setFile(null);
      };

      return (
        <div className="space-y-5 max-w-3xl">
          <div className="flex justify-between items-center">
            <h2 className="text-2xl font-bold">Notices</h2>
            {user.role === 'ADMIN' && (
              <button onClick={() => { setShow(!show); setEditId(null); setTitle(''); setContent(''); }} className="text-red-500 bg-red-500/10 p-2 rounded-full"><IconPlus /></button>
            )}
          </div>

          {show && (
            <div className="card p-5 space-y-3">
              <input value={title} onChange={e => setTitle(e.target.value)} placeholder="Title" className="w-full p-3 bg-[#2c2c2e] rounded-xl" />
              <textarea value={content} onChange={e => setContent(e.target.value)} placeholder="Write notice..." className="w-full p-3 bg-[#2c2c2e] rounded-xl min-h-[100px]" />
              <input type="file" accept=".pdf,.jpg,.jpeg,.png" onChange={e => setFile(e.target.files[0])} className="text-sm text-gray-400" />
              <div className="flex gap-3">
                <button onClick={save} className="flex-1 bg-gradient-to-r from-red-500 to-pink-500 py-3 rounded-xl font-bold">{editId ? 'Update' : 'Publish'}</button>
                <button onClick={() => setShow(false)} className="px-5 bg-[#2c2c2e] rounded-xl">Cancel</button>
              </div>
            </div>
          )}

          {data.map(n => {
            const nComments = comments.filter(c => c.target_type === 'notice' && c.target_id === String(n.id));
            const canEdit = user.role === 'ADMIN' || n.author === user.name;
            return (
              <div key={n.id} className="card p-5 border-l-4 border-red-500">
                <div className="flex justify-between">
                  <div>
                    <h3 className="font-bold text-lg">{n.title}</h3>
                    <p className="text-xs text-gray-400">By {n.author}</p>
                  </div>
                  {canEdit && (
                    <div className="flex gap-2">
                      <button onClick={() => { setEditId(n.id); setTitle(n.title); setContent(n.content); setShow(true); }} className="text-blue-400"><IconEdit /></button>
                      {user.role === 'ADMIN' && <button onClick={() => confirm('Delete?') && remove(n.id)} className="text-red-400"><IconTrash /></button>}
                    </div>
                  )}
                </div>
                <p className="text-sm mt-2 whitespace-pre-wrap">{linkify(n.content)}</p>
                {n.file_url && <a href={n.file_url} target="_blank" className="text-blue-400 text-sm flex items-center gap-1 mt-2"><IconFile /> Attachment</a>}

                <div className="mt-4 border-t border-[#2c2c2e] pt-3">
                  <p className="text-xs text-gray-400 mb-2">Comments ({nComments.length})</p>
                  {nComments.map(c => (
                    <div key={c.id} className="bg-[#252528] rounded-lg p-3 mb-2 text-sm">
                      <div className="flex justify-between">
                        <span className="text-red-400 font-medium">{c.user_name}</span>
                        {(user.role === 'ADMIN' || c.user_name === user.name) && <button onClick={() => removeComment(c.id)} className="text-red-400 text-xs">Delete</button>}
                      </div>
                      <p className="mt-1">{linkify(c.content)}</p>
                    </div>
                  ))}
                  <div className="flex gap-2 mt-2">
                    <input value={cText[n.id] || ''} onChange={e => setCText({...cText, [n.id]: e.target.value})} placeholder="Write comment..." className="flex-1 p-2 bg-[#2c2c2e] rounded-lg text-sm" />
                    <button onClick={() => { if(cText[n.id]?.trim()){ addComment({target_type:'notice', target_id:String(n.id), user_name:user.name, content:cText[n.id]}); setCText({...cText, [n.id]:''}); }}} className="bg-red-500 px-4 rounded-lg text-sm">Post</button>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      );
    }

    // ==================== SCHEDULE ====================
    function ScheduleTab({ user }) {
      const { data, add, update, remove } = useCollection('proxies');
      const { data: comments, add: addComment, remove: removeComment } = useCollection('comments');
      const today = new Date().toISOString().split('T')[0];
      const todayItems = data.filter(p => p.date === today);
      const [show, setShow] = useState(false);
      const [editId, setEditId] = useState(null);
      const [form, setForm] = useState({ date: today, type: 'PROXY', absent_teacher: '', proxy_teacher: '', class_room: '', subject: '' });
      const [cText, setCText] = useState({});

      const save = () => {
        if (!form.date || !form.proxy_teacher) return alert('Date and Teacher required');
        if (editId) update(editId, form);
        else add(form);
        setShow(false); setEditId(null);
        setForm({ date: today, type: 'PROXY', absent_teacher: '', proxy_teacher: '', class_room: '', subject: '' });
      };

      return (
        <div className="space-y-5 max-w-3xl">
          <div className="flex justify-between items-center">
            <div>
              <h2 className="text-2xl font-bold">Proxy / Replace</h2>
              <p className="text-sm text-gray-400">Today only</p>
            </div>
            {user.role === 'ADMIN' && (
              <button onClick={() => { setShow(!show); setEditId(null); }} className="bg-red-500/15 text-red-400 px-4 py-2 rounded-full text-sm font-semibold flex items-center gap-2"><IconPlus /> Add</button>
            )}
          </div>

          {show && user.role === 'ADMIN' && (
            <div className="card p-5 space-y-3">
              <select className="w-full p-3 bg-[#2c2c2e] rounded-xl" value={form.type} onChange={e => setForm({...form, type: e.target.value})}>
                <option value="PROXY">Proxy Class</option>
                <option value="REPLACE">Replace Class</option>
              </select>
              <input type="date" className="w-full p-3 bg-[#2c2c2e] rounded-xl" value={form.date} onChange={e => setForm({...form, date: e.target.value})} />
              <input placeholder="Absent / Original Teacher" className="w-full p-3 bg-[#2c2c2e] rounded-xl" value={form.absent_teacher} onChange={e => setForm({...form, absent_teacher: e.target.value})} />
              <input placeholder="Proxy / Replace Teacher" className="w-full p-3 bg-[#2c2c2e] rounded-xl" value={form.proxy_teacher} onChange={e => setForm({...form, proxy_teacher: e.target.value})} />
              <div className="grid grid-cols-2 gap-3">
                <input placeholder="Class" className="p-3 bg-[#2c2c2e] rounded-xl" value={form.class_room} onChange={e => setForm({...form, class_room: e.target.value})} />
                <input placeholder="Subject" className="p-3 bg-[#2c2c2e] rounded-xl" value={form.subject} onChange={e => setForm({...form, subject: e.target.value})} />
              </div>
              <div className="flex gap-3">
                <button onClick={save} className="flex-1 bg-gradient-to-r from-red-500 to-pink-500 py-3 rounded-xl font-bold">{editId ? 'Update' : 'Save'}</button>
                <button onClick={() => setShow(false)} className="px-5 bg-[#2c2c2e] rounded-xl">Cancel</button>
              </div>
            </div>
          )}

          {todayItems.length === 0 ? <p className="text-center text-gray-400 py-12">No classes today</p> : todayItems.map(p => {
            const pComments = comments.filter(c => c.target_type === 'proxy' && c.target_id === String(p.id));
            return (
              <div key={p.id} className="card p-5 border-l-4 border-red-500">
                <div className="flex justify-between mb-3">
                  <div className="flex gap-2 text-xs">
                    <span className={`px-3 py-1 rounded-full ${p.type === 'REPLACE' ? 'bg-blue-500/20 text-blue-400' : 'bg-red-500/20 text-red-400'}`}>{p.type || 'PROXY'}</span>
                    <span className="bg-[#2c2c2e] px-3 py-1 rounded-full">{p.class_room}</span>
                  </div>
                  {user.role === 'ADMIN' && (
                    <div className="flex gap-2">
                      <button onClick={() => { setEditId(p.id); setForm(p); setShow(true); }} className="text-blue-400"><IconEdit /></button>
                      <button onClick={() => confirm('Delete?') && remove(p.id)} className="text-red-400"><IconTrash /></button>
                    </div>
                  )}
                </div>
                <div className="flex gap-6 text-sm mb-2">
                  <div className="flex-1"><p className="text-gray-400 text-xs">Assigned To</p><p className="font-semibold">{p.proxy_teacher}</p></div>
                  <div className="flex-1"><p className="text-gray-400 text-xs">Original</p><p className="line-through text-gray-400">{p.absent_teacher}</p></div>
                </div>
                <p className="text-sm border-t border-[#2c2c2e] pt-3">Subject: {p.subject}</p>

                <div className="mt-4 border-t border-[#2c2c2e] pt-3">
                  <p className="text-xs text-gray-400 mb-2">Comments ({pComments.length})</p>
                  {pComments.map(c => (
                    <div key={c.id} className="bg-[#252528] rounded-lg p-3 mb-2 text-sm">
                      <div className="flex justify-between">
                        <span className="text-red-400">{c.user_name}</span>
                        {(user.role === 'ADMIN' || c.user_name === user.name) && <button onClick={() => removeComment(c.id)} className="text-red-400 text-xs">Delete</button>}
                      </div>
                      <p>{linkify(c.content)}</p>
                    </div>
                  ))}
                  <div className="flex gap-2 mt-2">
                    <input value={cText[p.id] || ''} onChange={e => setCText({...cText, [p.id]: e.target.value})} placeholder="Comment..." className="flex-1 p-2 bg-[#2c2c2e] rounded-lg text-sm" />
                    <button onClick={() => { if(cText[p.id]?.trim()){ addComment({target_type:'proxy', target_id:String(p.id), user_name:user.name, content:cText[p.id]}); setCText({...cText, [p.id]:''}); }}} className="bg-red-500 px-4 rounded-lg text-sm">Post</button>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      );
    }

    // ==================== REPORT ====================
    function ReportTab({ user }) {
      const { data: medical, add: addMed, update: upMed } = useCollection('medical');
      const { data: maint, add: addMaint, update: upMaint } = useCollection('maintenance');
      const [type, setType] = useState('medical');
      const [show, setShow] = useState(false);
      const [form, setForm] = useState({ student_name: '', class_name: '', reg: '', room_number: '', description: '', issue_type: '', location: '' });

      const isTeacher = user.role === 'TEACHER';
      const canResolveMed = user.role === 'DOCTOR' || user.role === 'ADMIN';
      const canResolveMaint = user.role === 'MAINTENANCE' || user.role === 'ADMIN';

      const submit = () => {
        if (type === 'medical') {
          if (!form.student_name || !form.description) return alert('Student name and problem required');
          addMed({
            student_name: form.student_name,
            room: `Class: ${form.class_name || 'N/A'} | Reg: ${form.reg || 'N/A'} | Room: ${form.room_number || 'N/A'}`,
            description: form.description,
            reported_by: user.name,
            status: 'PENDING'
          });
        } else {
          if (!form.issue_type || !form.description) return alert('Issue type and description required');
          addMaint({ type: form.issue_type, location: form.location || 'N/A', description: form.description, reported_by: user.name, status: 'PENDING' });
        }
        setShow(false);
        setForm({ student_name: '', class_name: '', reg: '', room_number: '', description: '', issue_type: '', location: '' });
      };

      const list = type === 'medical' ? medical : maint;

      return (
        <div className="space-y-5 max-w-3xl">
          <div className="flex justify-between items-center">
            <h2 className="text-2xl font-bold">Report Issues</h2>
            {isTeacher && <button onClick={() => setShow(!show)} className="bg-red-500/15 text-red-400 px-4 py-2 rounded-full text-sm font-semibold flex items-center gap-2"><IconPlus /> New</button>}
          </div>

          <div className="flex bg-[#1c1c1e] p-1 rounded-xl">
            <button onClick={() => setType('medical')} className={`flex-1 py-2 rounded-lg text-sm ${type==='medical' ? 'bg-[#2c2c2e] text-white' : 'text-gray-400'}`}>Medical</button>
            <button onClick={() => setType('facility')} className={`flex-1 py-2 rounded-lg text-sm ${type==='facility' ? 'bg-[#2c2c2e] text-white' : 'text-gray-400'}`}>Facility</button>
          </div>

          {show && isTeacher && (
            <div className="card p-5 space-y-3">
              {type === 'medical' ? (
                <>
                  <input placeholder="Student Name *" className="w-full p-3 bg-[#2c2c2e] rounded-xl" value={form.student_name} onChange={e => setForm({...form, student_name: e.target.value})} />
                  <div className="grid grid-cols-3 gap-3">
                    <input placeholder="Class" className="p-3 bg-[#2c2c2e] rounded-xl" value={form.class_name} onChange={e => setForm({...form, class_name: e.target.value})} />
                    <input placeholder="Reg No" className="p-3 bg-[#2c2c2e] rounded-xl" value={form.reg} onChange={e => setForm({...form, reg: e.target.value})} />
                    <input placeholder="Room No" className="p-3 bg-[#2c2c2e] rounded-xl" value={form.room_number} onChange={e => setForm({...form, room_number: e.target.value})} />
                  </div>
                  <textarea placeholder="Problem description *" className="w-full p-3 bg-[#2c2c2e] rounded-xl min-h-[100px]" value={form.description} onChange={e => setForm({...form, description: e.target.value})} />
                </>
              ) : (
                <>
                  <input placeholder="Issue Type *" className="w-full p-3 bg-[#2c2c2e] rounded-xl" value={form.issue_type} onChange={e => setForm({...form, issue_type: e.target.value})} />
                  <input placeholder="Location" className="w-full p-3 bg-[#2c2c2e] rounded-xl" value={form.location} onChange={e => setForm({...form, location: e.target.value})} />
                  <textarea placeholder="Description *" className="w-full p-3 bg-[#2c2c2e] rounded-xl min-h-[100px]" value={form.description} onChange={e => setForm({...form, description: e.target.value})} />
                </>
              )}
              <button onClick={submit} className="w-full bg-gradient-to-r from-red-500 to-pink-500 py-3 rounded-xl font-bold">Submit</button>
            </div>
          )}

          {list.map(item => (
            <div key={item.id} className={`card p-5 border-l-4 ${item.status === 'RESOLVED' ? 'border-green-500 opacity-70' : 'border-red-500'}`}>
              <div className="flex justify-between mb-2">
                <h4 className="font-bold">{type === 'medical' ? item.student_name : item.type}</h4>
                <span className={`text-xs px-2 py-1 rounded-full ${item.status === 'RESOLVED' ? 'bg-green-500/20 text-green-400' : 'bg-orange-500/20 text-orange-400'}`}>{item.status}</span>
              </div>
              <p className="text-xs text-gray-400 mb-2">{item.room || item.location}</p>
              <p className="text-sm bg-[#252528] p-3 rounded-lg mb-2">{item.description}</p>
              <p className="text-xs text-gray-500 text-right">By: {item.reported_by}</p>
              {item.status !== 'RESOLVED' && ((type === 'medical' && canResolveMed) || (type === 'facility' && canResolveMaint)) && (
                <button onClick={() => type === 'medical' ? upMed(item.id, {status:'RESOLVED'}) : upMaint(item.id, {status:'RESOLVED'})} className="mt-3 w-full bg-[#2c2c2e] py-2 rounded-xl text-sm flex items-center justify-center gap-2">
                  <IconCheck /> Mark Resolved
                </button>
              )}
            </div>
          ))}
        </div>
      );
    }

    // ==================== CHAT ====================
    function ChatTab({ user }) {
      const { data, add, update, remove } = useCollection('chat_messages');
      const [message, setMessage] = useState('');
      const [file, setFile] = useState(null);
      const [editId, setEditId] = useState(null);
      const bottomRef = useRef();

      useEffect(() => {
        bottomRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [data]);

      const send = async () => {
        if (!message.trim() && !file && !editId) return;
        let file_url = null;
        if (file) {
          file_url = await uploadFile(file);
          if (!file_url) return;
        }
        if (editId) {
          const ch = { message: message.trim() };
          if (file_url) ch.file_url = file_url;
          update(editId, ch);
          setEditId(null);
        } else {
          add({ sender_name: user.name, sender_role: user.role, message: message.trim(), file_url });
        }
        setMessage('');
        setFile(null);
      };

      const isImage = url => url && /\.(jpeg|jpg|png|gif|webp)$/i.test(url);
      const isPdf = url => url && /\.pdf$/i.test(url);

      return (
        <div className="space-y-4 max-w-3xl">
          <h2 className="text-2xl font-bold">Staff Chat</h2>
          <div className="card p-4 chat-box space-y-3">
            {data.slice().reverse().map(m => {
              const canEdit = user.role === 'ADMIN' || m.sender_name === user.name;
              return (
                <div key={m.id} className={`flex ${m.sender_name === user.name ? 'justify-end' : 'justify-start'}`}>
                  <div className={`max-w-[80%] rounded-2xl px-4 py-2 ${m.sender_name === user.name ? 'bg-red-500/20' : 'bg-[#252528]'}`}>
                    <div className="flex justify-between gap-3 mb-1">
                      <span className="text-xs text-red-400 font-medium">{m.sender_name} · {m.sender_role}</span>
                      <div className="flex gap-2">
                        {canEdit && <button onClick={() => { setEditId(m.id); setMessage(m.message || ''); }} className="text-blue-400 text-xs">Edit</button>}
                        {user.role === 'ADMIN' && <button onClick={() => confirm('Delete?') && remove(m.id)} className="text-red-400 text-xs">Delete</button>}
                      </div>
                    </div>
                    {m.message && <p className="text-sm">{linkify(m.message)}</p>}
                    {m.file_url && isImage(m.file_url) && (
                      <img src={m.file_url} className="mt-2 rounded-xl max-h-64 object-cover cursor-pointer" onClick={() => window.open(m.file_url)} />
                    )}
                    {m.file_url && isPdf(m.file_url) && (
                      <a href={m.file_url} target="_blank" className="mt-2 flex items-center gap-3 bg-[#1c1c1e] p-3 rounded-xl border border-[#3a3a3c]">
                        <span className="text-2xl">📄</span>
                        <div>
                          <p className="text-sm font-medium">PDF Document</p>
                          <p className="text-xs text-gray-400">Tap to open</p>
                        </div>
                      </a>
                    )}
                    {m.file_url && !isImage(m.file_url) && !isPdf(m.file_url) && (
                      <a href={m.file_url} target="_blank" className="text-blue-400 text-sm flex items-center gap-1 mt-2"><IconFile /> Attachment</a>
                    )}
                  </div>
                </div>
              );
            })}
            <div ref={bottomRef}></div>
          </div>

          <div className="card p-3 space-y-2">
            {editId && <p className="text-xs text-yellow-400">Editing message...</p>}
            <div className="flex gap-2">
              <input value={message} onChange={e => setMessage(e.target.value)} onKeyDown={e => e.key === 'Enter' && send()} placeholder="Type a message..." className="flex-1 p-3 bg-[#2c2c2e] rounded-xl" />
              <button onClick={send} className="bg-gradient-to-r from-red-500 to-pink-500 px-5 rounded-xl font-semibold">{editId ? 'Update' : 'Send'}</button>
            </div>
            <input type="file" accept=".pdf,.jpg,.jpeg,.png" onChange={e => setFile(e.target.files[0])} className="text-sm text-gray-400" />
          </div>
        </div>
      );
    }

    // ==================== RESULTS ====================
    function ResultsTab({ user }) {
      const { data, add, update, remove } = useCollection('exam_results');
      const [show, setShow] = useState(false);
      const [editId, setEditId] = useState(null);
      const [title, setTitle] = useState('');
      const [desc, setDesc] = useState('');
      const [file, setFile] = useState(null);
      const isAdmin = user.role === 'ADMIN';

      const save = async () => {
        if (!title) return alert('Title required');
        let file_url = null;
        if (file) {
          file_url = await uploadFile(file);
          if (!file_url) return;
        }
        if (editId) {
          const ch = { title, description: desc };
          if (file_url) ch.file_url = file_url;
          update(editId, ch);
        } else {
          add({ title, description: desc, file_url, uploaded_by: user.name });
        }
        setShow(false); setEditId(null); setTitle(''); setDesc(''); setFile(null);
      };

      return (
        <div className="space-y-5 max-w-3xl">
          <div className="flex justify-between items-center">
            <h2 className="text-2xl font-bold">Exam Results</h2>
            {isAdmin && (
              <button onClick={() => { setShow(!show); setEditId(null); setTitle(''); setDesc(''); }} className="bg-red-500/15 text-red-400 px-4 py-2 rounded-full text-sm font-semibold flex items-center gap-2"><IconPlus /> Upload</button>
            )}
          </div>

          {show && isAdmin && (
            <div className="card p-5 space-y-3">
              <input value={title} onChange={e => setTitle(e.target.value)} placeholder="Title" className="w-full p-3 bg-[#2c2c2e] rounded-xl" />
              <textarea value={desc} onChange={e => setDesc(e.target.value)} placeholder="Description (optional)" className="w-full p-3 bg-[#2c2c2e] rounded-xl min-h-[80px]" />
              <input type="file" accept=".pdf,.jpg,.jpeg,.png" onChange={e => setFile(e.target.files[0])} className="text-sm text-gray-400" />
              <div className="flex gap-3">
                <button onClick={save} className="flex-1 bg-gradient-to-r from-red-500 to-pink-500 py-3 rounded-xl font-bold">{editId ? 'Update' : 'Upload'}</button>
                <button onClick={() => setShow(false)} className="px-5 bg-[#2c2c2e] rounded-xl">Cancel</button>
              </div>
            </div>
          )}

          {data.map(r => {
            const canEdit = isAdmin || r.uploaded_by === user.name;
            return (
              <div key={r.id} className="card p-5 border-l-4 border-blue-500">
                <div className="flex justify-between">
                  <div>
                    <h3 className="font-bold text-lg">{r.title}</h3>
                    <p className="text-xs text-gray-400">By {r.uploaded_by}</p>
                  </div>
                  {canEdit && (
                    <div className="flex gap-2">
                      <button onClick={() => { setEditId(r.id); setTitle(r.title); setDesc(r.description || ''); setShow(true); }} className="text-blue-400"><IconEdit /></button>
                      {isAdmin && <button onClick={() => confirm('Delete?') && remove(r.id)} className="text-red-400"><IconTrash /></button>}
                    </div>
                  )}
                </div>
                {r.description && <p className="text-sm mt-2">{linkify(r.description)}</p>}
                {r.file_url && <a href={r.file_url} target="_blank" className="text-blue-400 text-sm flex items-center gap-1 mt-2"><IconFile /> View File</a>}
              </div>
            );
          })}
        </div>
      );
    }

    // ==================== PROFILE ====================
    function Profile({ user, setUser, setTab, onFullLogout }) {
      const [showEdit, setShowEdit] = useState(false);
      const [newId, setNewId] = useState(user.id);
      const [newPass, setNewPass] = useState('');
      const [confirmPass, setConfirmPass] = useState('');

      const save = async () => {
        if (!newId.trim()) return alert('Login ID required');
        const updates = {};
        if (newId.trim() !== user.id) updates.username = newId.trim();
        if (newPass) {
          if (newPass.length < 4) return alert('Password min 4 characters');
          if (newPass !== confirmPass) return alert('Passwords do not match');
          updates.password = newPass.trim();
        }
        if (Object.keys(updates).length === 0) { setShowEdit(false); return; }

        const { error } = await supabase.from('users').update(updates).eq('username', user.id);
        if (error) {
          if (error.message.includes('duplicate') || error.message.includes('unique')) alert('Login ID already taken');
          else alert(error.message);
        } else {
          alert('Updated successfully');
          setUser({ ...user, id: updates.username || user.id });
          setShowEdit(false); setNewPass(''); setConfirmPass('');
        }
      };

      return (
        <div className="space-y-5 max-w-lg">
          <h2 className="text-2xl font-bold">My Profile</h2>
          <div className="card p-6 space-y-5">
            <div><p className="text-xs text-gray-400">Full Name</p><p className="font-medium text-lg">{user.name}</p></div>
            <div><p className="text-xs text-gray-400">Role</p><p className="font-medium">{user.role}</p></div>
            <div><p className="text-xs text-gray-400">Login ID</p><p className="font-medium text-red-400 text-lg">{user.id}</p></div>

            <div className="pt-4 border-t border-[#2c2c2e] space-y-3">
              {!showEdit ? (
                <button onClick={() => setShowEdit(true)} className="w-full bg-[#2c2c2e] py-3 rounded-xl text-sm">Change Login ID / Password</button>
              ) : (
                <div className="space-y-3">
                  <input value={newId} onChange={e => setNewId(e.target.value)} placeholder="New Login ID" className="w-full p-3 bg-[#2c2c2e] rounded-xl" />
                  <input type="password" value={newPass} onChange={e => setNewPass(e.target.value)} placeholder="New Password (optional)" className="w-full p-3 bg-[#2c2c2e] rounded-xl" />
                  {newPass && <input type="password" value={confirmPass} onChange={e => setConfirmPass(e.target.value)} placeholder="Confirm Password" className="w-full p-3 bg-[#2c2c2e] rounded-xl" />}
                  <div className="flex gap-3">
                    <button onClick={save} className="flex-1 bg-gradient-to-r from-red-500 to-pink-500 py-3 rounded-xl font-semibold">Save</button>
                    <button onClick={() => setShowEdit(false)} className="px-5 bg-[#2c2c2e] rounded-xl">Cancel</button>
                  </div>
                </div>
              )}

              {user.role === 'ADMIN' && (
                <button onClick={() => setTab('users')} className="w-full bg-red-500/15 text-red-400 py-3 rounded-xl text-sm flex items-center justify-center gap-2">
                  <IconUsers /> Manage Users
                </button>
              )}

              <button onClick={onFullLogout} className="w-full bg-red-500/10 text-red-400 py-3 rounded-xl text-sm">
                Logout Completely (Clear PIN)
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ==================== USERS ====================
    function Users() {
      const { data, add, remove } = useCollection('users');
      const [show, setShow] = useState(false);
      const [form, setForm] = useState({ username: '', password: '', full_name: '', role: 'TEACHER' });

      return (
        <div className="space-y-5 max-w-3xl">
          <div className="flex justify-between items-center">
            <h2 className="text-2xl font-bold">Manage Users</h2>
            <button onClick={() => setShow(!show)} className="bg-red-500/15 text-red-400 px-4 py-2 rounded-full text-sm font-semibold flex items-center gap-2"><IconPlus /> Create</button>
          </div>

          {show && (
            <div className="card p-5 space-y-3">
              <input placeholder="Full Name" className="w-full p-3 bg-[#2c2c2e] rounded-xl" value={form.full_name} onChange={e => setForm({...form, full_name: e.target.value})} />
              <input placeholder="Login ID" className="w-full p-3 bg-[#2c2c2e] rounded-xl" value={form.username} onChange={e => setForm({...form, username: e.target.value})} />
              <input placeholder="Temporary Password" className="w-full p-3 bg-[#2c2c2e] rounded-xl" value={form.password} onChange={e => setForm({...form, password: e.target.value})} />
              <select className="w-full p-3 bg-[#2c2c2e] rounded-xl" value={form.role} onChange={e => setForm({...form, role: e.target.value})}>
                <option value="TEACHER">Teacher</option>
                <option value="DOCTOR">Doctor</option>
                <option value="MAINTENANCE">Maintenance</option>
                <option value="ADMIN">Admin</option>
              </select>
              <button onClick={() => {
                if (form.username && form.password && form.full_name) {
                  add(form);
                  setShow(false);
                  setForm({ username: '', password: '', full_name: '', role: 'TEACHER' });
                  alert('Login ID created!');
                } else alert('Fill all fields');
              }} className="w-full bg-gradient-to-r from-red-500 to-pink-500 py-3 rounded-xl font-bold">Create Login ID</button>
            </div>
          )}

          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
            {data.map(u => (
              <div key={u.id} className="card p-4 flex justify-between items-center">
                <div>
                  <p className="font-medium">{u.full_name}</p>
                  <p className="text-xs text-gray-400">{u.role}</p>
                </div>
                <button onClick={() => confirm(`Delete ${u.full_name}?`) && remove(u.id)} className="text-red-400 p-2"><IconTrash /></button>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // Start the app
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
