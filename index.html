<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bes An Noor Model School (Boys' Unit)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { background: #0b0b0e; margin: 0; font-family: system-ui, sans-serif; color: white; }
    .card { background: #1c1c1e; border-radius: 16px; padding: 16px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const SUPABASE_URL = 'https://peiybuhnozgqatdyrdhf.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBlaXlidWhub3pncWF0ZHlyZGhmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5NzIyNDEsImV4cCI6MjEwMjU0ODI0MX0.a_1otAvBMRa20HSA01jcvtCbxwUpXNbmCzVmA9Qm-DE';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function App() {
      const [user, setUser] = useState(null);
      const [tab, setTab] = useState('home');
      const [showRegister, setShowRegister] = useState(false);

      const login = async (username, password) => {
        const { data, error } = await supabase
          .from('users')
          .select('*')
          .eq('username', username.trim())
          .eq('password', password.trim())
          .maybeSingle();

        if (error) {
          alert('Error: ' + error.message);
          return;
        }
        if (!data) {
          alert('Invalid Login ID or Password');
          return;
        }
        setUser({
          id: data.username,
          name: data.full_name,
          role: data.role
        });
      };

      if (!user) {
        if (showRegister) {
          return <RegisterScreen onBack={() => setShowRegister(false)} onSuccess={() => setShowRegister(false)} />;
        }
        return <LoginScreen onLogin={login} onRegister={() => setShowRegister(true)} />;
      }

      return (
        <div className="min-h-screen max-w-lg mx-auto flex flex-col">
          {/* Header */}
          <div className="p-4 border-b border-gray-800 flex justify-between items-center sticky top-0 bg-[#0b0b0e] z-10">
            <div>
              <h1 className="text-lg font-bold">Bes An Noor Model School</h1>
              <p className="text-xs text-gray-400">(Boys' Unit)</p>
            </div>
            <button 
              onClick={() => { setUser(null); setTab('home'); }}
              className="text-sm text-gray-400 px-3 py-1 rounded bg-gray-800"
            >
              Logout
            </button>
          </div>

          {/* Content */}
          <div className="flex-1 p-4 pb-24 overflow-y-auto">
            {tab === 'home' && <HomeTab user={user} />}
            {tab === 'notices' && <NoticesTab user={user} />}
            {tab === 'proxy' && <ProxyTab user={user} />}
            {tab === 'report' && <ReportTab user={user} />}
            {tab === 'profile' && <ProfileTab user={user} />}
          </div>

          {/* Bottom Navigation */}
          <div className="fixed bottom-0 left-0 right-0 max-w-lg mx-auto bg-[#141416] border-t border-gray-800 flex justify-around py-3">
            <button onClick={() => setTab('home')} className={`text-xs ${tab==='home' ? 'text-red-500' : 'text-gray-400'}`}>Home</button>
            <button onClick={() => setTab('notices')} className={`text-xs ${tab==='notices' ? 'text-red-500' : 'text-gray-400'}`}>Notices</button>
            <button onClick={() => setTab('proxy')} className={`text-xs ${tab==='proxy' ? 'text-red-500' : 'text-gray-400'}`}>Proxy</button>
            <button onClick={() => setTab('report')} className={`text-xs ${tab==='report' ? 'text-red-500' : 'text-gray-400'}`}>Report</button>
            <button onClick={() => setTab('profile')} className={`text-xs ${tab==='profile' ? 'text-red-500' : 'text-gray-400'}`}>Profile</button>
          </div>
        </div>
      );
    }

    function LoginScreen({ onLogin, onRegister }) {
      const [id, setId] = useState('');
      const [pass, setPass] = useState('');
      return (
        <div className="min-h-screen flex items-center justify-center p-4">
          <div className="w-full max-w-sm">
            <div className="text-center mb-8">
              <div className="w-16 h-16 mx-auto rounded-2xl bg-gradient-to-br from-red-500 to-pink-500 flex items-center justify-center text-2xl mb-4">👤</div>
              <h1 className="text-2xl font-bold">Bes An Noor Model School</h1>
              <p className="text-gray-400 text-sm">(Boys' Unit)</p>
            </div>
            <div className="card space-y-4">
              <input 
                value={id} 
                onChange={e => setId(e.target.value)} 
                placeholder="Login ID" 
                className="w-full p-3 bg-[#2c2c2e] rounded-xl text-white border border-gray-700"
              />
              <input 
                type="password"
                value={pass} 
                onChange={e => setPass(e.target.value)} 
                placeholder="Password" 
                className="w-full p-3 bg-[#2c2c2e] rounded-xl text-white border border-gray-700"
              />
              <button 
                onClick={() => onLogin(id, pass)}
                className="w-full bg-gradient-to-r from-red-500 to-pink-500 text-white font-bold py-3 rounded-xl"
              >
                Continue
              </button>
            </div>
            <button onClick={onRegister} className="w-full text-center text-red-400 text-sm mt-6">
              Create Teacher / Staff Account
            </button>
          </div>
        </div>
      );
    }

    function RegisterScreen({ onBack, onSuccess }) {
      const [form, setForm] = useState({ username: '', password: '', full_name: '', role: 'TEACHER' });
      
      const submit = async () => {
        if (!form.username || !form.password || !form.full_name) {
          alert('Please fill all fields');
          return;
        }
        const { error } = await supabase.from('users').insert([{
          username: form.username.trim(),
          password: form.password.trim(),
          full_name: form.full_name.trim(),
          role: form.role
        }]);
        if (error) {
          alert(error.message);
        } else {
          alert('Account created successfully!\n\nLogin ID: ' + form.username + '\nPassword: ' + form.password);
          onSuccess();
        }
      };

      return (
        <div className="min-h-screen flex items-center justify-center p-4">
          <div className="w-full max-w-sm card space-y-3">
            <h2 className="text-xl font-bold mb-2">Create Account</h2>
            <input placeholder="Full Name" className="w-full p-3 bg-[#2c2c2e] rounded-xl text-white" value={form.full_name} onChange={e => setForm({...form, full_name: e.target.value})} />
            <input placeholder="Login ID" className="w-full p-3 bg-[#2c2c2e] rounded-xl text-white" value={form.username} onChange={e => setForm({...form, username: e.target.value})} />
            <input type="password" placeholder="Password" className="w-full p-3 bg-[#2c2c2e] rounded-xl text-white" value={form.password} onChange={e => setForm({...form, password: e.target.value})} />
            <select className="w-full p-3 bg-[#2c2c2e] rounded-xl text-white" value={form.role} onChange={e => setForm({...form, role: e.target.value})}>
              <option value="TEACHER">Teacher</option>
              <option value="ADMIN">Admin</option>
              <option value="DOCTOR">Doctor</option>
              <option value="MAINTENANCE">Maintenance</option>
            </select>
            <button onClick={submit} className="w-full bg-gradient-to-r from-red-500 to-pink-500 text-white font-bold py-3 rounded-xl">Create Account</button>
            <button onClick={onBack} className="w-full text-gray-400 text-sm">Back to Login</button>
          </div>
        </div>
      );
    }

    function HomeTab({ user }) {
      const [attendance, setAttendance] = useState([]);
      const today = new Date().toISOString().split('T')[0];

      useEffect(() => {
        supabase.from('attendance').select('*').eq('date', today).then(({ data }) => {
          setAttendance(data || []);
        });
      }, []);

      const mine = attendance.find(a => a.teacher_id === user.id);

      const markAttendance = async (status) => {
        await supabase.from('attendance').insert([{
          date: today,
          teacher_id: user.id,
          name: user.name,
          status: status
        }]);
        const { data } = await supabase.from('attendance').select('*').eq('date', today);
        setAttendance(data || []);
      };

      return (
        <div className="space-y-4">
          <div className="card">
            <h2 className="font-bold text-lg">Welcome, {user.name}</h2>
            <p className="text-sm text-gray-400">{user.role}</p>
          </div>

          <div className="card">
            <h3 className="font-bold mb-2">Daily Attendance</h3>
            <p className="text-sm text-gray-400 mb-4">{new Date().toDateString()}</p>
            
            {mine ? (
              <div className={`inline-block px-4 py-2 rounded-full text-sm ${mine.status === 'PRESENT' ? 'bg-green-500/20 text-green-400' : 'bg-orange-500/20 text-orange-400'}`}>
                {mine.status}
              </div>
            ) : (
              <div className="flex gap-3">
                <button onClick={() => markAttendance('PRESENT')} className="bg-gradient-to-r from-red-500 to-pink-500 text-white px-5 py-2 rounded-full text-sm font-semibold">
                  Present
                </button>
                <button onClick={() => markAttendance('ABSENT')} className="bg-gray-700 text-orange-400 px-5 py-2 rounded-full text-sm font-semibold">
                  Absent
                </button>
              </div>
            )}
          </div>
        </div>
      );
    }

    function NoticesTab({ user }) {
      const [notices, setNotices] = useState([]);
      const [showForm, setShowForm] = useState(false);
      const [title, setTitle] = useState('');
      const [content, setContent] = useState('');

      useEffect(() => {
        supabase.from('notices').select('*').order('created_at', { ascending: false }).then(({ data }) => {
          setNotices(data || []);
        });
      }, []);

      const publish = async () => {
        if (!title || !content) return;
        await supabase.from('notices').insert([{ title, content, author: user.name, type: 'text' }]);
        const { data } = await supabase.from('notices').select('*').order('created_at', { ascending: false });
        setNotices(data || []);
        setShowForm(false);
        setTitle('');
        setContent('');
      };

      return (
        <div className="space-y-4">
          <div className="flex justify-between items-center">
            <h2 className="text-xl font-bold">Notices</h2>
            {user.role === 'ADMIN' && (
              <button onClick={() => setShowForm(!showForm)} className="text-red-400 text-sm">+ Add</button>
            )}
          </div>

          {showForm && (
            <div className="card space-y-3">
              <input value={title} onChange={e => setTitle(e.target.value)} placeholder="Title" className="w-full p-3 bg-[#2c2c2e] rounded-xl text-white" />
              <textarea value={content} onChange={e => setContent(e.target.value)} placeholder="Content" className="w-full p-3 bg-[#2c2c2e] rounded-xl text-white min-h-[80px]" />
              <button onClick={publish} className="w-full bg-gradient-to-r from-red-500 to-pink-500 text-white font-bold py-2 rounded-xl">Publish</button>
            </div>
          )}

          {notices.length === 0 && <p className="text-center text-gray-400 py-8">No notices yet</p>}
          {notices.map(n => (
            <div key={n.id} className="card border-l-4 border-red-500">
              <h3 className="font-bold">{n.title}</h3>
              <p className="text-xs text-gray-400 mb-2">By {n.author}</p>
              <p className="text-sm">{n.content}</p>
            </div>
          ))}
        </div>
      );
    }

    function ProxyTab({ user }) {
      const [proxies, setProxies] = useState([]);
      const [showForm, setShowForm] = useState(false);
      const [form, setForm] = useState({ date: '', absent_teacher: '', proxy_teacher: '', class_room: '', subject: '' });

      useEffect(() => {
        supabase.from('proxies').select('*').order('created_at', { ascending: false }).then(({ data }) => {
          setProxies(data || []);
        });
      }, []);

      const assign = async () => {
        if (!form.date || !form.proxy_teacher) return;
        await supabase.from('proxies').insert([form]);
        const { data } = await supabase.from('proxies').select('*').order('created_at', { ascending: false });
        setProxies(data || []);
        setShowForm(false);
        setForm({ date: '', absent_teacher: '', proxy_teacher: '', class_room: '', subject: '' });
      };

      return (
        <div className="space-y-4">
          <div className="flex justify-between items-center">
            <h2 className="text-xl font-bold">Proxy Schedule</h2>
            {user.role === 'ADMIN' && (
              <button onClick={() => setShowForm(!showForm)} className="text-red-400 text-sm">+ Add</button>
            )}
          </div>

          {showForm && user.role === 'ADMIN' && (
            <div className="card space-y-3">
              <input type="date" className="w-full p-3 bg-[#2c2c2e] rounded-xl text-white" value={form.date} onChange={e => setForm({...form, date: e.target.value})} />
              <input placeholder="Absent Teacher" className="w-full p-3 bg-[#2c2c2e] rounded-xl text-white" value={form.absent_teacher} onChange={e => setForm({...form, absent_teacher: e.target.value})} />
              <input placeholder="Proxy Teacher" className="w-full p-3 bg-[#2c2c2e] rounded-xl text-white" value={form.proxy_teacher} onChange={e => setForm({...form, proxy_teacher: e.target.value})} />
              <div className="grid grid-cols-2 gap-2">
                <input placeholder="Class" className="w-full p-3 bg-[#2c2c2e] rounded-xl text-white" value={form.class_room} onChange={e => setForm({...form, class_room: e.target.value})} />
                <input placeholder="Subject" className="w-full p-3 bg-[#2c2c2e] rounded-xl text-white" value={form.subject} onChange={e => setForm({...form, subject: e.target.value})} />
              </div>
              <button onClick={assign} className="w-full bg-gradient-to-r from-red-500 to-pink-500 text-white font-bold py-2 rounded-xl">Assign</button>
            </div>
          )}

          {proxies.length === 0 && <p className="text-center text-gray-400 py-8">No proxy classes</p>}
          {proxies.map(p => (
            <div key={p.id} className="card border-l-4 border-red-500">
              <div className="flex justify-between text-xs mb-2">
                <span className="bg-red-500/20 text-red-400 px-2 py-1 rounded">{p.date}</span>
                <span className="bg-gray-700 px-2 py-1 rounded">{p.class_room}</span>
              </div>
              <p className="text-sm"><b>Substitute:</b> {p.proxy_teacher}</p>
              <p className="text-sm text-gray-400 line-through">Replacing: {p.absent_teacher}</p>
              <p className="text-sm mt-1">Subject: {p.subject}</p>
            </div>
          ))}
        </div>
      );
    }

    function ReportTab({ user }) {
      return (
        <div className="space-y-4">
          <h2 className="text-xl font-bold">Report Issues</h2>
          <div className="card">
            <p className="text-gray-400 text-sm">Medical and Facility reporting section will be available here.</p>
            <p className="text-xs text-gray-500 mt-2">Currently under improvement for stability.</p>
          </div>
        </div>
      );
    }

    function ProfileTab({ user }) {
      return (
        <div className="space-y-4">
          <h2 className="text-xl font-bold">My Profile</h2>
          <div className="card space-y-4">
            <div>
              <p className="text-xs text-gray-400">Full Name</p>
              <p className="font-medium">{user.name}</p>
            </div>
            <div>
              <p className="text-xs text-gray-400">Role</p>
              <p className="font-medium">{user.role}</p>
            </div>
            <div>
              <p className="text-xs text-gray-400">Login ID</p>
              <p className="font-medium text-red-400">{user.id}</p>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
