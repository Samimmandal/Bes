<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bes An Noor · School Portal</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0b0b0e;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #ffffff;
      min-height: 100vh;
    }
    .card {
      background: #1c1c1e;
      border-radius: 16px;
      padding: 16px;
    }
    .header {
      background: rgba(11, 11, 14, 0.95);
      border-bottom: 1px solid #2c2c2e;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(20, 20, 23, 0.95);
      border-top: 1px solid #2c2c2e;
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      z-index: 50;
      max-width: 500px;
      margin: 0 auto;
    }
    .nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      background: none;
      border: none;
      color: #8e8e93;
      font-size: 10px;
      cursor: pointer;
    }
    .nav-btn.active {
      color: #ff2d55;
    }
    .btn-primary {
      background: linear-gradient(to right, #ff2d55, #ff3b30);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 12px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }
    input, select, textarea {
      width: 100%;
      padding: 12px;
      background: #2c2c2e;
      border: 1px solid #3a3a3c;
      border-radius: 12px;
      color: white;
      margin-bottom: 12px;
    }
    .container {
      max-width: 500px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;

    // Your correct keys
    const SUPABASE_URL = 'https://peiybuhnozgqatdyrdhf.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBlaXlidWhub3pncWF0ZHlyZGhmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5NzIyNDEsImV4cCI6MjEwMjU0ODI0MX0.a_1otAvBMRa20HSA01jcvtCbxwUpXNbmCzVmA9Qm-DE';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function useCollection(table) {
      const [data, setData] = useState([]);
      const load = useCallback(async () => {
        const { data: rows } = await supabase.from(table).select('*').order('created_at', { ascending: false });
        setData(rows || []);
      }, [table]);

      useEffect(() => {
        load();
        const channel = supabase.channel(table)
          .on('postgres_changes', { event: '*', schema: 'public', table }, load)
          .subscribe();
        return () => supabase.removeChannel(channel);
      }, [table, load]);

      const add = async (row) => {
        const { error } = await supabase.from(table).insert([row]);
        if (error) alert(error.message);
        else load();
      };

      return { data, add };
    }

    function App() {
      const [user, setUser] = useState(null);
      const [tab, setTab] = useState('home');
      const [showReg, setShowReg] = useState(false);

      const login = async (username, password) => {
        const { data, error } = await supabase
          .from('users')
          .select('*')
          .eq('username', username.trim())
          .eq('password', password)
          .maybeSingle();

        if (error) return alert('Error: ' + error.message);
        if (!data) return alert('Invalid username or password');
        
        setUser({
          id: data.username,
          name: data.full_name,
          role: data.role
        });
      };

      if (!user) {
        return showReg ? 
          <Register onBack={() => setShowReg(false)} onSuccess={() => setShowReg(false)} /> :
          <Login onLogin={login} onRegister={() => setShowReg(true)} />;
      }

      return (
        <div className="container">
          {/* Header */}
          <div className="header" style={{padding: '16px', display: 'flex', justifyContent: 'space-between', alignItems: 'center'}}>
            <div>
              <h1 style={{fontSize: '20px', fontWeight: 'bold'}}>Bes An Noor</h1>
              <p style={{fontSize: '12px', color: '#8e8e93'}}>School Portal</p>
            </div>
            <button onClick={() => { setUser(null); setTab('home'); }} style={{background: '#2c2c2e', border: 'none', borderRadius: '50%', width: '36px', height: '36px', color: '#8e8e93', cursor: 'pointer'}}>
              ⎋
            </button>
          </div>

          {/* Content */}
          <div style={{flex: 1, padding: '16px', paddingBottom: '90px', overflowY: 'auto'}}>
            {tab === 'home' && <Home user={user} setTab={setTab} />}
            {tab === 'notices' && <Notices user={user} />}
            {tab === 'proxy' && <Proxy user={user} />}
            {tab === 'users' && user.role === 'ADMIN' && <Users />}
          </div>

          {/* Bottom Navigation */}
          <div className="bottom-nav">
            <button className={`nav-btn ${tab === 'home' ? 'active' : ''}`} onClick={() => setTab('home')}>
              <span>🏠</span>
              <span>Home</span>
            </button>
            <button className={`nav-btn ${tab === 'notices' ? 'active' : ''}`} onClick={() => setTab('notices')}>
              <span>📋</span>
              <span>Notices</span>
            </button>
            <button className={`nav-btn ${tab === 'proxy' ? 'active' : ''}`} onClick={() => setTab('proxy')}>
              <span>📅</span>
              <span>Proxy</span>
            </button>
            {user.role === 'ADMIN' && (
              <button className={`nav-btn ${tab === 'users' ? 'active' : ''}`} onClick={() => setTab('users')}>
                <span>👥</span>
                <span>Users</span>
              </button>
            )}
          </div>
        </div>
      );
    }

    function Login({ onLogin, onRegister }) {
      const [id, setId] = useState('');
      const [pass, setPass] = useState('');
      return (
        <div style={{minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '16px'}}>
          <div style={{width: '100%', maxWidth: '360px'}}>
            <div style={{textAlign: 'center', marginBottom: '32px'}}>
              <div style={{width: '70px', height: '70px', margin: '0 auto 16px', borderRadius: '20px', background: 'linear-gradient(to bottom right, #ff2d55, #ff3b30)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '28px'}}>
                👤
              </div>
              <h1 style={{fontSize: '28px', fontWeight: 'bold'}}>Bes An Noor</h1>
              <p style={{color: '#8e8e93', marginTop: '4px'}}>School Portal</p>
            </div>
            <div className="card">
              <input value={id} onChange={e => setId(e.target.value)} placeholder="Login ID" />
              <input type="password" value={pass} onChange={e => setPass(e.target.value)} placeholder="Password" />
              <button className="btn-primary" onClick={() => onLogin(id, pass)}>Continue</button>
            </div>
            <button onClick={onRegister} style={{width: '100%', background: 'none', border: 'none', color: '#ff2d55', marginTop: '20px', cursor: 'pointer'}}>
              Create Teacher / Staff Account
            </button>
            <div className="card" style={{marginTop: '20px', textAlign: 'center', fontSize: '13px', color: '#8e8e93'}}>
              Default Admin → <b>admin</b> / <b>123</b>
            </div>
          </div>
        </div>
      );
    }

    function Register({ onBack, onSuccess }) {
      const [form, setForm] = useState({ username: '', password: '', full_name: '', role: 'TEACHER' });
      const submit = async () => {
        if (!form.username || !form.password || !form.full_name) return alert('Fill all fields');
        const { error } = await supabase.from('users').insert([{
          username: form.username.trim(),
          password: form.password,
          full_name: form.full_name,
          role: form.role
        }]);
        if (error) alert(error.message.includes('duplicate') ? 'Username already exists' : error.message);
        else {
          alert('Account created! Please login.');
          onSuccess();
        }
      };
      return (
        <div style={{minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '16px'}}>
          <div className="card" style={{width: '100%', maxWidth: '360px'}}>
            <h2 style={{fontSize: '20px', fontWeight: 'bold', marginBottom: '20px'}}>Create Account</h2>
            <input placeholder="Full Name" value={form.full_name} onChange={e => setForm({...form, full_name: e.target.value})} />
            <input placeholder="Login ID" value={form.username} onChange={e => setForm({...form, username: e.target.value})} />
            <input type="password" placeholder="Password" value={form.password} onChange={e => setForm({...form, password: e.target.value})} />
            <select value={form.role} onChange={e => setForm({...form, role: e.target.value})}>
              <option value="TEACHER">Teacher</option>
              <option value="ADMIN">Admin</option>
              <option value="DOCTOR">Doctor</option>
              <option value="MAINTENANCE">Maintenance</option>
            </select>
            <button className="btn-primary" onClick={submit}>Create Account</button>
            <button onClick={onBack} style={{width: '100%', background: 'none', border: 'none', color: '#8e8e93', marginTop: '12px', cursor: 'pointer'}}>Back to Login</button>
          </div>
        </div>
      );
    }

    function Home({ user, setTab }) {
      const { data: attendance, add } = useCollection('attendance');
      const today = new Date().toISOString().split('T')[0];
      const mine = attendance.find(a => a.date === today && a.teacher_id === user.id);

      return (
        <div style={{display: 'flex', flexDirection: 'column', gap: '16px'}}>
          <div className="card" style={{display: 'flex', alignItems: 'center', gap: '12px'}}>
            <div style={{width: '48px', height: '48px', borderRadius: '50%', background: 'linear-gradient(to bottom right, #ff2d55, #ff3b30)', display: 'flex', alignItems: 'center', justifyContent: 'center'}}>👤</div>
            <div>
              <div style={{fontWeight: 'bold', fontSize: '17px'}}>Welcome, {user.name}</div>
              <div style={{fontSize: '13px', color: '#8e8e93'}}>{user.role}</div>
            </div>
          </div>

          {user.role === 'ADMIN' && (
            <div className="card">
              <div style={{fontWeight: '600', marginBottom: '12px'}}>Today's Attendance</div>
              {attendance.filter(a => a.date === today).length === 0 ? (
                <div style={{color: '#8e8e93', fontSize: '14px'}}>No one marked yet</div>
              ) : (
                attendance.filter(a => a.date === today).map(a => (
                  <div key={a.id} style={{display: 'flex', justifyContent: 'space-between', padding: '8px 0', borderBottom: '1px solid #2c2c2e', fontSize: '14px'}}>
                    <span>{a.name}</span>
                    <span style={{color: '#30d158'}}>{a.status}</span>
                  </div>
                ))
              )}
            </div>
          )}

          {(user.role === 'TEACHER' || user.role === 'ADMIN') && (
            <div className="card" style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center'}}>
              <div>
                <div style={{fontWeight: 'bold'}}>Daily Attendance</div>
                <div style={{fontSize: '13px', color: '#8e8e93'}}>{new Date().toDateString()}</div>
              </div>
              {mine ? (
                <span style={{background: 'rgba(48,209,88,0.15)', color: '#30d158', padding: '6px 12px', borderRadius: '20px', fontSize: '13px'}}>✓ Present</span>
              ) : (
                <button className="btn-primary" style={{width: 'auto', padding: '8px 16px', fontSize: '13px'}} onClick={() => add({ date: today, teacher_id: user.id, name: user.name, status: 'PRESENT' })}>
                  Mark Present
                </button>
              )}
            </div>
          )}

          <div style={{display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px'}}>
            <button className="card" style={{textAlign: 'left', cursor: 'pointer', border: 'none', color: 'white'}} onClick={() => setTab('notices')}>
              <div style={{fontSize: '20px', marginBottom: '8px'}}>📋</div>
              <div style={{fontWeight: '600', fontSize: '14px'}}>Notices</div>
            </button>
            <button className="card" style={{textAlign: 'left', cursor: 'pointer', border: 'none', color: 'white'}} onClick={() => setTab('proxy')}>
              <div style={{fontSize: '20px', marginBottom: '8px'}}>📅</div>
              <div style={{fontWeight: '600', fontSize: '14px'}}>Proxy</div>
            </button>
          </div>
        </div>
      );
    }

    function Notices({ user }) {
      const { data, add } = useCollection('notices');
      const [show, setShow] = useState(false);
      const [title, setTitle] = useState('');
      const [content, setContent] = useState('');

      return (
        <div style={{display: 'flex', flexDirection: 'column', gap: '16px'}}>
          <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center'}}>
            <h2 style={{fontSize: '22px', fontWeight: 'bold'}}>Notices</h2>
            {user.role === 'ADMIN' && (
              <button onClick={() => setShow(!show)} style={{background: 'rgba(255,45,85,0.15)', color: '#ff2d55', border: 'none', borderRadius: '50%', width: '36px', height: '36px', fontSize: '20px', cursor: 'pointer'}}>+</button>
            )}
          </div>

          {show && (
            <div className="card">
              <input value={title} onChange={e => setTitle(e.target.value)} placeholder="Notice Title" />
              <textarea value={content} onChange={e => setContent(e.target.value)} placeholder="Write notice..." style={{minHeight: '80px'}} />
              <button className="btn-primary" onClick={() => {
                if (title && content) {
                  add({ title, content, type: 'text', author: user.name });
                  setShow(false);
                  setTitle('');
                  setContent('');
                }
              }}>Publish</button>
            </div>
          )}

          {data.length === 0 && <p style={{textAlign: 'center', color: '#8e8e93', padding: '40px 0'}}>No notices yet</p>}
          
          {data.map(n => (
            <div key={n.id} className="card" style={{borderLeft: '4px solid #ff2d55'}}>
              <div style={{fontWeight: 'bold', marginBottom: '4px'}}>{n.title}</div>
              <div style={{fontSize: '12px', color: '#8e8e93', marginBottom: '8px'}}>By {n.author}</div>
              <div style={{fontSize: '14px', whiteSpace: 'pre-wrap'}}>{n.content}</div>
            </div>
          ))}
        </div>
      );
    }

    function Proxy({ user }) {
      const { data, add } = useCollection('proxies');
      const [show, setShow] = useState(false);
      const [form, setForm] = useState({ date: '', absent_teacher: '', proxy_teacher: '', class_room: '', subject: '' });

      return (
        <div style={{display: 'flex', flexDirection: 'column', gap: '16px'}}>
          <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center'}}>
            <div>
              <h2 style={{fontSize: '22px', fontWeight: 'bold'}}>Proxy Schedule</h2>
              <p style={{fontSize: '13px', color: '#8e8e93'}}>Substitution roster</p>
            </div>
            {user.role === 'ADMIN' && (
              <button onClick={() => setShow(!show)} style={{background: 'rgba(255,45,85,0.15)', color: '#ff2d55', border: 'none', borderRadius: '20px', padding: '8px 14px', fontSize: '13px', fontWeight: '600', cursor: 'pointer'}}>+ Add</button>
            )}
          </div>

          {show && user.role === 'ADMIN' && (
            <div className="card">
              <input type="date" value={form.date} onChange={e => setForm({...form, date: e.target.value})} />
              <input placeholder="Absent Teacher" value={form.absent_teacher} onChange={e => setForm({...form, absent_teacher: e.target.value})} />
              <input placeholder="Proxy Teacher" value={form.proxy_teacher} onChange={e => setForm({...form, proxy_teacher: e.target.value})} />
              <div style={{display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px'}}>
                <input placeholder="Class" value={form.class_room} onChange={e => setForm({...form, class_room: e.target.value})} />
                <input placeholder="Subject" value={form.subject} onChange={e => setForm({...form, subject: e.target.value})} />
              </div>
              <button className="btn-primary" onClick={() => {
                if (form.date && form.proxy_teacher) {
                  add(form);
                  setShow(false);
                  setForm({ date: '', absent_teacher: '', proxy_teacher: '', class_room: '', subject: '' });
                }
              }}>Assign Proxy</button>
            </div>
          )}

          {data.length === 0 ? (
            <p style={{textAlign: 'center', color: '#8e8e93', padding: '40px 0'}}>No proxy classes</p>
          ) : (
            data.map(p => (
              <div key={p.id} className="card" style={{borderLeft: '4px solid #ff2d55'}}>
                <div style={{display: 'flex', justifyContent: 'space-between', marginBottom: '10px', fontSize: '12px'}}>
                  <span style={{background: 'rgba(255,45,85,0.2)', color: '#ff2d55', padding: '3px 8px', borderRadius: '10px'}}>{p.date}</span>
                  <span style={{background: '#2c2c2e', padding: '3px 8px', borderRadius: '10px'}}>{p.class_room}</span>
                </div>
                <div style={{display: 'flex', gap: '16px', marginBottom: '8px'}}>
                  <div style={{flex: 1}}>
                    <div style={{fontSize: '11px', color: '#8e8e93'}}>Substitute</div>
                    <div style={{fontWeight: '600'}}>{p.proxy_teacher}</div>
                  </div>
                  <div style={{flex: 1}}>
                    <div style={{fontSize: '11px', color: '#8e8e93'}}>Replacing</div>
                    <div style={{textDecoration: 'line-through', color: '#8e8e93'}}>{p.absent_teacher}</div>
                  </div>
                </div>
                <div style={{fontSize: '13px', borderTop: '1px solid #2c2c2e', paddingTop: '8px'}}>Subject: {p.subject}</div>
              </div>
            ))
          )}
        </div>
      );
    }

    function Users() {
      const { data, add } = useCollection('users');
      const [show, setShow] = useState(false);
      const [form, setForm] = useState({ username: '', password: '', full_name: '', role: 'TEACHER' });

      return (
        <div style={{display: 'flex', flexDirection: 'column', gap: '16px'}}>
          <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center'}}>
            <h2 style={{fontSize: '22px', fontWeight: 'bold'}}>Manage Users</h2>
            <button onClick={() => setShow(!show)} style={{background: 'rgba(255,45,85,0.15)', color: '#ff2d55', border: 'none', borderRadius: '20px', padding: '8px 14px', fontSize: '13px', fontWeight: '600', cursor: 'pointer'}}>+ Add</button>
          </div>

          {show && (
            <div className="card">
              <input placeholder="Full Name" value={form.full_name} onChange={e => setForm({...form, full_name: e.target.value})} />
              <input placeholder="Login ID" value={form.username} onChange={e => setForm({...form, username: e.target.value})} />
              <input placeholder="Password" value={form.password} onChange={e => setForm({...form, password: e.target.value})} />
              <select value={form.role} onChange={e => setForm({...form, role: e.target.value})}>
                <option value="TEACHER">Teacher</option>
                <option value="ADMIN">Admin</option>
                <option value="DOCTOR">Doctor</option>
                <option value="MAINTENANCE">Maintenance</option>
              </select>
              <button className="btn-primary" onClick={() => {
                if (form.username && form.password && form.full_name) {
                  add(form);
                  setShow(false);
                  setForm({ username: '', password: '', full_name: '', role: 'TEACHER' });
                }
              }}>Create User</button>
            </div>
          )}

          {data.map(u => (
            <div key={u.id} className="card">
              <div style={{fontWeight: '600'}}>{u.full_name}</div>
              <div style={{fontSize: '12px', color: '#8e8e93'}}>@{u.username} · {u.role}</div>
            </div>
          ))}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
