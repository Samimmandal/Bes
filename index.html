    body {
      background: #0b0b0e;
      font-family: -apple-system, 'Inter', system-ui, sans-serif;
      margin: 0;
      min-height: 100vh;
      color: #fff;

    #root {
      width: 100%;
      min-height: 100vh;
    }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0.75rem); }
    .animate-in { animation: fadeSlide 0.25s ease-out; }
    @keyframes fadeSlide {
      0% { opacity: 0; transform: translateY(8px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .overflow-y-auto::-webkit-scrollbar { width: 4px; }
    .overflow-y-auto::-webkit-scrollbar-thumb { background: #3a3a3f; border-radius: 12px; }

        margin: 0 auto;
        border-left: 1px solid #2c2c2e;
        border-right: 1px solid #2c2c2e;

    }

</head>

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Icons
    const IconHome = ({ size, className }) => <span className={`icon-svg ${className || ''}`}><svg viewBox="0 0 24 24" width={size || 20} height={size || 20}><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg></span>;
    const IconClipboard = ({ size, className }) => <span className={`icon-svg ${className || ''}`}><svg viewBox="0 0 24 24" width={size || 20} height={size || 20}><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" /><path d="M9 13l2 2 4-4" /></svg></span>;

    const IconStethoscope = ({ size, className }) => <span className={`icon-svg ${className || ''}`}><svg viewBox="0 0 24 24" width={size || 20} height={size || 20}><path d="M4.5 9.5a5 5 0 0110 0v3.5a5 5 0 01-10 0V9.5z" /><path d="M9.5 14.5v3a4 4 0 004 4h2a4 4 0 004-4v-3" /><circle cx="19.5" cy="9.5" r="1.5" /></svg></span>;
    const IconWrench = ({ size, className }) => <span className={`icon-svg ${className || ''}`}><svg viewBox="0 0 24 24" width={size || 20} height={size || 20}><path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z" /></svg></span>;
    const IconLogOut = ({ size, className }) => <span className={`icon-svg ${className || ''}`}><svg viewBox="0 0 24 24" width={size || 20} height={size || 20}><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4" /><polyline points="16 17 21 12 16 7" /><line x1="21" y1="12" x2="9" y2="12" /></svg></span>;
    const IconPlusCircle = ({ size, className }) => <span className={`icon-svg ${className || ''}`}><svg viewBox="0 0 24 24" width={size || 20} height={size || 20}><circle cx="12" cy="12" r="10" /><line x1="12" y1="8" x2="12" y2="16" /><line x1="8" y1="12" x2="16" y2="12" /></svg></span>;
    const IconCheckCircle = ({ size, className }) => <span className={`icon-svg ${className || ''}`}><svg viewBox="0 0 24 24" width={size || 20} height={size || 20}><path d="M22 11.08V12a10 10 0 11-5.93-9.14" /><polyline points="22 4 12 14.01 9 11.01" /></svg></span>;
    const IconAlertCircle = ({ size, className }) => <span className={`icon-svg ${className || ''}`}><svg viewBox="0 0 24 24" width={size || 20} height={size || 20}><circle cx="12" cy="12" r="10" /><line x1="12" y1="8" x2="12" y2="12" /><line x1="12" y1="16" x2="12.01" y2="16" /></svg></span>;
    const IconFileText = ({ size, className }) => <span className={`icon-svg ${className || ''}`}><svg viewBox="0 0 24 24" width={size || 20} height={size || 20}><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z" /><polyline points="14 2 14 8 20 8" /><line x1="16" y1="13" x2="8" y2="13" /><line x1="16" y1="17" x2="8" y2="17" /><polyline points="10 9 9 9 8 9" /></svg></span>;
    const IconBell = ({ size, className }) => <span className={`icon-svg ${className || ''}`}><svg viewBox="0 0 24 24" width={size || 20} height={size || 20}><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9" /><path d="M13.73 21a2 2 0 01-3.46 0" /></svg></span>;
    const IconUsers = ({ size, className }) => <span className={`icon-svg ${className || ''}`}><svg viewBox="0 0 24 24" width={size || 20} height={size || 20}><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2" /><circle cx="9" cy="7" r="4" /><path d="M23 21v-2a4 4 0 00-3-3.87" /><path d="M16 3.13a4 4 0 010 7.75" /></svg></span>;

    // Custom hook
    function usePublicCollection(tableName) {
      const [data, setData] = useState([]);
      const [loading, setLoading] = useState(true);

      const fetchData = useCallback(async () => {
        const { data: rows, error } = await supabase
          .from(tableName)
          .select('*')
          .order('created_at', { ascending: false });
        if (error) console.error(error);
        else setData(rows || []);
        setLoading(false);
      }, [tableName]);

      useEffect(() => {
        fetchData();
        const channel = supabase
          .channel(`public:${tableName}`)
          .on('postgres_changes', { event: '*', schema: 'public', table: tableName }, fetchData)
          .subscribe();
        return () => supabase.removeChannel(channel);
      }, [tableName, fetchData]);

      const addDocument = useCallback(async (docData) => {
        const { error } = await supabase.from(tableName).insert([docData]);
        if (error) console.error(error);
        else fetchData();
      }, [tableName, fetchData]);

      const updateDocument = useCallback(async (docId, updateData) => {
        const { error } = await supabase.from(tableName).update(updateData).eq('id', docId);
        if (error) console.error(error);
        else fetchData();
      }, [tableName, fetchData]);

      return { data, loading, addDocument, updateDocument };
    }

    // Main App
    function App() {
      const [appProfile, setAppProfile] = useState(null);
      const [activeTab, setActiveTab] = useState('home');
      const [showRegister, setShowRegister] = useState(false);

      const handleLogin = async (username, password) => {
        const { data, error } = await supabase
          .from('users')
          .select('*')
          .eq('username', username)
          .eq('password', password)
          .single();

        if (error || !data) {
          alert('Invalid username or password');
          return;
        }
        setAppProfile({
          id: data.username,
          name: data.full_name,
          role: data.role,
          class: data.class,
          reg: data.reg
        });
      };

      const handleLogout = () => {
        setAppProfile(null);
        setActiveTab('home');
      };

      if (!appProfile) {
        return showRegister
          ? <RegisterScreen onBack={() => setShowRegister(false)} onSuccess={() => setShowRegister(false)} />
          : <LoginScreen onLogin={handleLogin} onRegister={() => setShowRegister(true)} />;
      }

      return (
        <div className="app-container flex flex-col min-h-screen bg-[#0b0b0e] text-white">
          {/* Header */}
          <header className="am-header px-4 sm:px-6 py-4 flex justify-between items-center sticky top-0 z-20">
            <div>
              <h1 className="text-xl sm:text-2xl font-bold tracking-tight">Bes An Noor</h1>
              <p className="text-xs text-[#8e8e93]">Model School · Boys' Unit</p>
            </div>
            <div className="flex items-center gap-3">
              <div className="hidden sm:block text-right">
                <p className="text-sm font-medium">{appProfile.name}</p>
                <p className="text-xs text-[#8e8e93]">{appProfile.role}</p>
              </div>
              <div className="w-9 h-9 rounded-full bg-[#2c2c2e] flex items-center justify-center border border-[#3a3a3c]">
                <IconUser size={18} className="text-[#8e8e93]" />
              </div>
              <button onClick={handleLogout} className="p-1.5 rounded-full bg-[#2c2c2e] hover:bg-[#3a3a3c] transition">
                <IconLogOut size={18} className="text-[#8e8e93]" />
              </button>
            </div>
          </header>

          {/* Main Content */}
          <main className="flex-1 overflow-y-auto px-4 sm:px-6 pb-28 pt-4">
            {activeTab === 'home' && <HomeTab profile={appProfile} setActiveTab={setActiveTab} />}
            {activeTab === 'notices' && <NoticesTab profile={appProfile} />}
            {activeTab === 'schedule' && <ScheduleTab profile={appProfile} />}
            {activeTab === 'issues' && <IssuesTab profile={appProfile} />}
            {activeTab === 'users' && appProfile.role === 'ADMIN' && <UsersTab />}
          </main>

          {/* Bottom Navigation */}
          <nav className="am-tab fixed bottom-0 left-0 right-0 flex justify-around items-center px-2 py-2 pb-safe z-20 max-w-[900px] mx-auto">

            <TabButton icon={<IconClipboard />} label="Notices" active={activeTab === 'notices'} onClick={() => setActiveTab('notices')} />

    // Login Screen
    function LoginScreen({ onLogin, onRegister }) {
      const [id, setId] = useState('');
      const [pass, setPass] = useState('');

      return (

            <div className="text-center mb-10">

              <input

    // Register Screen

      const handleRegister = async () => {
        if (!form.username || !form.password || !form.full_name) {

          return;

        const { error } = await supabase.from('users').insert([{
          username: form.username,
          password: form.password,
          full_name: form.full_name,
          role: form.role

        if (error) {

      return (

              className="w-full p-3 mb-3 bg-[#2c2c2e] border border-[#3a3a3c] rounded-xl text-white"

              onChange={e => setForm({...form, full_name: e.target.value})}
            />
            <input
              type="text" placeholder="Login ID (username)"
              className="w-full p-3 mb-3 bg-[#2c2c2e] border border-[#3a3a3c] rounded-xl text-white"

            <input
              type="password" placeholder="Password"
              className="w-full p-3 mb-3 bg-[#2c2c2e] border border-[#3a3a3c] rounded-xl text-white"

              onChange={e => setForm({...form, password: e.target.value})}

            <select

    function TabButton({ icon, label, active, onClick }) {

    // Home Tab

                  <p className="text-[#8e8e93] text-sm">No attendance marked yet today.</p>

                  <div className="space-y-2">
                    {todayAttendance.map(a => (
                      <div key={a.id} className="flex justify-between items-center py-2 border-b border-[#2c2c2e] last:border-0">
                        <span className="text-sm">{a.name || a.teacher_id}</span>

            </div>

            {/* Quick Actions */}
            <div>
              <h3 className="font-semibold text-lg mb-3">Quick Actions</h3>
              <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">

                <ActionCard icon={<IconBell className="text-orange-400" />} title="Post Notice" subtitle="Announcement" onClick={() => setActiveTab('notices')} />
                <ActionCard icon={<IconUsers className="text-purple-400" />} title="Manage Users" subtitle="Add teachers" onClick={() => setActiveTab('users')} />
              </div>
            </div>
          </div>
        );
      }

      // Teacher / Others
      return (
        <div className="space-y-6">
          <div className="am-card p-5 flex items-center gap-4">
            <div className="w-14 h-14 rounded-full bg-gradient-to-br from-red-500 to-pink-500 flex items-center justify-center">
              <IconUser size={24} className="text-white" />
            </div>
            <div>
              <h2 className="font-bold text-lg">Welcome, {profile.name}</h2>
              <p className="text-[#8e8e93] text-sm">{profile.role}</p>
            </div>
          </div>

          {['TEACHER', 'ADMIN'].includes(profile.role) && (
            <TeacherAttendance profile={profile} />

          {/* Proxies for this teacher */}
          {profile.role === 'TEACHER' && myProxies.length > 0 && (
            <div>
              <h3 className="font-semibold text-lg mb-3">Your Proxy Classes</h3>
              <div className="space-y-3">
                {myProxies.map(p => (
                  <div key={p.id} className="am-card p-4 border-l-4 border-l-blue-500">
                    <div className="flex justify-between">
                      <span className="text-xs bg-blue-500/20 text-blue-400 px-2 py-1 rounded-full">{p.date}</span>
                      <span className="text-xs bg-[#2c2c2e] px-2 py-1 rounded-full">{p.class_room}</span>
                    </div>
                    <p className="mt-2 font-medium">{p.subject}</p>
                    <p className="text-xs text-[#8e8e93]">Replacing: {p.absent_teacher}</p>
                  </div>
                ))}
              </div>
            </div>
          )}

          <div>
            <h3 className="font-semibold text-lg mb-3">Quick Actions</h3>
            <div className="grid grid-cols-2 gap-3">
              <ActionCard icon={<IconClipboard className="text-orange-400" />} title="Notices" subtitle="View updates" onClick={() => setActiveTab('notices')} />
              <ActionCard icon={<IconCalendar className="text-blue-400" />} title="Proxy" subtitle="Schedule" onClick={() => setActiveTab('schedule')} />
              {profile.role === 'TEACHER' && (
                <>
                  <ActionCard icon={<IconStethoscope className="text-red-400" />} title="Medical" subtitle="Report issue" onClick={() => setActiveTab('issues')} />
                  <ActionCard icon={<IconWrench className="text-gray-400" />} title="Facility" subtitle="Report repair" onClick={() => setActiveTab('issues')} />
                </>
              )}
            </div>
          </div>
        </div>
      );
    }

    function TeacherAttendance({ profile }) {
      const { data: attendance, addDocument } = usePublicCollection('attendance');
      const today = new Date().toISOString().split('T')[0];
      const myAttendanceToday = attendance.find(a => a.date === today && a.teacher_id === profile.id);

      const markAttendance = () => {
        if (!myAttendanceToday) {
          addDocument({
            date: today,
            teacher_id: profile.id,
            name: profile.name,
            status: 'PRESENT'
          });
        }
      };

      return (
        <div className="am-card p-5">
          <div className="flex justify-between items-center">
            <div>
              <h3 className="font-bold">Daily Attendance</h3>
              <p className="text-sm text-[#8e8e93]">{new Date().toDateString()}</p>
            </div>
            {myAttendanceToday ? (
              <div className="flex items-center gap-1 text-green-400 bg-green-500/10 px-3 py-1.5 rounded-full text-sm border border-green-500/20">
                <IconCheckCircle size={16} /> Present
              </div>
            ) : (
              <button onClick={markAttendance} className="bg-gradient-to-r from-red-500 to-pink-500 text-white px-5 py-2 rounded-full text-sm font-semibold">
                Mark Present
              </button>
            )}
          </div>
        </div>
      );
    }

    // Notices Tab
    function NoticesTab({ profile }) {
      const { data: notices, addDocument } = usePublicCollection('notices');
      const [showForm, setShowForm] = useState(false);
      const [newNotice, setNewNotice] = useState({ title: '', type: 'text', content: '' });

      const handlePost = () => {
        if (newNotice.title && newNotice.content) {
          addDocument({ ...newNotice, author: profile.name });
          setShowForm(false);
          setNewNotice({ title: '', type: 'text', content: '' });
        }
      };

      return (
        <div className="space-y-5">
          <div className="flex justify-between items-center">
            <h2 className="text-2xl font-bold">Notices</h2>
            {profile.role === 'ADMIN' && (
              <button onClick={() => setShowForm(!showForm)} className="text-red-500 bg-red-500/10 p-2 rounded-full">
                <IconPlusCircle size={24} />
              </button>
            )}
          </div>

          {showForm && (
            <div className="am-card p-4 animate-in">
              <input type="text" placeholder="Notice Title" className="w-full p-2 mb-3 bg-[#2c2c2e] border-b border-[#3a3a3c] text-white" value={newNotice.title} onChange={e => setNewNotice({...newNotice, title: e.target.value})} />
              <select className="w-full p-2 mb-3 bg-[#2c2c2e] rounded-lg text-sm border border-[#3a3a3c] text-white" value={newNotice.type} onChange={e => setNewNotice({...newNotice, type: e.target.value})}>
                <option value="text">Text</option>
                <option value="image">Image (URL)</option>
                <option value="pdf">PDF (Link)</option>
              </select>
              <textarea placeholder="Content..." className="w-full p-3 bg-[#2c2c2e] rounded-xl mb-3 text-sm min-h-[80px] border border-[#3a3a3c] text-white" value={newNotice.content} onChange={e => setNewNotice({...newNotice, content: e.target.value})} />
              <button onClick={handlePost} className="w-full bg-gradient-to-r from-red-500 to-pink-500 text-white font-bold py-2 rounded-xl">Publish</button>
            </div>
          )}

          {notices.length === 0 && <p className="text-center text-[#8e8e93] py-10">No notices yet.</p>}
          <div className="space-y-4">
            {notices.map(n => (
              <div key={n.id} className="am-card p-5 border-l-4 border-l-red-500">
                <h3 className="font-bold mb-1">{n.title}</h3>
                <p className="text-xs text-[#8e8e93] mb-3">Posted by {n.author}</p>
                {n.type === 'text' && <p className="text-sm text-[#e5e5ea] whitespace-pre-wrap">{n.content}</p>}
                {n.type === 'image' && <img src={n.content} alt={n.title} className="max-w-full rounded-xl max-h-48 object-contain mt-2" />}
                {n.type === 'pdf' && <a href={n.content} target="_blank" className="flex items-center gap-2 text-red-400 bg-red-500/10 p-3 rounded-xl mt-2 text-sm"><IconFileText size={18} /> View PDF</a>}
              </div>
            ))}
          </div>
        </div>
      );
    }

    // Schedule / Proxy Tab
    function ScheduleTab({ profile }) {
      const { data: proxies, addDocument } = usePublicCollection('proxies');
      const [showForm, setShowForm] = useState(false);
      const [newProxy, setNewProxy] = useState({ date: '', absent_teacher: '', proxy_teacher: '', class_room: '', subject: '' });

      const handleAssign = () => {
        if (newProxy.date && newProxy.proxy_teacher) {
          addDocument(newProxy);
          setShowForm(false);
          setNewProxy({ date: '', absent_teacher: '', proxy_teacher: '', class_room: '', subject: '' });
        }
      };

      return (
        <div className="space-y-5">
          <div className="flex justify-between items-center">
            <div>
              <h2 className="text-2xl font-bold">Proxy Schedule</h2>
              <p className="text-sm text-[#8e8e93]">Substitution roster</p>
            </div>
            {profile.role === 'ADMIN' && (
              <button onClick={() => setShowForm(!showForm)} className="bg-red-500/10 text-red-500 px-4 py-2 rounded-full text-sm font-semibold flex items-center gap-1">
                <IconPlusCircle size={16} /> Add
              </button>
            )}
          </div>

          {showForm && profile.role === 'ADMIN' && (
            <div className="am-card p-4 grid gap-3 text-sm animate-in">
              <input type="date" className="p-2 bg-[#2c2c2e] border border-[#3a3a3c] rounded-lg text-white" value={newProxy.date} onChange={e => setNewProxy({...newProxy, date: e.target.value})} />
              <input type="text" placeholder="Absent Teacher" className="p-2 bg-[#2c2c2e] border border-[#3a3a3c] rounded-lg text-white" value={newProxy.absent_teacher} onChange={e => setNewProxy({...newProxy, absent_teacher: e.target.value})} />
              <input type="text" placeholder="Proxy Teacher (name or ID)" className="p-2 bg-[#2c2c2e] border border-[#3a3a3c] rounded-lg text-white" value={newProxy.proxy_teacher} onChange={e => setNewProxy({...newProxy, proxy_teacher: e.target.value})} />
              <div className="grid grid-cols-2 gap-2">
                <input type="text" placeholder="Class/Sec" className="p-2 bg-[#2c2c2e] border border-[#3a3a3c] rounded-lg text-white" value={newProxy.class_room} onChange={e => setNewProxy({...newProxy, class_room: e.target.value})} />
                <input type="text" placeholder="Subject" className="p-2 bg-[#2c2c2e] border border-[#3a3a3c] rounded-lg text-white" value={newProxy.subject} onChange={e => setNewProxy({...newProxy, subject: e.target.value})} />
              </div>
              <button onClick={handleAssign} className="bg-gradient-to-r from-red-500 to-pink-500 text-white font-bold py-2 rounded-lg">Assign Proxy</button>
            </div>
          )}

          <div className="space-y-3">
            {proxies.length === 0 ? (
              <p className="text-center text-[#8e8e93] py-8">No proxy classes scheduled.</p>
            ) : (
              proxies.map(proxy => (
                <div key={proxy.id} className="am-card p-4 border-l-4 border-l-red-500">
                  <div className="flex justify-between items-start">
                    <span className="bg-red-500/20 text-red-400 text-xs font-bold px-2 py-1 rounded-full">{proxy.date}</span>
                    <span className="font-bold text-xs bg-[#2c2c2e] px-2 py-1 rounded-full">{proxy.class_room}</span>
                  </div>
                  <div className="flex items-center gap-3 mt-3">
                    <div className="flex-1">
                      <p className="text-xs text-[#8e8e93]">Substitute</p>
                      <p className="font-semibold">{proxy.proxy_teacher}</p>
                    </div>
                    <div className="text-[#3a3a3c]">|</div>
                    <div className="flex-1">
                      <p className="text-xs text-[#8e8e93]">Replacing</p>
                      <p className="text-sm text-[#8e8e93] line-through decoration-red-400">{proxy.absent_teacher}</p>
                    </div>
                  </div>
                  <div className="text-sm pt-2 border-t border-[#2c2c2e] mt-2">Subject: {proxy.subject}</div>
                </div>
              ))
            )}
          </div>
        </div>
      );
    }

    // Issues Tab
    function IssuesTab({ profile }) {
      const { data: medicalIssues, addDocument: addMed, updateDocument: updateMed } = usePublicCollection('medical');
      const { data: maintIssues, addDocument: addMaint, updateDocument: updateMaint } = usePublicCollection('maintenance');
      const [tab, setTab] = useState(profile.role === 'MAINTENANCE' ? 'maint' : 'med');
      const [showForm, setShowForm] = useState(false);
      const [newIssue, setNewIssue] = useState({ target: '', room: '', description: '' });

      const isTeacher = profile.role === 'TEACHER';

      const handleReport = () => {
        if (newIssue.description) {
          if (tab === 'med') {
            addMed({ student_name: newIssue.target, room: newIssue.room, description: newIssue.description, reported_by: profile.name, status: 'PENDING' });
          } else {
            addMaint({ location: newIssue.room, type: newIssue.target, description: newIssue.description, reported_by: profile.name, status: 'PENDING' });
          }
          setShowForm(false);
          setNewIssue({ target: '', room: '', description: '' });
        }
      };

      const activeData = tab === 'med' ? medicalIssues : maintIssues;

      return (
        <div className="space-y-5">
          <div className="flex bg-[#1c1c1e] p-1 rounded-xl">
            {profile.role !== 'MAINTENANCE' && (
              <button className={`flex-1 py-2 text-sm font-medium rounded-lg ${tab === 'med' ? 'bg-[#2c2c2e] text-white' : 'text-[#8e8e93]'}`} onClick={() => setTab('med')}>Medical</button>
            )}
            {profile.role !== 'DOCTOR' && (
              <button className={`flex-1 py-2 text-sm font-medium rounded-lg ${tab === 'maint' ? 'bg-[#2c2c2e] text-white' : 'text-[#8e8e93]'}`} onClick={() => setTab('maint')}>Facility</button>
            )}
          </div>

          {isTeacher && (
            <button onClick={() => setShowForm(!showForm)} className="w-full bg-red-500/10 border border-red-500/20 text-red-400 font-medium py-3 rounded-xl flex items-center justify-center gap-2">
              <IconPlusCircle size={18} /> Report New {tab === 'med' ? 'Medical' : 'Facility'} Issue
            </button>
          )}

          {showForm && isTeacher && (
            <div className="am-card p-4 space-y-3 animate-in">
              <input type="text" placeholder={tab === 'med' ? "Student Name" : "Issue Type"} className="w-full p-2 bg-[#2c2c2e] border border-[#3a3a3c] rounded-lg text-white text-sm" value={newIssue.target} onChange={e => setNewIssue({...newIssue, target: e.target.value})} />
              <input type="text" placeholder={tab === 'med' ? "Class/Room" : "Location"} className="w-full p-2 bg-[#2c2c2e] border border-[#3a3a3c] rounded-lg text-white text-sm" value={newIssue.room} onChange={e => setNewIssue({...newIssue, room: e.target.value})} />
              <textarea placeholder="Describe the issue..." className="w-full p-2 bg-[#2c2c2e] border border-[#3a3a3c] rounded-lg text-white text-sm min-h-[80px]" value={newIssue.description} onChange={e => setNewIssue({...newIssue, description: e.target.value})} />
              <button onClick={handleReport} className="w-full bg-gradient-to-r from-red-500 to-pink-500 text-white font-bold py-2 rounded-lg">Submit</button>
            </div>
          )}

          <div className="space-y-3">
            {activeData.length === 0 && <p className="text-center text-[#8e8e93] py-8">No open issues.</p>}
            {activeData.map(item => (
              <div key={item.id} className={`am-card p-4 border-l-4 ${item.status === 'RESOLVED' ? 'border-l-green-500 opacity-60' : 'border-l-red-500'}`}>
                <div className="flex justify-between items-start mb-2">
                  <h4 className="font-bold">{tab === 'med' ? item.student_name : item.type}</h4>
                  <span className={`text-[10px] px-2 py-1 rounded-full font-bold ${item.status === 'RESOLVED' ? 'bg-green-500/20 text-green-400' : 'bg-orange-500/20 text-orange-400'}`}>{item.status}</span>
                </div>
                <p className="text-xs text-[#8e8e93] mb-2">Location: <span className="font-semibold text-[#e5e5ea]">{item.room || item.location}</span></p>
                <p className="text-sm bg-[#1c1c1e] p-2 rounded-lg border border-[#2c2c2e] mb-2">{item.description}</p>
                <p className="text-[10px] text-[#8e8e93] text-right">Reported by: {item.reported_by}</p>
                {item.status !== 'RESOLVED' && ((tab === 'med' && profile.role === 'DOCTOR') || (tab === 'maint' && profile.role === 'MAINTENANCE')) && (
                  <button onClick={() => tab === 'med' ? updateMed(item.id, { status: 'RESOLVED' }) : updateMaint(item.id, { status: 'RESOLVED' })} className="mt-3 w-full bg-[#2c2c2e] text-white py-2 rounded-lg text-sm font-medium flex justify-center items-center gap-2">
                    <IconCheckCircle size={16} /> Mark Resolved
                  </button>
                )}
              </div>
            ))}
          </div>
        </div>
      );
    }

    // Users Tab (Admin only)
    function UsersTab() {
      const { data: users, addDocument } = usePublicCollection('users');
      const [showForm, setShowForm] = useState(false);
      const [form, setForm] = useState({ username: '', password: '', full_name: '', role: 'TEACHER' });

      const handleAdd = () => {
        if (form.username && form.password && form.full_name) {
          addDocument(form);
          setShowForm(false);
          setForm({ username: '', password: '', full_name: '', role: 'TEACHER' });
        }
      };

      return (
        <div className="space-y-5">
          <div className="flex justify-between items-center">
            <h2 className="text-2xl font-bold">Manage Users</h2>
            <button onClick={() => setShowForm(!showForm)} className="bg-red-500/10 text-red-500 px-4 py-2 rounded-full text-sm font-semibold flex items-center gap-1">
              <IconPlusCircle size={16} /> Add User
            </button>
          </div>

          {showForm && (
            <div className="am-card p-4 grid gap-3 animate-in">
              <input type="text" placeholder="Full Name" className="p-2 bg-[#2c2c2e] border border-[#3a3a3c] rounded-lg text-white" value={form.full_name} onChange={e => setForm({...form, full_name: e.target.value})} />
              <input type="text" placeholder="Login ID" className="p-2 bg-[#2c2c2e] border border-[#3a3a3c] rounded-lg text-white" value={form.username} onChange={e => setForm({...form, username: e.target.value})} />
              <input type="text" placeholder="Password" className="p-2 bg-[#2c2c2e] border border-[#3a3a3c] rounded-lg text-white" value={form.password} onChange={e => setForm({...form, password: e.target.value})} />
              <select className="p-2 bg-[#2c2c2e] border border-[#3a3a3c] rounded-lg text-white" value={form.role} onChange={e => setForm({...form, role: e.target.value})}>
                <option value="TEACHER">Teacher</option>
                <option value="DOCTOR">Doctor</option>
                <option value="MAINTENANCE">Maintenance</option>
                <option value="ADMIN">Admin</option>
              </select>
              <button onClick={handleAdd} className="bg-gradient-to-r from-red-500 to-pink-500 text-white font-bold py-2 rounded-lg">Create User</button>
            </div>
          )}

          <div className="space-y-2">
            {users.map(u => (
              <div key={u.id} className="am-card p-4 flex justify-between items-center">
                <div>
                  <p className="font-medium">{u.full_name}</p>
                  <p className="text-xs text-[#8e8e93]">@{u.username} · {u.role}</p>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function ActionCard({ icon, title, subtitle, onClick }) {
      return (
        <div onClick={onClick} className="am-card p-4 flex flex-col items-start gap-2 cursor-pointer hover:bg-[#252528] transition">
          <div className="bg-[#2c2c2e] p-2 rounded-xl">{icon}</div>
          <div>
            <h4 className="font-bold text-sm">{title}</h4>
            <p className="text-[10px] text-[#8e8e93] mt-0.5">{subtitle}</p>
          </div>
        </div>
      );
    }

    const root = document.getElementById('root');
    ReactDOM.createRoot(root).render(React.createElement(App));
  </script>
</body>
</html>
