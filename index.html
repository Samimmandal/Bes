<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bes An Noor · School Portal</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body { background: #0b0b0e; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; color: #fff; }
    .card { background: #1c1c1e; border-radius: 16px; }
    .header { background: rgba(11,11,14,0.95); border-bottom: 1px solid #2c2c2e; }
    .bottom-nav { background: rgba(20,20,23,0.95); border-top: 1px solid #2c2c2e; }
    .icon { display: inline-flex; align-items: center; justify-content: center; }
    .icon svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;

    const SUPABASE_URL = 'https://peiybuhnozgqatdyrdhf.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBlaXlidWhub3pncWF0ZHlyZGhmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5NzIyNDEsImV4cCI6MjEwMjU0ODI0MX0.a_1otAvBMRa20HSA01jcvtCbxwUpXNbmCzVmA9Qm-DE';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Icons
    const IconHome = () => <span className="icon"><svg viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg></span>;
    const IconClipboard = () => <span className="icon"><svg viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/><path d="M9 13l2 2 4-4"/></svg></span>;
    const IconCalendar = () => <span className="icon"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></span>;
    const IconUser = () => <span className="icon"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>;
    const IconUsers = () => <span className="icon"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg></span>;
    const IconLogOut = () => <span className="icon"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></span>;
    const IconPlus = () => <span className="icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg></span>;
    const IconCheck = () => <span className="icon"><svg viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></span>;

    function useCollection(table) {
      const [data, setData] = useState([]);
      const load = useCallback(async () => {
        const { data: rows } = await supabase.from(table).select('*').order('created_at', { ascending: false });
        setData(rows || []);
      }, [table]);

      useEffect(() => {
        load();
        const ch = supabase.channel(table).on('postgres_changes', { event: '*', schema: 'public', table }, load).subscribe();
        return () => supabase.removeChannel(ch);
      }, [table, load]);

      const add = async (row) => {
        const { error } = await supabase.from(table).insert([row]);
        if (error) alert(error.message);
        else load();
      };
      return { data, add };
    }

    function App() {
      const [user, setUser] = useState(null);
      const [tab, setTab] = useState('home');
      const [showReg, setShowReg] = useState(false);

      const login = async (username, password) => {
        const cleanUser = username.trim();
        const cleanPass = password.trim();

        if (!cleanUser || !cleanPass) {
          alert('Please enter both Login ID and Password');
          return;
        }

        const { data, error } = await supabase
          .from('users')
          .select('*')
          .eq('username', cleanUser)
          .eq('password', cleanPass)
          .maybeSingle();

        if (error) {
          alert('Database error: ' + error.message);
          return;
        }
        if (!data) {
          alert('Invalid Login ID or Password.\n\nMake sure you are using the Login ID (not Full Name).');
          return;
        }

        setUser({
          id: data.username,
          name: data.full_name,
          role: data.role,
          password: data.password   // kept only for profile display
        });
      };

      if (!user) {
        return showReg
          ? <Register onBack={() => setShowReg(false)} onSuccess={() => setShowReg(false)} />
          : <Login onLogin={login} onRegister={() => setShowReg(true)} />;
      }

      return (
        <div className="min-h-screen bg-[#0b0b0e] max-w-lg mx-auto flex flex-col">
          <header className="header px-4 py-4 flex justify-between items-center sticky top-0 z-20">
            <div>
              <h1 className="text-xl font-bold">Bes An Noor</h1>
              <p className="text-xs text-gray-400">School Portal</p>
            </div>
            <button onClick={() => { setUser(null); setTab('home'); }} className="p-2 rounded-full bg-[#2c2c2e] text-gray-400">
              <IconLogOut />
            </button>
          </header>

          <main className="flex-1 overflow-y-auto px-4 pb-24 pt-4">
            {tab === 'home' && <Home user={user} setTab={setTab} />}
            {tab === 'notices' && <Notices user={user} />}
            {tab === 'proxy' && <Proxy user={user} />}
            {tab === 'profile' && <Profile user={user} />}
            {tab === 'users' && user.role === 'ADMIN' && <Users />}
          </main>

          <nav className="bottom-nav fixed bottom-0 left-0 right-0 max-w-lg mx-auto flex justify-around py-3 z-20">
            <button onClick={() => setTab('home')} className={`flex flex-col items-center gap-1 text-xs ${tab==='home' ? 'text-red-500' : 'text-gray-400'}`}>
              <IconHome /><span>Home</span>
            </button>
            <button onClick={() => setTab('notices')} className={`flex flex-col items-center gap-1 text-xs ${tab==='notices' ? 'text-red-500' : 'text-gray-400'}`}>
              <IconClipboard /><span>Notices</span>
            </button>
            <button onClick={() => setTab('proxy')} className={`flex flex-col items-center gap-1 text-xs ${tab==='proxy' ? 'text-red-500' : 'text-gray-400'}`}>
              <IconCalendar /><span>Proxy</span>
            </button>
            <button onClick={() => setTab('profile')} className={`flex flex-col items-center gap-1 text-xs ${tab==='profile' ? 'text-red-500' : 'text-gray-400'}`}>
              <IconUser /><span>Profile</span>
            </button>
            {user.role === 'ADMIN' && (
              <button onClick={() => setTab('users')} className={`flex flex-col items-center gap-1 text-xs ${tab==='users' ? 'text-red-500' : 'text-gray-400'}`}>
                <IconUsers /><span>Users</span>
              </button>
            )}
          </nav>
        </div>
      );
    }

    function Login({ onLogin, onRegister }) {
      const [id, setId] = useState('');
      const [pass, setPass] = useState('');
      return (
        <div className="min-h-screen flex items-center justify-center p-4">
          <div className="w-full max-w-sm">
            <div className="text-center mb-8">
              <div className="w-16 h-16 mx-auto rounded-2xl bg-gradient-to-br from-red-500 to-pink-500 flex items-center justify-center mb-4 text-white">
                <IconUser />
              </div>
              <h1 className="text-3xl font-bold">Bes An Noor</h1>
              <p className="text-gray-400 mt-1">School Portal</p>
            </div>
            <div className="card p-6 space-y-4">
              <input value={id} onChange={e => setId(e.target.value)} placeholder="Login ID (e.g. 0000)" className="w-full p-3 bg-[#2c2c2e] rounded-xl border border-[#3a3a3c] text-white" />
              <input type="password" value={pass} onChange={e => setPass(e.target.value)} placeholder="Password" className="w-full p-3 bg-[#2c2c2e] rounded-xl border border-[#3a3a3c] text-white" />
              <button onClick={() => onLogin(id, pass)} className="w-full bg-gradient-to-r from-red-500 to-pink-500 text-white font-bold py-3 rounded-xl">Continue</button>
            </div>
            <button onClick={onRegister} className="w-full text-center text-red-400 text-sm mt-6">Create Teacher / Staff Account</button>
            <div className="mt-6 text-xs text-gray-400 bg-[#1c1c1e] p-4 rounded-xl text-center">
              Default Admin → <b>admin</b> / <b>123</b>
            </div>
          </div>
        </div>
      );
    }

    function Register({ onBack, onSuccess }) {
      const [form, setForm] = useState({ username: '', password: '', full_name: '', role: 'TEACHER' });

      const submit = async () => {
        if (!form.username || !form.password || !form.full_name) {
          alert('Please fill all fields');
          return;
        }
        const { error } = await supabase.from('users').insert([{
          username: form.username.trim(),
          password: form.password.trim(),
          full_name: form.full_name.trim(),
          role: form.role
        }]);
        if (error) {
          alert(error.message.includes('duplicate') ? 'This Login ID already exists' : error.message);
        } else {
          alert(`Account created successfully!\n\nLogin ID: ${form.username.trim()}\nPassword: ${form.password.trim()}\n\nPlease save these details.`);
          onSuccess();
        }
      };

      return (
        <div className="min-h-screen flex items-center justify-center p-4">
          <div className="w-full max-w-sm card p-6 space-y-3">
            <h2 className="text-xl font-bold mb-2">Create Account</h2>
            <input placeholder="Full Name" className="w-full p-3 bg-[#2c2c2e] rounded-xl text-white" value={form.full_name} onChange={e => setForm({...form, full_name: e.target.value})} />
            <input placeholder="Login ID (e.g. t001)" className="w-full p-3 bg-[#2c2c2e] rounded-xl text-white" value={form.username} onChange={e => setForm({...form, username: e.target.value})} />
            <input type="password" placeholder="Password" className="w-full p-3 bg-[#2c2c2e] rounded-xl text-white" value={form.password} onChange={e => setForm({...form, password: e.target.value})} />
            <select className="w-full p-3 bg-[#2c2c2e] rounded-xl text-white" value={form.role} onChange={e => setForm({...form, role: e.target.value})}>
              <option value="TEACHER">Teacher</option>
              <option value="ADMIN">Admin</option>
              <option value="DOCTOR">Doctor</option>
              <option value="MAINTENANCE">Maintenance</option>
            </select>
            <button onClick={submit} className="w-full bg-gradient-to-r from-red-500 to-pink-500 text-white font-bold py-3 rounded-xl">Create Account</button>
            <button onClick={onBack} className="w-full text-gray-400 text-sm">Back to Login</button>
          </div>
        </div>
      );
    }

    function Home({ user, setTab }) {
      const { data: attendance, add } = useCollection('attendance');
      const today = new Date().toISOString().split('T')[0];
      const mine = attendance.find(a => a.date === today && a.teacher_id === user.id);

      return (
        <div className="space-y-5">
          <div className="card p-5 flex items-center gap-4">
            <div className="w-12 h-12 rounded-full bg-gradient-to-br from-red-500 to-pink-500 flex items-center justify-center text-white">
              <IconUser />
            </div>
            <div>
              <h2 className="font-bold text-lg">Welcome, {user.name}</h2>
              <p className="text-sm text-gray-400">{user.role}</p>
            </div>
          </div>

          {user.role === 'ADMIN' && (
            <div className="card p-4">
              <h3 className="font-semibold mb-3">Today's Attendance</h3>
              {attendance.filter(a => a.date === today).length === 0 ? (
                <p className="text-sm text-gray-400">No one marked yet</p>
              ) : (
                attendance.filter(a => a.date === today).map(a => (
                  <div key={a.id} className="flex justify-between py-2 border-b border-[#2c2c2e] last:border-0 text-sm">
                    <span>{a.name}</span>
                    <span className="text-green-400">{a.status}</span>
                  </div>
                ))
              )}
            </div>
          )}

          {(user.role === 'TEACHER' || user.role === 'ADMIN') && (
            <div className="card p-5 flex justify-between items-center">
              <div>
                <h3 className="font-bold">Daily Attendance</h3>
                <p className="text-sm text-gray-400">{new Date().toDateString()}</p>
              </div>
              {mine ? (
                <span className="flex items-center gap-1 text-green-400 bg-green-500/10 px-3 py-1.5 rounded-full text-sm">
                  <IconCheck /> Present
                </span>
              ) : (
                <button onClick={() => add({ date: today, teacher_id: user.id, name: user.name, status: 'PRESENT' })} className="bg-gradient-to-r from-red-500 to-pink-500 text-white px-4 py-2 rounded-full text-sm font-semibold">
                  Mark Present
                </button>
              )}
            </div>
          )}

          <div className="grid grid-cols-2 gap-3">
            <button onClick={() => setTab('notices')} className="card p-4 text-left">
              <div className="text-orange-400 mb-2"><IconClipboard /></div>
              <div className="font-semibold text-sm">Notices</div>
            </button>
            <button onClick={() => setTab('proxy')} className="card p-4 text-left">
              <div className="text-blue-400 mb-2"><IconCalendar /></div>
              <div className="font-semibold text-sm">Proxy</div>
            </button>
          </div>
        </div>
      );
    }

    function Profile({ user }) {
      return (
        <div className="space-y-5">
          <h2 className="text-2xl font-bold">My Profile</h2>
          <div className="card p-5 space-y-4">
            <div>
              <p className="text-xs text-gray-400 mb-1">Full Name</p>
              <p className="font-medium">{user.name}</p>
            </div>
            <div>
              <p className="text-xs text-gray-400 mb-1">Role</p>
              <p className="font-medium">{user.role}</p>
            </div>
            <div>
              <p className="text-xs text-gray-400 mb-1">Login ID</p>
              <p className="font-medium text-red-400">{user.id}</p>
            </div>
            <div className="pt-2 border-t border-[#2c2c2e]">
              <p className="text-xs text-gray-400">Password is hidden for security. Contact Admin if you forgot your password.</p>
            </div>
          </div>
        </div>
      );
    }

    function Notices({ user }) {
      const { data, add } = useCollection('notices');
      const [show, setShow] = useState(false);
      const [title, setTitle] = useState('');
      const [content, setContent] = useState('');

      return (
        <div className="space-y-4">
          <div className="flex justify-between items-center">
            <h2 className="text-2xl font-bold">Notices</h2>
            {user.role === 'ADMIN' && (
              <button onClick={() => setShow(!show)} className="text-red-500 bg-red-500/10 p-2 rounded-full"><IconPlus /></button>
            )}
          </div>
          {show && (
            <div className="card p-4 space-y-3">
              <input value={title} onChange={e => setTitle(e.target.value)} placeholder="Title" className="w-full p-2 bg-[#2c2c2e] rounded-lg text-white" />
              <textarea value={content} onChange={e => setContent(e.target.value)} placeholder="Content" className="w-full p-2 bg-[#2c2c2e] rounded-lg text-white min-h-[80px]" />
              <button onClick={() => { if(title && content){ add({ title, content, type:'text', author: user.name }); setShow(false); setTitle(''); setContent(''); }}} className="w-full bg-gradient-to-r from-red-500 to-pink-500 text-white font-bold py-2 rounded-xl">Publish</button>
            </div>
          )}
          {data.length === 0 && <p className="text-center text-gray-400 py-10">No notices yet</p>}
          {data.map(n => (
            <div key={n.id} className="card p-5 border-l-4 border-red-500">
              <h3 className="font-bold">{n.title}</h3>
              <p className="text-xs text-gray-400 mb-2">By {n.author}</p>
              <p className="text-sm whitespace-pre-wrap">{n.content}</p>
            </div>
          ))}
        </div>
      );
    }

    function Proxy({ user }) {
      const { data, add } = useCollection('proxies');
      const [show, setShow] = useState(false);
      const [form, setForm] = useState({ date:'', absent_teacher:'', proxy_teacher:'', class_room:'', subject:'' });

      return (
        <div className="space-y-4">
          <div className="flex justify-between items-center">
            <div>
              <h2 className="text-2xl font-bold">Proxy Schedule</h2>
              <p className="text-sm text-gray-400">Substitution roster</p>
            </div>
            {user.role === 'ADMIN' && (
              <button onClick={() => setShow(!show)} className="bg-red-500/10 text-red-500 px-4 py-2 rounded-full text-sm font-semibold flex items-center gap-1"><IconPlus /> Add</button>
            )}
          </div>
          {show && user.role === 'ADMIN' && (
            <div className="card p-4 grid gap-3">
              <input type="date" className="p-2 bg-[#2c2c2e] rounded-lg text-white" value={form.date} onChange={e => setForm({...form, date: e.target.value})} />
              <input placeholder="Absent Teacher" className="p-2 bg-[#2c2c2e] rounded-lg text-white" value={form.absent_teacher} onChange={e => setForm({...form, absent_teacher: e.target.value})} />
              <input placeholder="Proxy Teacher (Login ID or Name)" className="p-2 bg-[#2c2c2e] rounded-lg text-white" value={form.proxy_teacher} onChange={e => setForm({...form, proxy_teacher: e.target.value})} />
              <div className="grid grid-cols-2 gap-2">
                <input placeholder="Class" className="p-2 bg-[#2c2c2e] rounded-lg text-white" value={form.class_room} onChange={e => setForm({...form, class_room: e.target.value})} />
                <input placeholder="Subject" className="p-2 bg-[#2c2c2e] rounded-lg text-white" value={form.subject} onChange={e => setForm({...form, subject: e.target.value})} />
              </div>
              <button onClick={() => { if(form.date && form.proxy_teacher){ add(form); setShow(false); setForm({date:'',absent_teacher:'',proxy_teacher:'',class_room:'',subject:''}); }}} className="bg-gradient-to-r from-red-500 to-pink-500 text-white font-bold py-2 rounded-lg">Assign</button>
            </div>
          )}
          {data.length === 0 ? <p className="text-center text-gray-400 py-8">No proxy classes</p> :
            data.map(p => (
              <div key={p.id} className="card p-4 border-l-4 border-red-500">
                <div className="flex justify-between text-xs mb-2">
                  <span className="bg-red-500/20 text-red-400 px-2 py-1 rounded-full">{p.date}</span>
                  <span className="bg-[#2c2c2e] px-2 py-1 rounded-full">{p.class_room}</span>
                </div>
                <div className="flex gap-3 text-sm">
                  <div className="flex-1"><p className="text-gray-400 text-xs">Substitute</p><p className="font-semibold">{p.proxy_teacher}</p></div>
                  <div className="flex-1"><p className="text-gray-400 text-xs">Replacing</p><p className="line-through text-gray-400">{p.absent_teacher}</p></div>
                </div>
                <p className="text-sm mt-2 pt-2 border-t border-[#2c2c2e]">Subject: {p.subject}</p>
              </div>
            ))
          }
        </div>
      );
    }

    function Users() {
      const { data, add } = useCollection('users');
      const [show, setShow] = useState(false);
      const [form, setForm] = useState({ username:'', password:'', full_name:'', role:'TEACHER' });

      return (
        <div className="space-y-4">
          <div className="flex justify-between items-center">
            <h2 className="text-2xl font-bold">Manage Users</h2>
            <button onClick={() => setShow(!show)} className="bg-red-500/10 text-red-500 px-4 py-2 rounded-full text-sm font-semibold flex items-center gap-1"><IconPlus /> Add</button>
          </div>
          {show && (
            <div className="card p-4 grid gap-3">
              <input placeholder="Full Name" className="p-2 bg-[#2c2c2e] rounded-lg text-white" value={form.full_name} onChange={e => setForm({...form, full_name: e.target.value})} />
              <input placeholder="Login ID" className="p-2 bg-[#2c2c2e] rounded-lg text-white" value={form.username} onChange={e => setForm({...form, username: e.target.value})} />
              <input placeholder="Password" className="p-2 bg-[#2c2c2e] rounded-lg text-white" value={form.password} onChange={e => setForm({...form, password: e.target.value})} />
              <select className="p-2 bg-[#2c2c2e] rounded-lg text-white" value={form.role} onChange={e => setForm({...form, role: e.target.value})}>
                <option value="TEACHER">Teacher</option>
                <option value="ADMIN">Admin</option>
                <option value="DOCTOR">Doctor</option>
                <option value="MAINTENANCE">Maintenance</option>
              </select>
              <button onClick={() => { if(form.username && form.password && form.full_name){ add(form); setShow(false); setForm({username:'',password:'',full_name:'',role:'TEACHER'}); }}} className="bg-gradient-to-r from-red-500 to-pink-500 text-white font-bold py-2 rounded-lg">Create</button>
            </div>
          )}
          {data.map(u => (
            <div key={u.id} className="card p-4">
              <p className="font-medium">{u.full_name}</p>
              <p className="text-xs text-gray-400">Login ID: <span className="text-red-400">{u.username}</span> · {u.role}</p>
            </div>
          ))}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
