    const IconTrash = () => <span className="icon"><svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg></span>;

    const IconFile = () => <span className="icon"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></span>;
    const IconMic = () => <span className="icon"><svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg></span>;

    const IconMoon = () => <span className="icon"><svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg></span>;

    function useCollection(table) {
      const [data, setData] = useState([]);
      const load = useCallback(async () => {
        const { data: rows } = await supabase.from(table).select('*').order('created_at', { ascending: false });
        setData(rows || []);
      }, [table]);
      useEffect(() => {
        load();
        const ch = supabase.channel(table).on('postgres_changes', { event: '*', schema: 'public', table }, load).subscribe();
        return () => supabase.removeChannel(ch);
      }, [table, load]);
      const add = async (row) => {
        const { error } = await supabase.from(table).insert([row]);
        if (error) alert(error.message); else load();
      };
      const update = async (id, changes) => {
        const { error } = await supabase.from(table).update(changes).eq('id', id);
        if (error) alert(error.message); else load();
      };
      const remove = async (id) => {
        const { error } = await supabase.from(table).delete().eq('id', id);
        if (error) alert(error.message); else load();
      };
      return { data, add, update, remove, load };
    }

    function linkifyAndMention(text) {
      if (!text) return text;
      // First handle mentions
      let parts = text.split(/(@\w+)/g);
      return parts.map((part, i) => {
        if (part.startsWith('@')) {
          return <span key={i} className="mention">{part}</span>;
        }
        // Then links
        const urlRegex = /(https?:\/\/[^\s]+)/g;
        return part.split(urlRegex).map((p, j) =>
          urlRegex.test(p) ? <a key={j} href={p} target="_blank" rel="noopener noreferrer">{p}</a> : p
        );
      });
    }

    async function uploadFile(file) {
      if (!file) return null;
      const ext = file.name ? file.name.split('.').pop() : 'webm';
      const fileName = Date.now() + '_' + Math.random().toString(36).substring(2, 8) + '.' + ext;
      const { error } = await supabase.storage.from('school-files').upload(fileName, file);
      if (error) { alert('Upload failed: ' + error.message); return null; }
      const { data } = supabase.storage.from('school-files').getPublicUrl(fileName);
      return data.publicUrl;
    }

    // ==================== APP ====================
    function App() {
      const [user, setUser] = useState(null);
      const [tab, setTab] = useState('home');
      const [mode, setMode] = useState('loading');
      const [theme, setTheme] = useState(localStorage.getItem('bes_theme') || 'dark');

      useEffect(() => {
        document.body.className = theme;
        localStorage.setItem('bes_theme', theme);
      }, [theme]);

      useEffect(() => {
        const saved = localStorage.getItem('bes_pin_user');
        if (saved) {
          try {
            const p = JSON.parse(saved);
            if (p && p.pin) { setMode('pin'); return; }
          } catch(e) {}
        }
        setMode('login');
      }, []);

      const handlePasswordLogin = async (username, password) => {
        const { data, error } = await supabase.from('users').select('*').eq('username', username.trim()).eq('password', password.trim()).maybeSingle();
        if (error) return alert('Error: ' + error.message);
        if (!data) return alert('Invalid Login ID or Password');
        const userData = { id: data.username, name: data.full_name, role: data.role };
        setUser(userData);
        const saved = localStorage.getItem('bes_pin_user');
        if (saved) {
          try {
            const p = JSON.parse(saved);
            if (p.username === data.username && p.pin) { setMode('app'); return; }
          } catch(e) {}
        }
        setMode('setpin');
      };

      const handlePinSuccess = (u) => { setUser(u); setMode('app'); };
      const handleSetPin = (pin) => {
        localStorage.setItem('bes_pin_user', JSON.stringify({ username: user.id, name: user.name, role: user.role, pin }));
        setMode('app');
      };
      const logout = () => { setUser(null); setTab('home'); setMode('pin'); };
      const fullLogout = () => { localStorage.removeItem('bes_pin_user'); setUser(null); setTab('home'); setMode('login'); };

      if (mode === 'loading') return <div className="min-h-screen flex items-center justify-center" style={{color:'var(--muted)'}}>Loading...</div>;
      if (mode === 'pin') return <PinScreen onSuccess={handlePinSuccess} onUsePassword={() => setMode('login')} onFullLogout={fullLogout} theme={theme} setTheme={setTheme} />;
      if (mode === 'login') return <LoginScreen onLogin={handlePasswordLogin} theme={theme} setTheme={setTheme} />;
      if (mode === 'setpin') return <SetPinScreen onSave={handleSetPin} onSkip={() => setMode('app')} />;

      return (
        <div className="min-h-screen flex flex-col md:flex-row" style={{background:'var(--bg)', color:'var(--text)'}}>

            <div className="mb-8">
              <h1 className="text-lg font-bold">Bes An Noor Model School</h1>
              <p className="text-xs" style={{color:'var(--muted)'}}>(Boys' Unit)</p>
            </div>
            <nav className="flex-1 space-y-1">
              <SideBtn active={tab==='home'} onClick={()=>setTab('home')} icon={<IconHome/>} label="Home"/>
              <SideBtn active={tab==='notices'} onClick={()=>setTab('notices')} icon={<IconClipboard/>} label="Notices"/>
              <SideBtn active={tab==='schedule'} onClick={()=>setTab('schedule')} icon={<IconCalendar/>} label="Proxy / Replace"/>
              <SideBtn active={tab==='report'} onClick={()=>setTab('report')} icon={<IconAlert/>} label="Report Issue"/>
              <SideBtn active={tab==='chat'} onClick={()=>setTab('chat')} icon={<IconChat/>} label="Chat"/>
              <SideBtn active={tab==='results'} onClick={()=>setTab('results')} icon={<IconFile/>} label="Exam Results"/>
              <SideBtn active={tab==='profile'} onClick={()=>setTab('profile')} icon={<IconUser/>} label="Profile"/>
              {user.role==='ADMIN' && <SideBtn active={tab==='users'} onClick={()=>setTab('users')} icon={<IconUsers/>} label="Manage Users"/>}
            </nav>
            <button onClick={logout} className="mt-4 flex items-center gap-2 text-sm" style={{color:'var(--muted)'}}><IconLogOut/> Logout</button>
          </aside>

          <div className="flex-1 flex flex-col min-h-screen">
            <header className="header px-4 py-4 flex justify-between items-center sticky top-0 z-20 md:hidden">
              <div>
                <h1 className="text-base font-bold">Bes An Noor Model School</h1>
                <p className="text-xs" style={{color:'var(--muted)'}}>(Boys' Unit) · {user.name}</p>
              </div>
              <button onClick={logout} className="w-10 h-10 rounded-full flex items-center justify-center" style={{background:'var(--input)'}}><IconLogOut/></button>
            </header>

            <header className="hidden md:flex header px-6 py-4 justify-between items-center sticky top-0 z-20">
              <h2 className="text-lg font-semibold capitalize">{tab==='schedule'?'Proxy / Replace':tab}</h2>
              <div className="text-sm" style={{color:'var(--muted)'}}>{user.name} · {user.role}</div>

            <main className="flex-1 overflow-y-auto px-4 md:px-8 pb-24 md:pb-8 pt-4">

              {tab==='notices' && <Notices user={user}/>}
              {tab==='schedule' && <ScheduleTab user={user}/>}
              {tab==='report' && <ReportTab user={user}/>}
              {tab==='chat' && <ChatTab user={user}/>}
              {tab==='results' && <ResultsTab user={user}/>}
              {tab==='profile' && <Profile user={user} setUser={setUser} setTab={setTab} onFullLogout={fullLogout} theme={theme} setTheme={setTheme}/>}
              {tab==='users' && user.role==='ADMIN' && <Users/>}
            </main>

            <nav className="bottom-nav fixed bottom-0 left-0 right-0 flex justify-around py-2 z-20 md:hidden">

              <NavBtn active={tab==='notices'} onClick={()=>setTab('notices')} icon={<IconClipboard/>} label="Notices"/>
              <NavBtn active={tab==='schedule'} onClick={()=>setTab('schedule')} icon={<IconCalendar/>} label="Proxy"/>
              <NavBtn active={tab==='chat'} onClick={()=>setTab('chat')} icon={<IconChat/>} label="Chat"/>
              <NavBtn active={tab==='profile'} onClick={()=>setTab('profile')} icon={<IconUser/>} label="Profile"/>

    function SideBtn({active, onClick, icon, label}) {
      return <button onClick={onClick} className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm ${active?'bg-red-500/15 text-red-400':'hover:opacity-80'}`} style={{color: active?'':'var(--muted)'}}>{icon} {label}</button>;

      return <button onClick={onClick} className={`flex flex-col items-center gap-0.5 text-[10px] ${active?'text-red-500':''}`} style={{color: active?'':'var(--muted)'}}>{icon}<span>{label}</span></button>;
    }

    // ==================== PIN ====================
    function PinScreen({onSuccess, onUsePassword, onFullLogout, theme, setTheme}) {
      const [pin, setPin] = useState('');
      const [error, setError] = useState('');
      const saved = JSON.parse(localStorage.getItem('bes_pin_user') || '{}');
      const press = (n) => {
        if (pin.length >= 4) return;
        const next = pin + n;
        setPin(next); setError('');
        if (next.length === 4) {
          if (next === saved.pin) onSuccess({id: saved.username, name: saved.name, role: saved.role});
          else { setError('Wrong PIN'); setTimeout(()=>setPin(''), 500); }
        }
      };
      return (
        <div className="min-h-screen flex items-center justify-center p-6">
          <div className="w-full max-w-xs text-center">
            <div className="flex justify-end mb-4">
              <button onClick={() => setTheme(theme==='dark'?'light':'dark')} className="p-2 rounded-full" style={{background:'var(--input)'}}>
                {theme==='dark' ? <IconSun/> : <IconMoon/>}
              </button>
            </div>
            <img src="logo.png" className="w-20 h-20 mx-auto mb-4 object-contain" onError={e=>e.target.style.display='none'}/>
            <h2 className="text-xl font-bold mb-1">Welcome back</h2>
            <p className="mb-8" style={{color:'var(--muted)'}}>{saved.name || 'User'}</p>
            <div className="flex justify-center gap-3 mb-6">{[0,1,2,3].map(i => <div key={i} className={`pin-dot ${pin.length>i?'filled':''}`}></div>)}</div>
            {error && <p className="text-red-400 text-sm mb-4">{error}</p>}
            <div className="grid grid-cols-3 gap-3 mb-8">
              {[1,2,3,4,5,6,7,8,9].map(n => <button key={n} onClick={()=>press(String(n))} className="h-14 rounded-full text-xl font-medium active:scale-95" style={{background:'var(--input)'}}>{n}</button>)}
              <div></div>
              <button onClick={()=>press('0')} className="h-14 rounded-full text-xl font-medium active:scale-95" style={{background:'var(--input)'}}>0</button>
              <button onClick={()=>setPin(pin.slice(0,-1))} className="h-14 rounded-full text-lg active:scale-95" style={{background:'var(--input)'}}>⌫</button>
            </div>
            <button onClick={onUsePassword} className="text-sm underline block w-full mb-3" style={{color:'var(--muted)'}}>Use Password instead</button>
            <button onClick={onFullLogout} className="text-sm text-red-400">Logout Completely</button>
          </div>
        </div>
      );
    }

    function SetPinScreen({onSave, onSkip}) {
      const [pin, setPin] = useState('');
      const [confirm, setConfirm] = useState('');
      const [step, setStep] = useState(1);
      const press = (n) => {
        if (step===1) {
          if (pin.length>=4) return;
          const next = pin+n; setPin(next);
          if (next.length===4) setTimeout(()=>setStep(2), 250);
        } else {
          if (confirm.length>=4) return;
          const next = confirm+n; setConfirm(next);
          if (next.length===4) {
            if (next===pin) onSave(next);
            else { alert('PIN does not match'); setPin(''); setConfirm(''); setStep(1); }
          }
        }
      };
      const current = step===1 ? pin : confirm;
      return (
        <div className="min-h-screen flex items-center justify-center p-6">
          <div className="w-full max-w-xs text-center">
            <h2 className="text-xl font-bold mb-2">{step===1?'Create PIN':'Confirm PIN'}</h2>
            <p className="mb-8" style={{color:'var(--muted)'}}>{step===1?'Set a 4-digit PIN for quick login':'Enter the same PIN again'}</p>
            <div className="flex justify-center gap-3 mb-8">{[0,1,2,3].map(i => <div key={i} className={`pin-dot ${current.length>i?'filled':''}`}></div>)}</div>
            <div className="grid grid-cols-3 gap-3 mb-8">
              {[1,2,3,4,5,6,7,8,9].map(n => <button key={n} onClick={()=>press(String(n))} className="h-14 rounded-full text-xl font-medium active:scale-95" style={{background:'var(--input)'}}>{n}</button>)}
              <div></div>
              <button onClick={()=>press('0')} className="h-14 rounded-full text-xl font-medium active:scale-95" style={{background:'var(--input)'}}>0</button>
              <button onClick={()=> step===1?setPin(pin.slice(0,-1)):setConfirm(confirm.slice(0,-1))} className="h-14 rounded-full text-lg active:scale-95" style={{background:'var(--input)'}}>⌫</button>
            </div>
            <button onClick={onSkip} className="text-sm underline" style={{color:'var(--muted)'}}>Skip for now</button>
          </div>
        </div>
      );
    }

    // ==================== LOGIN ====================
    function LoginScreen({onLogin, theme, setTheme}) {
      const [id, setId] = useState('');
      const [pass, setPass] = useState('');
      const [loading, setLoading] = useState(false);
      const submit = async () => {
        if (!id.trim() || !pass.trim()) return alert('Enter Login ID and Password');
        setLoading(true);
        await onLogin(id, pass);
        setLoading(false);
      };
      return (
        <div className="min-h-screen flex items-center justify-center p-4">
          <div className="w-full max-w-sm">
            <div className="flex justify-end mb-4">
              <button onClick={() => setTheme(theme==='dark'?'light':'dark')} className="flex items-center gap-2 px-3 py-2 rounded-full text-sm" style={{background:'var(--input)'}}>
                {theme==='dark' ? <><IconSun/> Light</> : <><IconMoon/> Dark</>}
              </button>
            </div>
            <div className="text-center mb-8">
              <img src="logo.png" className="w-28 h-28 mx-auto mb-4 object-contain" onError={e=>e.target.style.display='none'}/>
              <h1 className="text-2xl font-bold">Bes An Noor Model School</h1>
              <p className="mt-1" style={{color:'var(--muted)'}}>(Boys' Unit)</p>
            </div>
            <div className="card p-6 space-y-4">
              <input value={id} onChange={e=>setId(e.target.value)} placeholder="Login ID" className="w-full p-3 rounded-xl border" style={{background:'var(--input)', borderColor:'var(--border)', color:'var(--text)'}}/>
              <input type="password" value={pass} onChange={e=>setPass(e.target.value)} placeholder="Password" className="w-full p-3 rounded-xl border" style={{background:'var(--input)', borderColor:'var(--border)', color:'var(--text)'}}/>
              <button onClick={submit} disabled={loading} className="w-full bg-gradient-to-r from-red-500 to-pink-500 text-white font-bold py-3 rounded-xl">{loading?'Please wait...':'Continue'}</button>
            </div>
          </div>
        </div>
      );
    }

    // ==================== CHAT (with Broadcast, Voice, Read Receipt, Mention) ====================
    function ChatTab({user}) {
      const {data, add, update, remove, load} = useCollection('chat_messages');
      const {data: allUsers} = useCollection('users');
      const [message, setMessage] = useState('');
      const [file, setFile] = useState(null);
      const [editId, setEditId] = useState(null);
      const [isBroadcast, setIsBroadcast] = useState(false);
      const [recording, setRecording] = useState(false);
      const [mediaRecorder, setMediaRecorder] = useState(null);
      const [showMentions, setShowMentions] = useState(false);
      const [mentionFilter, setMentionFilter] = useState('');
      const bottomRef = useRef();
      const chunksRef = useRef([]);

      useEffect(() => { bottomRef.current?.scrollIntoView({behavior:'smooth'}); }, [data]);

      // Mark messages as read when chat opens
      useEffect(() => {
        data.forEach(m => {
          if (m.sender_name !== user.name) {
            const readBy = m.read_by || [];
            if (!readBy.includes(user.name)) {
              update(m.id, { read_by: [...readBy, user.name] });
            }
          }
        });
      }, [data.length]);

      const startRecording = async () => {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          const recorder = new MediaRecorder(stream);
          chunksRef.current = [];
          recorder.ondataavailable = e => chunksRef.current.push(e.data);
          recorder.onstop = async () => {
            const blob = new Blob(chunksRef.current, { type: 'audio/webm' });
            const audioFile = new File([blob], 'voice.webm', { type: 'audio/webm' });
            const url = await uploadFile(audioFile);
            if (url) {
              add({
                sender_name: user.name,
                sender_role: user.role,
                message: '',
                file_url: url,
                is_voice: true,
                is_broadcast: isBroadcast,
                read_by: [user.name]
              });
            }
            stream.getTracks().forEach(t => t.stop());
          };
          recorder.start();
          setMediaRecorder(recorder);
          setRecording(true);
        } catch (e) {
          alert('Microphone permission needed');
        }
      };

      const stopRecording = () => {
        if (mediaRecorder) {
          mediaRecorder.stop();
          setRecording(false);
          setMediaRecorder(null);
        }
      };

      const send = async () => {
        if (!message.trim() && !file && !editId) return;
        let file_url = null;
        if (file) {
          file_url = await uploadFile(file);
          if (!file_url) return;
        }
        if (editId) {
          update(editId, { message: message.trim(), ...(file_url && {file_url}) });
          setEditId(null);
        } else {
          add({
            sender_name: user.name,
            sender_role: user.role,
            message: message.trim(),
            file_url,
            is_broadcast: isBroadcast,
            read_by: [user.name]
          });
        }
        setMessage('');
        setFile(null);
        setIsBroadcast(false);
      };

      const handleInput = (val) => {
        setMessage(val);
        const lastWord = val.split(' ').pop();
        if (lastWord.startsWith('@')) {
          setMentionFilter(lastWord.slice(1).toLowerCase());
          setShowMentions(true);
        } else {
          setShowMentions(false);
        }
      };

      const insertMention = (name) => {
        const words = message.split(' ');
        words[words.length - 1] = '@' + name;
        setMessage(words.join(' ') + ' ');
        setShowMentions(false);
      };

      const isImage = url => url && /\.(jpeg|jpg|png|gif|webp)$/i.test(url);
      const isPdf = url => url && /\.pdf$/i.test(url);
      const isVoice = (m) => m.is_voice || (m.file_url && m.file_url.includes('.webm'));

      const getReceipt = (m) => {
        if (m.sender_name !== user.name) return null;
        const readBy = m.read_by || [];
        if (readBy.length > 1) return <span className="text-blue-400 text-xs ml-1">✓✓</span>;
        return <span className="text-gray-400 text-xs ml-1">✓</span>;
      };

      return (
        <div className="space-y-4 max-w-3xl">
          <h2 className="text-2xl font-bold">Staff Chat</h2>

          <div className="card p-4 chat-box space-y-3">
            {data.slice().reverse().map(m => {
              const canEdit = user.role==='ADMIN' || m.sender_name===user.name;
              return (
                <div key={m.id} className={`flex ${m.sender_name===user.name?'justify-end':'justify-start'}`}>
                  <div className={`max-w-[80%] rounded-2xl px-4 py-2 relative ${m.is_broadcast ? 'broadcast-badge text-white' : (m.sender_name===user.name ? 'bg-red-500/20' : '')}`} style={!m.is_broadcast && m.sender_name!==user.name ? {background:'var(--input)'} : {}}>
                    {m.is_broadcast && <div className="text-xs font-bold mb-1 opacity-90">📢 OFFICIAL BROADCAST</div>}
                    <div className="flex justify-between gap-3 mb-1">
                      <span className={`text-xs font-medium ${m.is_broadcast?'text-white':'text-red-400'}`}>{m.sender_name} · {m.sender_role}</span>
                      <div className="flex gap-2 items-center">
                        {getReceipt(m)}
                        {canEdit && <button onClick={()=>{setEditId(m.id); setMessage(m.message||'');}} className="text-xs opacity-70">Edit</button>}
                        {user.role==='ADMIN' && <button onClick={()=>confirm('Delete?')&&remove(m.id)} className="text-xs opacity-70">Delete</button>}
                      </div>
                    </div>
                    {m.message && <p className="text-sm">{linkifyAndMention(m.message)}</p>}
                    {isVoice(m) && m.file_url && (
                      <audio controls src={m.file_url} className="mt-2 w-full max-w-xs" style={{height:36}}/>
                    )}
                    {m.file_url && isImage(m.file_url) && (
                      <img src={m.file_url} className="mt-2 rounded-xl max-h-60 object-cover cursor-pointer" onClick={()=>window.open(m.file_url)}/>
                    )}
                    {m.file_url && isPdf(m.file_url) && (
                      <a href={m.file_url} target="_blank" className="mt-2 flex items-center gap-2 p-3 rounded-xl" style={{background:'rgba(0,0,0,0.2)'}}>
                        <span>📄</span><div><p className="text-sm font-medium">PDF Document</p><p className="text-xs opacity-70">Tap to open</p></div>
                      </a>
                    )}
                  </div>
                </div>
              );
            })}
            <div ref={bottomRef}></div>
          </div>

          {/* Mention suggestions */}
          {showMentions && (
            <div className="card p-2 max-h-40 overflow-y-auto">
              {allUsers.filter(u => u.full_name.toLowerCase().includes(mentionFilter)).slice(0,6).map(u => (
                <button key={u.id} onClick={()=>insertMention(u.full_name.split(' ')[0])} className="w-full text-left px-3 py-2 rounded-lg text-sm hover:bg-red-500/10">
                  @{u.full_name}
                </button>
              ))}
            </div>
          )}

          <div className="card p-3 space-y-2">
            {editId && <p className="text-xs text-yellow-400">Editing message...</p>}
            {user.role==='ADMIN' && (
              <label className="flex items-center gap-2 text-sm">
                <input type="checkbox" checked={isBroadcast} onChange={e=>setIsBroadcast(e.target.checked)}/>
                <span>📢 Send as Official Broadcast</span>
              </label>
            )}
            <div className="flex gap-2 items-center">
              <input value={message} onChange={e=>handleInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&send()} placeholder="Type a message... (@ to mention)" className="flex-1 p-3 rounded-xl" style={{background:'var(--input)'}}/>
              <button onClick={recording ? stopRecording : startRecording} className={`p-3 rounded-xl ${recording?'bg-red-500 text-white':'bg-gray-600 text-white'}`}>
                <IconMic/>
              </button>
              <button onClick={send} className="bg-gradient-to-r from-red-500 to-pink-500 text-white px-5 rounded-xl font-semibold">{editId?'Update':'Send'}</button>
            </div>
            <input type="file" accept=".pdf,.jpg,.jpeg,.png" onChange={e=>setFile(e.target.files[0])} className="text-sm"/>
            {recording && <p className="text-xs text-red-400 animate-pulse">Recording... Tap mic again to stop</p>}
          </div>
        </div>
      );
    }

    // ==================== RESULTS ====================
    function ResultsTab({user}) {
      const {data, add, update, remove} = useCollection('exam_results');
      const [show, setShow] = useState(false);
      const [title, setTitle] = useState('');
      const [desc, setDesc] = useState('');
      const [file, setFile] = useState(null);
      const isAdmin = user.role==='ADMIN';
      const save = async () => {
        if (!title) return alert('Title required');
        let file_url = file ? await uploadFile(file) : null;
        if (file && !file_url) return;
        add({title, description:desc, file_url, uploaded_by:user.name});
        setShow(false); setTitle(''); setDesc(''); setFile(null);
      };
      return (
        <div className="space-y-5 max-w-3xl">
          <div className="flex justify-between items-center">
            <h2 className="text-2xl font-bold">Exam Results</h2>
            {isAdmin && <button onClick={()=>setShow(!show)} className="bg-red-500/15 text-red-400 px-4 py-2 rounded-full text-sm font-semibold flex items-center gap-2"><IconPlus/> Upload</button>}
          </div>
          {show && isAdmin && (
            <div className="card p-5 space-y-3">
              <input value={title} onChange={e=>setTitle(e.target.value)} placeholder="Title" className="w-full p-3 rounded-xl" style={{background:'var(--input)'}}/>
              <textarea value={desc} onChange={e=>setDesc(e.target.value)} placeholder="Description" className="w-full p-3 rounded-xl min-h-[80px]" style={{background:'var(--input)'}}/>
              <input type="file" accept=".pdf,.jpg,.jpeg,.png" onChange={e=>setFile(e.target.files[0])} className="text-sm"/>
              <button onClick={save} className="w-full bg-gradient-to-r from-red-500 to-pink-500 text-white py-3 rounded-xl font-bold">Upload</button>
            </div>
          )}
          {data.map(r => (
            <div key={r.id} className="card p-5 border-l-4 border-blue-500">
              <h3 className="font-bold text-lg">{r.title}</h3>
              <p className="text-xs" style={{color:'var(--muted)'}}>By {r.uploaded_by}</p>
              {r.description && <p className="text-sm mt-2">{linkifyAndMention(r.description)}</p>}
              {r.file_url && <a href={r.file_url} target="_blank" className="text-blue-400 text-sm flex items-center gap-1 mt-2"><IconFile/> View File</a>}
            </div>
          ))}
        </div>
      );
    }

    // ==================== PROFILE ====================
    function Profile({user, setUser, setTab, onFullLogout, theme, setTheme}) {
      const [showEdit, setShowEdit] = useState(false);
      const [newId, setNewId] = useState(user.id);
      const [newPass, setNewPass] = useState('');
      const [confirmPass, setConfirmPass] = useState('');
      const save = async () => {
        if (!newId.trim()) return alert('Login ID required');
        const updates = {};
        if (newId.trim() !== user.id) updates.username = newId.trim();
        if (newPass) {
          if (newPass.length < 4) return alert('Min 4 characters');
          if (newPass !== confirmPass) return alert('Passwords do not match');
          updates.password = newPass.trim();
        }
        if (Object.keys(updates).length === 0) { setShowEdit(false); return; }
        const {error} = await supabase.from('users').update(updates).eq('username', user.id);
        if (error) alert(error.message);
        else {
          alert('Updated!');
          setUser({...user, id: updates.username || user.id});
          setShowEdit(false); setNewPass(''); setConfirmPass('');
        }
      };
      return (
        <div className="space-y-5 max-w-lg">
          <h2 className="text-2xl font-bold">My Profile</h2>
          <div className="card p-6 space-y-5">
            <div><p className="text-xs" style={{color:'var(--muted)'}}>Full Name</p><p className="font-medium text-lg">{user.name}</p></div>
            <div><p className="text-xs" style={{color:'var(--muted)'}}>Role</p><p className="font-medium">{user.role}</p></div>
            <div><p className="text-xs" style={{color:'var(--muted)'}}>Login ID</p><p className="font-medium text-red-400 text-lg">{user.id}</p></div>
            <div className="pt-4 border-t space-y-3" style={{borderColor:'var(--border)'}}>
              <button onClick={() => setTheme(theme==='dark'?'light':'dark')} className="w-full py-3 rounded-xl text-sm flex items-center justify-center gap-2" style={{background:'var(--input)'}}>
                {theme==='dark' ? <><IconSun/> Switch to Light Mode</> : <><IconMoon/> Switch to Dark Mode</>}
              </button>
              {!showEdit ? (
                <button onClick={()=>setShowEdit(true)} className="w-full py-3 rounded-xl text-sm" style={{background:'var(--input)'}}>Change Login ID / Password</button>
              ) : (
                <div className="space-y-3">
                  <input value={newId} onChange={e=>setNewId(e.target.value)} className="w-full p-3 rounded-xl" style={{background:'var(--input)'}}/>
                  <input type="password" value={newPass} onChange={e=>setNewPass(e.target.value)} placeholder="New Password (optional)" className="w-full p-3 rounded-xl" style={{background:'var(--input)'}}/>
                  {newPass && <input type="password" value={confirmPass} onChange={e=>setConfirmPass(e.target.value)} placeholder="Confirm" className="w-full p-3 rounded-xl" style={{background:'var(--input)'}}/>}
                  <div className="flex gap-3">
                    <button onClick={save} className="flex-1 bg-gradient-to-r from-red-500 to-pink-500 text-white py-3 rounded-xl font-semibold">Save</button>
                    <button onClick={()=>setShowEdit(false)} className="px-5 rounded-xl" style={{background:'var(--input)'}}>Cancel</button>
                  </div>
                </div>
              )}
              {user.role==='ADMIN' && <button onClick={()=>setTab('users')} className="w-full bg-red-500/15 text-red-400 py-3 rounded-xl text-sm flex items-center justify-center gap-2"><IconUsers/> Manage Users</button>}
              <button onClick={onFullLogout} className="w-full bg-red-500/10 text-red-400 py-3 rounded-xl text-sm">Logout Completely (Clear PIN)</button>
            </div>
          </div>
        </div>
      );
    }

    // ==================== USERS ====================
    function Users() {
      const {data, add, remove} = useCollection('users');
      const [show, setShow] = useState(false);
      const [form, setForm] = useState({username:'', password:'', full_name:'', role:'TEACHER'});
      return (
        <div className="space-y-5 max-w-3xl">
          <div className="flex justify-between items-center">
            <h2 className="text-2xl font-bold">Manage Users</h2>
            <button onClick={()=>setShow(!show)} className="bg-red-500/15 text-red-400 px-4 py-2 rounded-full text-sm font-semibold flex items-center gap-2"><IconPlus/> Create</button>
          </div>
          {show && (
            <div className="card p-5 space-y-3">
              <input placeholder="Full Name" className="w-full p-3 rounded-xl" style={{background:'var(--input)'}} value={form.full_name} onChange={e=>setForm({...form,full_name:e.target.value})}/>
              <input placeholder="Login ID" className="w-full p-3 rounded-xl" style={{background:'var(--input)'}} value={form.username} onChange={e=>setForm({...form,username:e.target.value})}/>
              <input placeholder="Temporary Password" className="w-full p-3 rounded-xl" style={{background:'var(--input)'}} value={form.password} onChange={e=>setForm({...form,password:e.target.value})}/>
              <select className="w-full p-3 rounded-xl" style={{background:'var(--input)'}} value={form.role} onChange={e=>setForm({...form,role:e.target.value})}>
                <option value="TEACHER">Teacher</option><option value="DOCTOR">Doctor</option><option value="MAINTENANCE">Maintenance</option><option value="ADMIN">Admin</option>
              </select>
              <button onClick={()=>{if(form.username&&form.password&&form.full_name){add(form); setShow(false); setForm({username:'',password:'',full_name:'',role:'TEACHER'}); alert('Created!');} else alert('Fill all');}} className="w-full bg-gradient-to-r from-red-500 to-pink-500 text-white py-3 rounded-xl font-bold">Create Login ID</button>
            </div>
          )}
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
            {data.map(u => (
              <div key={u.id} className="card p-4 flex justify-between items-center">
                <div><p className="font-medium">{u.full_name}</p><p className="text-xs" style={{color:'var(--muted)'}}>{u.role}</p></div>
                <button onClick={()=>confirm(`Delete ${u.full_name}?`)&&remove(u.id)} className="text-red-400 p-2"><IconTrash/></button>
              </div>
            ))}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
