  <style>
    :root {
      --bg: #000000;
      --text: #f5f5f7;
      --text-secondary: #a1a1a6;
      --card: rgba(28, 28, 30, 0.72);
      --card-border: rgba(255, 255, 255, 0.08);
      --input: rgba(44, 44, 46, 0.8);
      --accent: #0071e3;
      --danger: #ff453a;
      --success: #30d158;
      --warning: #ff9f0a;
    }
    body.light {
      --bg: #f5f5f7;
      --text: #1d1d1f;
      --text-secondary: #6e6e73;
      --card: rgba(255, 255, 255, 0.72);
      --card-border: rgba(0, 0, 0, 0.06);
      --input: rgba(255, 255, 255, 0.9);
    }
    * { box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .glass {
      background: var(--card);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid var(--card-border);
      border-radius: 20px;
    }
    .glass-input {
      background: var(--input);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      color: var(--text);
    }
    .header-glass {
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-bottom: 1px solid var(--card-border);
    }
    body.light .header-glass {
      background: rgba(255,255,255,0.75);
    }
    .nav-glass {
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border-top: 1px solid var(--card-border);
    }
    body.light .nav-glass {
      background: rgba(255,255,255,0.8);
    }
    .pin-dot {
      width: 14px; height: 14px; border-radius: 50%;
      border: 2px solid var(--text-secondary);
      display: inline-block;
    }
    .pin-dot.filled {
      background: var(--accent);
      border-color: var(--accent);
    }
    .mention { color: var(--accent); font-weight: 600; }
    .icon { display: inline-flex; align-items: center; justify-content: center; }
    .icon svg {
      width: 20px; height: 20px;
      stroke: currentColor; fill: none;
      stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
    }
    .chat-wrapper {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 128px);
    }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
    }
    .chat-input-bar {
      padding: 10px 12px 12px;
      border-top: 1px solid var(--card-border);
      background: var(--card);
      backdrop-filter: blur(20px);
    }
    .btn-primary {
      background: linear-gradient(180deg, #0077ed, #0071e3);
      color: white;
      border-radius: 980px;
      font-weight: 600;
    }
    .btn-primary:active { opacity: 0.85; }
    .text-secondary { color: var(--text-secondary); }
  </style>
</head>

    function formatDate(dateStr) {
      if (!dateStr) return '';
      try {
        const parts = dateStr.split('-');
        if (parts.length !== 3) return dateStr;
        return parts[2] + '/' + parts[1] + '/' + parts[0];
      } catch (e) {
        return dateStr;
      }
    }

    function formatTime(timeStr) {
      if (!timeStr) return '';
      try {
        const parts = timeStr.split(':');
        let hour = parseInt(parts[0], 10);
        const minute = parts[1] || '00';
        const ampm = hour >= 12 ? 'PM' : 'AM';
        hour = hour % 12;
        if (hour === 0) hour = 12;
        return hour + ':' + minute + ' ' + ampm;
      } catch (e) {
        return timeStr;
      }
    }

    function useCollection(table) {
      const [data, setData] = useState([]);
      const load = useCallback(async () => {
        const { data: rows } = await supabase.from(table).select('*').order('created_at', { ascending: false });
        setData(rows || []);
      }, [table]);
      useEffect(() => {
        load();
        const ch = supabase.channel(table).on('postgres_changes', { event: '*', schema: 'public', table }, load).subscribe();
        return () => supabase.removeChannel(ch);
      }, [table, load]);
      const add = async (row) => {
        const { error } = await supabase.from(table).insert([row]);
        if (error) alert(error.message); else load();
      };
      const update = async (id, changes) => {
        const { error } = await supabase.from(table).update(changes).eq('id', id);
        if (error) alert(error.message); else load();
      };
      const remove = async (id) => {
        const { error } = await supabase.from(table).delete().eq('id', id);
        if (error) alert(error.message); else load();
      };
      return { data, add, update, remove };
    }

    async function uploadFile(file) {
      if (!file) return null;
      const ext = file.name ? file.name.split('.').pop() : 'webm';
      const name = Date.now() + '_' + Math.random().toString(36).slice(2, 8) + '.' + ext;
      const { error } = await supabase.storage.from('school-files').upload(name, file);
      if (error) { alert('Upload failed: ' + error.message); return null; }
      const { data } = supabase.storage.from('school-files').getPublicUrl(name);
      return data.publicUrl;
    }

    function linkify(text) {
      if (!text) return text;
      return text.split(/(@\w+|https?:\/\/[^\s]+)/g).map((part, i) => {
        if (part.startsWith('@')) return <span key={i} className="mention">{part}</span>;
        if (part.startsWith('http')) return <a key={i} href={part} target="_blank" rel="noopener noreferrer" className="underline" style={{color:'var(--accent)'}}>{part}</a>;
        return part;
      });
    }

    function App() {
      const [user, setUser] = useState(null);
      const [tab, setTab] = useState('home');
      const [mode, setMode] = useState('loading');
      const [theme, setTheme] = useState(() => localStorage.getItem('bes_theme') || 'dark');

      useEffect(() => {
        document.body.className = theme === 'light' ? 'light' : '';
        localStorage.setItem('bes_theme', theme);
      }, [theme]);

      useEffect(() => {
        try {
          const saved = localStorage.getItem('bes_pin_user');
          if (saved) {
            const p = JSON.parse(saved);
            if (p && p.pin) { setMode('pin'); return; }
          }
        } catch (e) {}
        setMode('login');
      }, []);

      const handleLogin = async (username, password) => {
        const { data, error } = await supabase.from('users').select('*').eq('username', username.trim()).eq('password', password.trim()).maybeSingle();
        if (error) return alert(error.message);
        if (!data) return alert('Invalid Login ID or Password');
        const u = { id: data.username, name: data.full_name, role: data.role };
        setUser(u);
        try {
          const saved = localStorage.getItem('bes_pin_user');
          if (saved) {
            const p = JSON.parse(saved);
            if (p.username === data.username && p.pin) { setMode('app'); return; }
          }
        } catch (e) {}
        setMode('setpin');
      };

      const handlePinSuccess = (u) => { setUser(u); setMode('app'); };
      const handleSetPin = (pin) => {
        localStorage.setItem('bes_pin_user', JSON.stringify({ username: user.id, name: user.name, role: user.role, pin }));
        setMode('app');
      };
      const logout = () => { setUser(null); setTab('home'); setMode('pin'); };
      const fullLogout = () => { localStorage.removeItem('bes_pin_user'); setUser(null); setTab('home'); setMode('login'); };

            {tab === 'notices' && <Notices user={user} />}
            {tab === 'schedule' && <ScheduleTab user={user} />}

            {tab === 'chat' && <ChatTab user={user} />}
            {tab === 'results' && <ResultsTab user={user} />}
            {tab === 'profile' && <Profile user={user} setTab={setTab} onFullLogout={fullLogout} theme={theme} setTheme={setTheme} />}
            {tab === 'users' && user.role === 'ADMIN' && <Users />}

    function PinScreen({ onSuccess, onUsePassword, onFullLogout, theme, setTheme }) {
      const [pin, setPin] = useState('');
      const [error, setError] = useState('');
      let saved = {};
      try { saved = JSON.parse(localStorage.getItem('bes_pin_user') || '{}'); } catch(e) {}

      const press = (n) => {
        if (pin.length >= 4) return;
        const next = pin + n;
        setPin(next);
        setError('');
        if (next.length === 4) {
          if (next === saved.pin) onSuccess({ id: saved.username, name: saved.name, role: saved.role });
          else { setError('Wrong PIN'); setTimeout(() => setPin(''), 400); }
        }
      };

      return (
        <div className="min-h-screen flex items-center justify-center p-6">
          <div className="w-full max-w-xs text-center">
            <div className="flex justify-end mb-6">
              <button onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')} className="w-10 h-10 rounded-full glass flex items-center justify-center">
                {theme === 'dark' ? <IconSun /> : <IconMoon />}
              </button>
            </div>
            <img src="logo.png" alt="Logo" className="w-20 h-20 mx-auto mb-5 object-contain" onError={e => e.target.style.display='none'} />
            <h2 className="text-2xl font-semibold tracking-tight mb-1">Welcome back</h2>
            <p className="text-secondary mb-8">{saved.name || 'User'}</p>
            <div className="flex justify-center gap-3 mb-8">
              {[0,1,2,3].map(i => <div key={i} className={`pin-dot ${pin.length > i ? 'filled' : ''}`}></div>)}

            {error && <p className="text-[var(--danger)] text-sm mb-4">{error}</p>}
            <div className="grid grid-cols-3 gap-3 mb-8">
              {[1,2,3,4,5,6,7,8,9].map(n => (
                <button key={n} onClick={() => press(String(n))} className="h-14 rounded-full text-xl glass active:scale-95 transition-transform">{n}</button>
              ))}
              <div></div>
              <button onClick={() => press('0')} className="h-14 rounded-full text-xl glass active:scale-95">0</button>
              <button onClick={() => setPin(pin.slice(0,-1))} className="h-14 rounded-full text-lg glass active:scale-95">⌫</button>
            </div>
            <button onClick={onUsePassword} className="text-sm text-secondary underline block w-full mb-3">Use Password</button>
            <button onClick={onFullLogout} className="text-sm" style={{color:'var(--danger)'}}>Logout Completely</button>
          </div>
        </div>
      );
    }

    function SetPinScreen({ onSave, onSkip }) {
      const [pin, setPin] = useState('');
      const [confirm, setConfirm] = useState('');
      const [step, setStep] = useState(1);
      const press = (n) => {
        if (step === 1) {
          if (pin.length >= 4) return;
          const next = pin + n; setPin(next);
          if (next.length === 4) setTimeout(() => setStep(2), 200);
        } else {
          if (confirm.length >= 4) return;
          const next = confirm + n; setConfirm(next);
          if (next.length === 4) {
            if (next === pin) onSave(next);
            else { alert('PIN does not match'); setPin(''); setConfirm(''); setStep(1); }
          }
        }
      };
      const current = step === 1 ? pin : confirm;
      return (
        <div className="min-h-screen flex items-center justify-center p-6">
          <div className="w-full max-w-xs text-center">
            <h2 className="text-2xl font-semibold mb-2">{step === 1 ? 'Create PIN' : 'Confirm PIN'}</h2>

            <div className="flex justify-center gap-3 mb-8">

    function LoginScreen({ onLogin, theme, setTheme }) {

      const [pass, setPass] = useState('');
      const [loading, setLoading] = useState(false);
      const submit = async () => {

              <button onClick={submit} disabled={loading} className="w-full btn-primary py-3.5 text-[15px]">
                {loading ? 'Please wait...' : 'Continue'}

            </div>

    function Home({ user, setTab }) {
      const { data: attendance, add, update } = useCollection('attendance');
      const today = new Date().toISOString().split('T')[0];
      const mine = attendance.find(a => a.date === today && a.teacher_id === user.id);
      const todayList = attendance.filter(a => a.date === today);
      const [showForm, setShowForm] = useState(false);
      const [form, setForm] = useState({ reason: '', from_date: today, to_date: '', leave_time: 'Morning', return_date: '', return_time: '' });

      const markPresent = () => {
        if (mine) update(mine.id, { status: 'PRESENT', reason: null, from_date: null, to_date: null, leave_time: null, return_date: null, return_time: null });
        else add({ date: today, teacher_id: user.id, name: user.name, status: 'PRESENT' });

    function ChatTab({ user }) {
      const { data, add, remove } = useCollection('chat_messages');
      const { data: allUsers } = useCollection('users');
      const [message, setMessage] = useState('');
      const [file, setFile] = useState(null);
      const [isBroadcast, setIsBroadcast] = useState(false);
      const [recording, setRecording] = useState(false);
      const [showMentions, setShowMentions] = useState(false);
      const [mentionFilter, setMentionFilter] = useState('');
      const bottomRef = useRef();
      const fileRef = useRef();
      const recorderRef = useRef(null);
      const chunksRef = useRef([]);

      useEffect(() => { bottomRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [data]);

      const startRec = async () => {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          const rec = new MediaRecorder(stream);
          chunksRef.current = [];
          rec.ondataavailable = e => chunksRef.current.push(e.data);
          rec.onstop = async () => {
            const blob = new Blob(chunksRef.current, { type: 'audio/webm' });
            const f = new File([blob], 'voice.webm', { type: 'audio/webm' });
            const url = await uploadFile(f);
            if (url) add({ sender_name: user.name, sender_role: user.role, message: '', file_url: url, is_voice: true, is_broadcast: isBroadcast });
            stream.getTracks().forEach(t => t.stop());
          };
          rec.start(); recorderRef.current = rec; setRecording(true);
        } catch (e) { alert('Microphone permission needed'); }
      };
      const stopRec = () => { if (recorderRef.current) { recorderRef.current.stop(); setRecording(false); recorderRef.current = null; } };

      const send = async () => {
        if (!message.trim() && !file) return;
        let file_url = file ? await uploadFile(file) : null;
        if (file && !file_url) return;
        add({ sender_name: user.name, sender_role: user.role, message: message.trim(), file_url, is_broadcast: isBroadcast });
        setMessage(''); setFile(null); setIsBroadcast(false);
      };

      const handleInput = (val) => {
        setMessage(val);
        const last = val.split(' ').pop();
        if (last.startsWith('@')) { setMentionFilter(last.slice(1).toLowerCase()); setShowMentions(true); }
        else setShowMentions(false);
      };
      const insertMention = (name) => {
        const words = message.split(' ');
        words[words.length - 1] = '@' + name;
        setMessage(words.join(' ') + ' ');
        setShowMentions(false);
      };

      return (
        <div className="chat-wrapper">
          <div className="chat-messages space-y-3">
            {data.slice().reverse().map(m => (
              <div key={m.id} className={`flex ${m.sender_name === user.name ? 'justify-end' : 'justify-start'}`}>
                <div className={`max-w-[82%] rounded-2xl px-4 py-2.5 ${m.is_broadcast ? 'text-white' : ''}`} style={{
                  background: m.is_broadcast ? 'linear-gradient(135deg,#0071e3,#00c7be)' : m.sender_name === user.name ? 'rgba(0,113,227,0.18)' : 'var(--card)',
                  border: m.is_broadcast ? 'none' : '1px solid var(--card-border)'
                }}>
                  {m.is_broadcast && <div className="flex items-center gap-1 text-xs font-semibold mb-1 opacity-90"><IconMegaphone /> OFFICIAL BROADCAST</div>}
                  <div className="text-[11px] opacity-70 mb-1">{m.sender_name} · {m.sender_role}</div>
                  {m.message && <p className="text-sm leading-relaxed">{linkify(m.message)}</p>}
                  {m.is_voice && m.file_url && <audio controls src={m.file_url} className="mt-2 w-full max-w-xs" style={{height:36}} />}
                  {m.file_url && !m.is_voice && /\.(jpg|jpeg|png|gif|webp)$/i.test(m.file_url) && (
                    <img src={m.file_url} className="mt-2 rounded-xl max-h-56 object-cover cursor-pointer" onClick={() => window.open(m.file_url)} />
                  )}
                  {m.file_url && /\.pdf$/i.test(m.file_url) && (
                    <a href={m.file_url} target="_blank" className="mt-2 flex items-center gap-2 text-sm"><IconFile /> PDF Document</a>
                  )}
                  {user.role === 'ADMIN' && <button onClick={() => confirm('Delete?') && remove(m.id)} className="text-[11px] opacity-50 mt-1 block">Delete</button>}
                </div>
              </div>
            ))}
            <div ref={bottomRef}></div>
          </div>

          {showMentions && (
            <div className="mx-4 mb-2 glass p-2 max-h-28 overflow-y-auto">
              {allUsers.filter(u => u.full_name.toLowerCase().includes(mentionFilter)).slice(0,5).map(u => (
                <button key={u.id} onClick={() => insertMention(u.full_name.split(' ')[0])} className="block w-full text-left px-3 py-2 text-sm rounded-lg hover:opacity-80">
                  @{u.full_name}
                </button>
              ))}
            </div>
          )}

          <div className="chat-input-bar">
            {user.role === 'ADMIN' && (
              <label className="flex items-center gap-2 text-sm mb-2">
                <input type="checkbox" checked={isBroadcast} onChange={e => setIsBroadcast(e.target.checked)} />
                <span className="flex items-center gap-1"><IconMegaphone /> Official Broadcast</span>
              </label>
            )}
            {file && (
              <div className="text-xs text-secondary mb-1.5 flex items-center gap-2">
                <IconPaperclip /> {file.name}
                <button onClick={() => setFile(null)} style={{color:'var(--danger)'}}>✕</button>
              </div>
            )}
            <div className="flex gap-2 items-center">
              <input
                value={message}
                onChange={e => handleInput(e.target.value)}
                onKeyDown={e => e.key === 'Enter' && send()}
                placeholder="Message... (@name)"
                className="flex-1 p-3 rounded-full glass-input text-sm"
              />
              <button onClick={() => fileRef.current.click()} className="w-10 h-10 rounded-full glass flex items-center justify-center flex-shrink-0">
                <IconPaperclip />
              </button>
              <input ref={fileRef} type="file" accept=".pdf,.jpg,.jpeg,.png" className="hidden" onChange={e => setFile(e.target.files[0])} />
              <button
                onClick={recording ? stopRec : startRec}
                className={`w-10 h-10 rounded-full flex items-center justify-center flex-shrink-0 ${recording ? 'text-white' : 'glass'}`}
                style={recording ? {background:'var(--danger)'} : {}}
              >
                <IconMic />
              </button>
              <button onClick={send} className="btn-primary px-5 py-2.5 text-sm flex-shrink-0">
                Send
              </button>
            </div>
            {recording && (
              <p className="text-xs mt-1.5 animate-pulse" style={{color:'var(--danger)'}}>
                Recording... tap mic to stop
              </p>
            )}
          </div>
        </div>
      );
    }

            )}
          </div>
          {show && user.role === 'ADMIN' && (
            <div className="glass p-5 space-y-3">
              <input value={title} onChange={e => setTitle(e.target.value)} placeholder="Title" className="w-full p-3.5 glass-input" />
              <textarea value={desc} onChange={e => setDesc(e.target.value)} placeholder="Description" className="w-full p-3.5 glass-input" rows={3} />
              <button onClick={() => fileRef.current.click()} className="flex items-center gap-2 px-4 py-2.5 rounded-xl glass text-sm">
                <IconPaperclip /> {file ? file.name : 'Attach file'}
              </button>
              <input ref={fileRef} type="file" accept=".pdf,.jpg,.jpeg,.png" className="hidden" onChange={e => setFile(e.target.files[0])} />
              <button onClick={save} className="w-full btn-primary py-3.5">Upload</button>
            </div>
          )}
          {data.map(r => (
            <div key={r.id} className="glass p-5" style={{borderLeft: '4px solid var(--accent)'}}>
              <h3 className="font-semibold text-lg">{r.title}</h3>
              <p className="text-xs text-secondary">By {r.uploaded_by}</p>
              {r.description && <p className="text-sm mt-2">{linkify(r.description)}</p>}
              {r.file_url && <a href={r.file_url} target="_blank" className="text-sm mt-2 flex items-center gap-1" style={{color:'var(--accent)'}}><IconFile /> View File</a>}
              {user.role === 'ADMIN' && <button onClick={() => confirm('Delete?') && remove(r.id)} className="text-xs mt-2" style={{color:'var(--danger)'}}>Delete</button>}
            </div>
          ))}
        </div>
      );
    }

    function Profile({ user, setTab, onFullLogout, theme, setTheme }) {
      return (
        <div className="space-y-5 px-1">
          <h2 className="text-xl font-semibold tracking-tight">My Profile</h2>
          <div className="glass p-6 space-y-5">
            <div>
              <p className="text-xs text-secondary mb-0.5">Name</p>
              <p className="font-medium text-lg">{user.name}</p>
            </div>
            <div>
              <p className="text-xs text-secondary mb-0.5">Role</p>
              <p className="font-medium">{user.role}</p>
            </div>
            <div>
              <p className="text-xs text-secondary mb-0.5">Login ID</p>
              <p className="font-medium" style={{color:'var(--accent)'}}>{user.id}</p>
            </div>
            <button onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')} className="w-full py-3.5 rounded-2xl glass text-sm flex items-center justify-center gap-2">
              {theme === 'dark' ? <><IconSun /> Switch to Light Mode</> : <><IconMoon /> Switch to Dark Mode</>}
            </button>
            {user.role === 'ADMIN' && (
              <button onClick={() => setTab('users')} className="w-full py-3.5 rounded-2xl text-sm flex items-center justify-center gap-2" style={{background:'rgba(0,113,227,0.12)', color:'var(--accent)'}}>
                <IconUsers /> Manage Users
              </button>
            )}
            <button onClick={onFullLogout} className="w-full py-3.5 rounded-2xl text-sm" style={{background:'rgba(255,69,58,0.1)', color:'var(--danger)'}}>
              Logout Completely (Clear PIN)
            </button>
          </div>
        </div>
      );
    }

    function Users() {
      const { data, add, remove } = useCollection('users');
      const [show, setShow] = useState(false);
      const [form, setForm] = useState({ username: '', password: '', full_name: '', role: 'TEACHER' });

      return (
        <div className="space-y-5 px-1">
          <div className="flex justify-between items-center">
            <h2 className="text-xl font-semibold tracking-tight">Manage Users</h2>
            <button onClick={() => setShow(!show)} className="btn-primary px-4 py-2 text-sm flex items-center gap-1.5">
              <IconPlus /> Create
            </button>
          </div>
          {show && (
            <div className="glass p-5 space-y-3">
              <input placeholder="Full Name" className="w-full p-3.5 glass-input" value={form.full_name} onChange={e => setForm({...form, full_name: e.target.value})} />
              <input placeholder="Login ID" className="w-full p-3.5 glass-input" value={form.username} onChange={e => setForm({...form, username: e.target.value})} />
              <input placeholder="Password" className="w-full p-3.5 glass-input" value={form.password} onChange={e => setForm({...form, password: e.target.value})} />
              <select className="w-full p-3.5 glass-input" value={form.role} onChange={e => setForm({...form, role: e.target.value})}>
                <option value="TEACHER">Teacher</option>
                <option value="DOCTOR">Doctor</option>
                <option value="MAINTENANCE">Maintenance</option>
                <option value="ADMIN">Admin</option>
              </select>
              <button onClick={() => {
                if (form.username && form.password && form.full_name) {
                  add(form); setShow(false); setForm({ username: '', password: '', full_name: '', role: 'TEACHER' });
                  alert('User created!');
                } else alert('Fill all fields');
              }} className="w-full btn-primary py-3.5">Create</button>
            </div>
          )}
          <div className="space-y-3">
            {data.map(u => (
              <div key={u.id} className="glass p-4 flex justify-between items-center">
                <div>
                  <p className="font-medium">{u.full_name}</p>
                  <p className="text-xs text-secondary">{u.role}</p>
                </div>
                <button onClick={() => confirm('Delete ' + u.full_name + '?') && remove(u.id)} className="text-sm" style={{color:'var(--danger)'}}>Delete</button>
              </div>
            ))}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
