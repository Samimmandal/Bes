<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bes An Noor Model School (Boys' Unit)</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      background: #0b0b0e;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #ffffff;
    }
    .card {
      background: #1c1c1e;
      border-radius: 16px;
    }
    .header {
      background: rgba(11, 11, 14, 0.95);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .bottom-nav {
      background: rgba(20, 20, 23, 0.95);
      backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255,255,255,0.08);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;

    const SUPABASE_URL = 'https://peiybuhnozgqatdyrdhf.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBlaXlidWhub3pncWF0ZHlyZGhmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5NzIyNDEsImV4cCI6MjEwMjU0ODI0MX0.a_1otAvBMRa20HSA01jcvtCbxwUpXNbmCzVmA9Qm-DE';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function useCollection(table) {
      const [data, setData] = useState([]);
      const load = useCallback(async () => {
        const { data: rows } = await supabase.from(table).select('*').order('created_at', { ascending: false });
        setData(rows || []);
      }, [table]);

      useEffect(() => {
        load();
        const channel = supabase.channel(table)
          .on('postgres_changes', { event: '*', schema: 'public', table }, load)
          .subscribe();
        return () => supabase.removeChannel(channel);
      }, [table, load]);

      const add = async (row) => {
        const { error } = await supabase.from(table).insert([row]);
        if (error) alert(error.message);
        else load();
      };

      const update = async (id, changes) => {
        const { error } = await supabase.from(table).update(changes).eq('id', id);
        if (error) alert(error.message);
        else load();
      };

      return { data, add, update };
    }

    function App() {
      const [user, setUser] = useState(null);
      const [tab, setTab] = useState('home');
      const [showReg, setShowReg] = useState(false);

      const login = async (username, password) => {
        const { data, error } = await supabase
          .from('users')
          .select('*')
          .eq('username', username.trim())
          .eq('password', password.trim())
          .maybeSingle();

        if (error) return alert('Error: ' + error.message);
        if (!data) return alert('Invalid Login ID or Password');
        setUser({ id: data.username, name: data.full_name, role: data.role });
      };

      if (!user) {
        return showReg
          ? <Register onBack={() => setShowReg(false)} onSuccess={() => setShowReg(false)} />
          : <Login onLogin={login} onRegister={() => setShowReg(true)} />;
      }

      return (
        <div className="min-h-screen max-w-lg mx-auto flex flex-col">
          {/* Header */}
          <header className="header px-5 py-4 flex justify-between items-center sticky top-0 z-30">
            <div>
              <h1 className="text-lg font-bold tracking-tight">Bes An Noor Model School</h1>
              <p className="text-xs text-gray-400">(Boys' Unit)</p>
            </div>
            <button 
              onClick={() => { setUser(null); setTab('home'); }}
              className="text-sm bg-[#2c2c2e] hover:bg-[#3a3a3c] px-4 py-1.5 rounded-full text-gray-300 transition"
            >
              Logout
            </button>
          </header>

          {/* Main Content */}
          <main className="flex-1 overflow-y-auto px-4 py-5 pb-28">
            {tab === 'home' && <Home user={user} />}
            {tab === 'notices' && <Notices user={user} />}
            {tab === 'proxy' && <ProxyPage user={user} />}
            {tab === 'report' && <Report user={user} />}
            {tab === 'meeting' && <Meeting />}
            {tab === 'profile' && <Profile user={user} />}
            {tab === 'users' && user.role === 'ADMIN' && <Users />}
          </main>

          {/* Bottom Navigation */}
          <nav className="bottom-nav fixed bottom-0 left-0 right-0 max-w-lg mx-auto flex justify-around py-3 z-30">
            <NavButton active={tab === 'home'} onClick={() => setTab('home')} label="Home" />
            <NavButton active={tab === 'notices'} onClick={() => setTab('notices')} label="Notices" />
            <NavButton active={tab === 'proxy'} onClick={() => setTab('proxy')} label="Proxy" />
            <NavButton active={tab === 'report'} onClick={() => setTab('report')} label="Report" />
            <NavButton active={tab === 'meeting'} onClick={() => setTab('meeting')} label="Meeting" />
            <NavButton active={tab === 'profile'} onClick={() => setTab('profile')} label="Profile" />
          </nav>
        </div>
      );
    }

    function NavButton({ active, onClick, label }) {
      return (
        <button 
          onClick={onClick}
          className={`text-xs font-medium transition ${active ? 'text-red-500' : 'text-gray-500'}`}
        >
          {label}
        </button>
      );
    }

    function Login({ onLogin, onRegister }) {
      const [id, setId] = useState('');
      const [pass, setPass] = useState('');

      return (
        <div className="min-h-screen flex items-center justify-center p-6">
          <div className="w-full max-w-sm">
            <div className="text-center mb-10">
              <div className="w-20 h-20 mx-auto rounded-3xl bg-gradient-to-br from-red-500 to-pink-600 mb-5 shadow-lg shadow-red-500/20"></div>
              <h1 className="text-2xl font-bold">Bes An Noor Model School</h1>
              <p className="text-gray-400 text-sm mt-1">(Boys' Unit)</p>
            </div>

            <div className="card p-6 space-y-4">
              <input
                value={id}
                onChange={e => setId(e.target.value)}
                placeholder="Login ID"
                className="w-full p-3.5 bg-[#2c2c2e] rounded-2xl text-white border border-[#3a3a3c] focus:outline-none focus:border-red-500"
              />
              <input
                type="password"
                value={pass}
                onChange={e => setPass(e.target.value)}
                placeholder="Password"
                className="w-full p-3.5 bg-[#2c2c2e] rounded-2xl text-white border border-[#3a3a3c] focus:outline-none focus:border-red-500"
              />
              <button
                onClick={() => onLogin(id, pass)}
                className="w-full bg-gradient-to-r from-red-500 to-pink-600 text-white font-bold py-3.5 rounded-2xl shadow-lg shadow-red-500/25"
              >
                Continue
              </button>
            </div>

            <button onClick={onRegister} className="w-full text-center text-red-400 text-sm mt-6">
              Create Teacher / Staff Account
            </button>
          </div>
        </div>
      );
    }

    function Register({ onBack, onSuccess }) {
      const [form, setForm] = useState({ username: '', password: '', full_name: '', role: 'TEACHER' });

      const submit = async () => {
        if (!form.username || !form.password || !form.full_name) return alert('Please fill all fields');
        const { error } = await supabase.from('users').insert([{
          username: form.username.trim(),
          password: form.password.trim(),
          full_name: form.full_name.trim(),
          role: form.role
        }]);
        if (error) alert(error.message);
        else {
          alert('Account created!\n\nLogin ID: ' + form.username + '\nPassword: ' + form.password);
          onSuccess();
        }
      };

      return (
        <div className="min-h-screen flex items-center justify-center p-6">
          <div className="w-full max-w-sm card p-6 space-y-3">
            <h2 className="text-xl font-bold mb-2">Create Account</h2>
            <input placeholder="Full Name" className="w-full p-3.5 bg-[#2c2c2e] rounded-2xl text-white" value={form.full_name} onChange={e => setForm({...form, full_name: e.target.value})} />
            <input placeholder="Login ID" className="w-full p-3.5 bg-[#2c2c2e] rounded-2xl text-white" value={form.username} onChange={e => setForm({...form, username: e.target.value})} />
            <input type="password" placeholder="Password" className="w-full p-3.5 bg-[#2c2c2e] rounded-2xl text-white" value={form.password} onChange={e => setForm({...form, password: e.target.value})} />
            <select className="w-full p-3.5 bg-[#2c2c2e] rounded-2xl text-white" value={form.role} onChange={e => setForm({...form, role: e.target.value})}>
              <option value="TEACHER">Teacher</option>
              <option value="ADMIN">Admin</option>
              <option value="DOCTOR">Doctor</option>
              <option value="MAINTENANCE">Maintenance</option>
            </select>
            <button onClick={submit} className="w-full bg-gradient-to-r from-red-500 to-pink-600 text-white font-bold py-3.5 rounded-2xl mt-2">
              Create Account
            </button>
            <button onClick={onBack} className="w-full text-gray-400 text-sm mt-2">Back to Login</button>
          </div>
        </div>
      );
    }

    function Home({ user }) {
      const { data: attendance, add } = useCollection('attendance');
      const today = new Date().toISOString().split('T')[0];
      const mine = attendance.find(a => a.date === today && a.teacher_id === user.id);

      return (
        <div className="space-y-5">
          {/* Welcome Card */}
          <div className="card p-5">
            <h2 className="text-xl font-bold">Welcome, {user.name}</h2>
            <p className="text-sm text-gray-400 mt-1">{user.role}</p>
          </div>

          {/* Attendance Card */}
          <div className="card p-5">
            <h3 className="font-bold text-lg">Daily Attendance</h3>
            <p className="text-sm text-gray-400 mb-4">{new Date().toDateString()}</p>

            {mine ? (
              <div className={`inline-flex items-center px-5 py-2.5 rounded-full text-sm font-semibold ${
                mine.status === 'PRESENT' 
                  ? 'bg-green-500/15 text-green-400' 
                  : 'bg-orange-500/15 text-orange-400'
              }`}>
                {mine.status}
              </div>
            ) : (
              <div className="flex gap-3">
                <button
                  onClick={() => add({ date: today, teacher_id: user.id, name: user.name, status: 'PRESENT' })}
                  className="flex-1 bg-gradient-to-r from-red-500 to-pink-600 text-white py-3 rounded-2xl text-sm font-semibold"
                >
                  Present
                </button>
                <button
                  onClick={() => add({ date: today, teacher_id: user.id, name: user.name, status: 'ABSENT' })}
                  className="flex-1 bg-[#2c2c2e] text-orange-400 border border-orange-500/30 py-3 rounded-2xl text-sm font-semibold"
                >
                  Absent
                </button>
              </div>
            )}
          </div>

          {/* Admin Attendance Overview */}
          {user.role === 'ADMIN' && (
            <div className="card p-5">
              <h3 className="font-semibold mb-4">Today's Attendance</h3>
              {attendance.filter(a => a.date === today).length === 0 ? (
                <p className="text-sm text-gray-400">No one has marked attendance yet</p>
              ) : (
                <div className="space-y-2">
                  {attendance.filter(a => a.date === today).map(a => (
                    <div key={a.id} className="flex justify-between items-center py-2 border-b border-[#2c2c2e] last:border-0">
                      <span className="text-sm">{a.name}</span>
                      <span className={`text-xs font-medium ${a.status === 'PRESENT' ? 'text-green-400' : 'text-orange-400'}`}>
                        {a.status}
                      </span>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    function Notices({ user }) {
      const { data, add } = useCollection('notices');
      const [show, setShow] = useState(false);
      const [title, setTitle] = useState('');
      const [content, setContent] = useState('');

      return (
        <div className="space-y-5">
          <div className="flex justify-between items-center">
            <h2 className="text-2xl font-bold">Notices</h2>
            {user.role === 'ADMIN' && (
              <button onClick={() => setShow(!show)} className="text-red-400 text-sm font-medium bg-red-500/10 px-4 py-1.5 rounded-full">
                + Add
              </button>
            )}
          </div>

          {show && (
            <div className="card p-5 space-y-3">
              <input value={title} onChange={e => setTitle(e.target.value)} placeholder="Title" className="w-full p-3.5 bg-[#2c2c2e] rounded-2xl text-white" />
              <textarea value={content} onChange={e => setContent(e.target.value)} placeholder="Write notice..." className="w-full p-3.5 bg-[#2c2c2e] rounded-2xl text-white min-h-[100px]" />
              <button
                onClick={() => {
                  if (title && content) {
                    add({ title, content, author: user.name, type: 'text' });
                    setShow(false);
                    setTitle('');
                    setContent('');
                  }
                }}
                className="w-full bg-gradient-to-r from-red-500 to-pink-600 text-white font-bold py-3 rounded-2xl"
              >
                Publish
              </button>
            </div>
          )}

          {data.length === 0 && <p className="text-center text-gray-400 py-12">No notices yet</p>}

          {data.map(n => (
            <div key={n.id} className="card p-5 border-l-4 border-red-500">
              <h3 className="font-bold text-lg">{n.title}</h3>
              <p className="text-xs text-gray-400 mt-1 mb-3">By {n.author}</p>
              <p className="text-sm leading-relaxed">{n.content}</p>
            </div>
          ))}
        </div>
      );
    }

    function ProxyPage({ user }) {
      const { data, add } = useCollection('proxies');
      const [show, setShow] = useState(false);
      const [form, setForm] = useState({ date: '', absent_teacher: '', proxy_teacher: '', class_room: '', subject: '' });

      return (
        <div className="space-y-5">
          <div className="flex justify-between items-center">
            <div>
              <h2 className="text-2xl font-bold">Proxy Schedule</h2>
              <p className="text-sm text-gray-400">Substitution roster</p>
            </div>
            {user.role === 'ADMIN' && (
              <button onClick={() => setShow(!show)} className="text-red-400 text-sm font-medium bg-red-500/10 px-4 py-1.5 rounded-full">
                + Add
              </button>
            )}
          </div>

          {show && user.role === 'ADMIN' && (
            <div className="card p-5 space-y-3">
              <input type="date" className="w-full p-3.5 bg-[#2c2c2e] rounded-2xl text-white" value={form.date} onChange={e => setForm({...form, date: e.target.value})} />
              <input placeholder="Absent Teacher" className="w-full p-3.5 bg-[#2c2c2e] rounded-2xl text-white" value={form.absent_teacher} onChange={e => setForm({...form, absent_teacher: e.target.value})} />
              <input placeholder="Proxy Teacher" className="w-full p-3.5 bg-[#2c2c2e] rounded-2xl text-white" value={form.proxy_teacher} onChange={e => setForm({...form, proxy_teacher: e.target.value})} />
              <div className="grid grid-cols-2 gap-3">
                <input placeholder="Class" className="w-full p-3.5 bg-[#2c2c2e] rounded-2xl text-white" value={form.class_room} onChange={e => setForm({...form, class_room: e.target.value})} />
                <input placeholder="Subject" className="w-full p-3.5 bg-[#2c2c2e] rounded-2xl text-white" value={form.subject} onChange={e => setForm({...form, subject: e.target.value})} />
              </div>
              <button
                onClick={() => {
                  if (form.date && form.proxy_teacher) {
                    add(form);
                    setShow(false);
                    setForm({ date: '', absent_teacher: '', proxy_teacher: '', class_room: '', subject: '' });
                  }
                }}
                className="w-full bg-gradient-to-r from-red-500 to-pink-600 text-white font-bold py-3 rounded-2xl"
              >
                Assign Proxy
              </button>
            </div>
          )}

          {data.length === 0 && <p className="text-center text-gray-400 py-12">No proxy classes</p>}

          {data.map(p => (
            <div key={p.id} className="card p-5 border-l-4 border-red-500">
              <div className="flex justify-between text-xs mb-3">
                <span className="bg-red-500/15 text-red-400 px-3 py-1 rounded-full">{p.date}</span>
                <span className="bg-[#2c2c2e] px-3 py-1 rounded-full">{p.class_room}</span>
              </div>
              <p className="text-sm"><span className="text-gray-400">Substitute:</span> <b>{p.proxy_teacher}</b></p>
              <p className="text-sm text-gray-400 line-through mt-1">Replacing: {p.absent_teacher}</p>
              <p className="text-sm mt-2 pt-2 border-t border-[#2c2c2e]">Subject: {p.subject}</p>
            </div>
          ))}
        </div>
      );
    }

    function Report({ user }) {
      const { data: medical, add: addMed, update: upMed } = useCollection('medical');
      const { data: maint, add: addMaint, update: upMaint } = useCollection('maintenance');
      const [type, setType] = useState('medical');
      const [show, setShow] = useState(false);
      const [form, setForm] = useState({ student_name: '', class_name: '', reg: '', problem: '', issue_type: '', location: '' });

      const submit = () => {
        if (type === 'medical') {
          if (!form.student_name || !form.problem) return alert('Student Name and Problem are required');
          addMed({
            student_name: form.student_name,
            room: `Class: ${form.class_name || 'N/A'} | Reg: ${form.reg || 'N/A'}`,
            description: form.problem,
            reported_by: user.name,
            status: 'PENDING'
          });
        } else {
          if (!form.issue_type || !form.problem) return alert('Issue Type and Description are required');
          addMaint({
            type: form.issue_type,
            location: form.location || 'N/A',
            description: form.problem,
            reported_by: user.name,
            status: 'PENDING'
          });
        }
        setShow(false);
        setForm({ student_name: '', class_name: '', reg: '', problem: '', issue_type: '', location: '' });
      };

      const list = type === 'medical' ? medical : maint;
      const canResolve = (type === 'medical' && (user.role === 'DOCTOR' || user.role === 'ADMIN')) ||
                         (type === 'facility' && (user.role === 'MAINTENANCE' || user.role === 'ADMIN'));

      return (
        <div className="space-y-5">
          <div className="flex justify-between items-center">
            <h2 className="text-2xl font-bold">Report Issues</h2>
            {user.role === 'TEACHER' && (
              <button onClick={() => setShow(!show)} className="text-red-400 text-sm font-medium bg-red-500/10 px-4 py-1.5 rounded-full">
                + New
              </button>
            )}
          </div>

          <div className="flex bg-[#1c1c1e] p-1 rounded-2xl">
            <button onClick={() => setType('medical')} className={`flex-1 py-2.5 rounded-xl text-sm font-medium transition ${type === 'medical' ? 'bg-[#2c2c2e] text-white' : 'text-gray-400'}`}>
              Medical
            </button>
            <button onClick={() => setType('facility')} className={`flex-1 py-2.5 rounded-xl text-sm font-medium transition ${type === 'facility' ? 'bg-[#2c2c2e] text-white' : 'text-gray-400'}`}>
              Facility
            </button>
          </div>

          {show && user.role === 'TEACHER' && (
            <div className="card p-5 space-y-3">
              {type === 'medical' ? (
                <>
                  <input placeholder="Student Name *" className="w-full p-3.5 bg-[#2c2c2e] rounded-2xl text-white" value={form.student_name} onChange={e => setForm({...form, student_name: e.target.value})} />
                  <div className="grid grid-cols-2 gap-3">
                    <input placeholder="Class" className="w-full p-3.5 bg-[#2c2c2e] rounded-2xl text-white" value={form.class_name} onChange={e => setForm({...form, class_name: e.target.value})} />
                    <input placeholder="Registration No" className="w-full p-3.5 bg-[#2c2c2e] rounded-2xl text-white" value={form.reg} onChange={e => setForm({...form, reg: e.target.value})} />
                  </div>
                  <textarea placeholder="What problem does the student have? *" className="w-full p-3.5 bg-[#2c2c2e] rounded-2xl text-white min-h-[90px]" value={form.problem} onChange={e => setForm({...form, problem: e.target.value})} />
                </>
              ) : (
                <>
                  <input placeholder="Issue Type (Electrical, Water, etc) *" className="w-full p-3.5 bg-[#2c2c2e] rounded-2xl text-white" value={form.issue_type} onChange={e => setForm({...form, issue_type: e.target.value})} />
                  <input placeholder="Location" className="w-full p-3.5 bg-[#2c2c2e] rounded-2xl text-white" value={form.location} onChange={e => setForm({...form, location: e.target.value})} />
                  <textarea placeholder="Describe the problem *" className="w-full p-3.5 bg-[#2c2c2e] rounded-2xl text-white min-h-[90px]" value={form.problem} onChange={e => setForm({...form, problem: e.target.value})} />
                </>
              )}
              <button onClick={submit} className="w-full bg-gradient-to-r from-red-500 to-pink-600 text-white font-bold py-3.5 rounded-2xl">
                Submit Report
              </button>
            </div>
          )}

          {list.length === 0 && <p className="text-center text-gray-400 py-12">No issues reported yet</p>}

          {list.map(item => (
            <div key={item.id} className={`card p-5 border-l-4 ${item.status === 'RESOLVED' ? 'border-green-500 opacity-70' : 'border-red-500'}`}>
              <div className="flex justify-between items-start mb-2">
                <h4 className="font-bold">{type === 'medical' ? item.student_name : item.type}</h4>
                <span className={`text-xs px-2.5 py-1 rounded-full font-medium ${item.status === 'RESOLVED' ? 'bg-green-500/15 text-green-400' : 'bg-orange-500/15 text-orange-400'}`}>
                  {item.status}
                </span>
              </div>
              <p className="text-xs text-gray-400 mb-2">{item.room || item.location}</p>
              <p className="text-sm bg-[#252528] p-3 rounded-xl mb-2">{item.description}</p>
              <p className="text-xs text-gray-500 text-right">By {item.reported_by}</p>
              {item.status !== 'RESOLVED' && canResolve && (
                <button
                  onClick={() => type === 'medical' ? upMed(item.id, { status: 'RESOLVED' }) : upMaint(item.id, { status: 'RESOLVED' })}
                  className="mt-3 w-full bg-[#2c2c2e] hover:bg-[#3a3a3c] text-white py-2.5 rounded-xl text-sm font-medium"
                >
                  Mark as Resolved
                </button>
              )}
            </div>
          ))}
        </div>
      );
    }

    function Meeting() {
      const [room, setRoom] = useState('BesAnNoorMeeting');
      const [joined, setJoined] = useState(false);

      return (
        <div className="space-y-5">
          <h2 className="text-2xl font-bold">Online Meeting</h2>

          {!joined ? (
            <div className="card p-6 space-y-4">
              <p className="text-sm text-gray-400">
                Start a live video meeting inside the app. Share the same room name with teachers and the doctor.
              </p>
              <input
                value={room}
                onChange={e => setRoom(e.target.value)}
                placeholder="Room Name"
                className="w-full p-3.5 bg-[#2c2c2e] rounded-2xl text-white"
              />
              <button
                onClick={() => setJoined(true)}
                className="w-full bg-gradient-to-r from-red-500 to-pink-600 text-white font-bold py-3.5 rounded-2xl"
              >
                Start / Join Meeting
              </button>
            </div>
          ) : (
            <div className="space-y-3">
              <div className="flex justify-between items-center">
                <p className="text-sm text-gray-400">Room: <span className="text-white font-medium">{room}</span></p>
                <button onClick={() => setJoined(false)} className="text-sm text-red-400 font-medium">Leave Meeting</button>
              </div>
              <div className="rounded-2xl overflow-hidden bg-black" style={{ height: '65vh' }}>
                <iframe
                  src={`https://meet.jit.si/${room.replace(/\s+/g, '')}`}
                  allow="camera; microphone; fullscreen; display-capture; autoplay"
                  className="w-full h-full border-0"
                ></iframe>
              </div>
            </div>
          )}
        </div>
      );
    }

    function Profile({ user }) {
      return (
        <div className="space-y-5">
          <h2 className="text-2xl font-bold">My Profile</h2>
          <div className="card p-6 space-y-5">
            <div>
              <p className="text-xs text-gray-400 mb-1">Full Name</p>
              <p className="font-medium text-lg">{user.name}</p>
            </div>
            <div>
              <p className="text-xs text-gray-400 mb-1">Role</p>
              <p className="font-medium">{user.role}</p>
            </div>
            <div>
              <p className="text-xs text-gray-400 mb-1">Login ID</p>
              <p className="font-medium text-red-400 text-lg">{user.id}</p>
            </div>
          </div>
        </div>
      );
    }

    function Users() {
      const { data, add } = useCollection('users');
      const [show, setShow] = useState(false);
      const [form, setForm] = useState({ username: '', password: '', full_name: '', role: 'TEACHER' });

      return (
        <div className="space-y-5">
          <div className="flex justify-between items-center">
            <h2 className="text-2xl font-bold">Manage Users</h2>
            <button onClick={() => setShow(!show)} className="text-red-400 text-sm font-medium bg-red-500/10 px-4 py-1.5 rounded-full">
              + Add
            </button>
          </div>

          {show && (
            <div className="card p-5 space-y-3">
              <input placeholder="Full Name" className="w-full p-3.5 bg-[#2c2c2e] rounded-2xl text-white" value={form.full_name} onChange={e => setForm({...form, full_name: e.target.value})} />
              <input placeholder="Login ID" className="w-full p-3.5 bg-[#2c2c2e] rounded-2xl text-white" value={form.username} onChange={e => setForm({...form, username: e.target.value})} />
              <input placeholder="Password" className="w-full p-3.5 bg-[#2c2c2e] rounded-2xl text-white" value={form.password} onChange={e => setForm({...form, password: e.target.value})} />
              <select className="w-full p-3.5 bg-[#2c2c2e] rounded-2xl text-white" value={form.role} onChange={e => setForm({...form, role: e.target.value})}>
                <option value="TEACHER">Teacher</option>
                <option value="ADMIN">Admin</option>
                <option value="DOCTOR">Doctor</option>
                <option value="MAINTENANCE">Maintenance</option>
              </select>
              <button
                onClick={() => {
                  if (form.username && form.password && form.full_name) {
                    add(form);
                    setShow(false);
                    setForm({ username: '', password: '', full_name: '', role: 'TEACHER' });
                  }
                }}
                className="w-full bg-gradient-to-r from-red-500 to-pink-600 text-white font-bold py-3 rounded-2xl"
              >
                Create User
              </button>
            </div>
          )}

          <div className="space-y-3">
            {data.map(u => (
              <div key={u.id} className="card p-4">
                <p className="font-medium">{u.full_name}</p>
                <p className="text-xs text-gray-400 mt-1">{u.role}</p>
              </div>
            ))}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
